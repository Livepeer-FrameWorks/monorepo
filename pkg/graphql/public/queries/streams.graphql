query ListStreams($page: ConnectionInput, $search: String) {
  streamsConnection(page: $page, search: $search) {
    nodes {
      ...StreamFields
    }
    pageInfo {
      ...PageInfoFields
    }
    totalCount
  }
}

query GetStream($id: ID!) {
  stream(id: $id) {
    ...StreamFields
  }
}

# The publishing key of a push stream (null for pull and managed streams).
# The key lets its holder publish, so an API token needs streams:write.
# @target query.stream.streamKey
query GetStreamKey($id: ID!) {
  stream(id: $id) {
    id
    streamKey
  }
}

# Viewer and quality metrics require analytics:read. Ingest state uses streams:read.
# @target query.stream.metrics
query GetStreamMetrics($id: ID!) {
  stream(id: $id) {
    id
    metrics {
      ...StreamMetricsFields
    }
  }
}

# Viewer and quality metrics for the same page and search as ListStreams.
# Viewer and quality metrics require analytics:read. Ingest state uses streams:read.
# @target query.streamsConnection.nodes.metrics
query ListStreamMetrics($page: ConnectionInput, $search: String) {
  streamsConnection(page: $page, search: $search) {
    nodes {
      id
      streamId
      metrics {
        ...StreamMetricsFields
      }
    }
    pageInfo {
      ...PageInfoFields
    }
    totalCount
  }
}

# @target query.stream.pushTargets
query ListPushTargets($streamId: ID!) {
  stream(id: $streamId) {
    id
    pushTargets {
      ...PushTargetFields
    }
  }
}

# @target query.stream.ingest
query GetStreamIngest($id: ID!) {
  stream(id: $id) {
    id
    streamId
    ingest {
      state
      isLive
      sessionId
      connectedAt
      liveSince
      endedAt
      resumableUntil
    }
  }
}

# @target query.streamsConnection.nodes.ingest
query ListStreamIngest($page: ConnectionInput, $search: String) {
  streamsConnection(page: $page, search: $search) {
    nodes {
      id
      streamId
      ingest {
        state
        isLive
        sessionId
        connectedAt
        liveSince
        endedAt
        resumableUntil
      }
    }
    pageInfo {
      ...PageInfoFields
    }
    totalCount
  }
}
