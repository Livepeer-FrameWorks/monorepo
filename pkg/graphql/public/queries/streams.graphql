query ListStreams($page: ConnectionInput, $search: String) {
  streamsConnection(page: $page, search: $search) {
    nodes {
      ...StreamFields
    }
    pageInfo {
      ...PageInfoFields
    }
    totalCount
  }
}

query GetStream($id: ID!) {
  stream(id: $id) {
    ...StreamFields
  }
}

# The publishing key of a push stream (null for pull and managed streams).
# The key lets its holder publish, so an API token needs streams:write.
# @target query.stream.streamKey
query GetStreamKey($id: ID!) {
  stream(id: $id) {
    id
    streamKey
  }
}

# Live state comes from analytics: an API token needs analytics:read.
# @target query.stream.metrics
query GetStreamMetrics($id: ID!) {
  stream(id: $id) {
    id
    metrics {
      ...StreamMetricsFields
    }
  }
}

# Live state of a page of streams, for the same page and search as ListStreams.
# Live state comes from analytics: an API token needs analytics:read.
# @target query.streamsConnection.nodes.metrics
query ListStreamMetrics($page: ConnectionInput, $search: String) {
  streamsConnection(page: $page, search: $search) {
    nodes {
      id
      streamId
      metrics {
        ...StreamMetricsFields
      }
    }
    pageInfo {
      ...PageInfoFields
    }
    totalCount
  }
}

query ListStreamKeys($streamId: ID!, $page: ConnectionInput) {
  streamKeysConnection(streamId: $streamId, page: $page) {
    nodes {
      ...StreamKeyFields
    }
    pageInfo {
      ...PageInfoFields
    }
    totalCount
  }
}

# @target query.stream.pushTargets
query ListPushTargets($streamId: ID!) {
  stream(id: $streamId) {
    id
    pushTargets {
      ...PushTargetFields
    }
  }
}
