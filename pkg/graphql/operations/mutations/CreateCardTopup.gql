mutation CreateCardTopup($input: CreateCardTopupInput!) {
  createCardTopup(input: $input) {
    topupId
    checkoutUrl
    expiresAt
    amountCents
    currency
    conversion {
      originalAmountCents
      originalCurrency
      eurAmountCents
      unitsPerEur
      source
      referenceDate
    }
  }
}
