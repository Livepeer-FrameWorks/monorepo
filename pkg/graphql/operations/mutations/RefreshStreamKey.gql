# Regenerate a new stream key for a stream
mutation RefreshStreamKey($id: ID!, $endActiveSession: Boolean = false) {
  refreshStreamKey(id: $id, endActiveSession: $endActiveSession) {
    __typename
    ... on Stream {
      id
      name
      description
      streamKey
      playbackId
      record
      createdAt
      updatedAt
      ingest {
        state
        isLive
        sessionId
        connectedAt
        liveSince
        endedAt
        resumableUntil
      }
    }
    ... on ValidationError {
      ...ValidationErrorFields @mask_disable
    }
    ... on NotFoundError {
      ...NotFoundErrorFields @mask_disable
    }
    ... on AuthError {
      ...AuthErrorFields @mask_disable
    }
  }
}
