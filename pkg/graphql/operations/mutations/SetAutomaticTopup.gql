mutation SetAutomaticTopup($input: SetAutomaticTopupInput!) {
  setAutomaticTopup(input: $input) {
    enabled
    thresholdEurCents
    netAmountMinor
    monthlyGrossLimitMinor
    currency
    pausedReason
    monthlyReservedOrSpentMinor
    available
    unavailableReason
    consentVersion
  }
}
