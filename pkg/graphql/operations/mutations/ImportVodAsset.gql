mutation ImportVodAsset($input: ImportVodAssetInput!) {
  importVodAsset(input: $input) {
    ... on VodAsset {
      id
      artifactHash
      playbackId
      title
      description
      filename
      status
      createdAt
      updatedAt
      errorMessage
    }
    ... on ValidationError {
      message
      field
      code
    }
    ... on AuthError {
      message
      code
    }
  }
}
