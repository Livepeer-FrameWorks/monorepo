fragment BillingTierFields on BillingTier {
  id
  tierName
  tierLevel
  displayName
  description
  basePrice
  currency
  billingPeriod
  supportLevel
  slaLevel
  meteringEnabled
  isEnterprise
  features {
    supportLevel
    sla
    processingCustomizable
  }
  pricingRules {
    meter
    model
    currency
    includedQuantity
    unitPrice
    configJson
  }
  entitlements {
    key
    value
  }
}
