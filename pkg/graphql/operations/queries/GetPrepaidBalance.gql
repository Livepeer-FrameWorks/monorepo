query GetPrepaidBalance {
  prepaidBalance {
    id
    tenantId
    balanceCents
    reservedBalanceCents
    availableBalanceCents
    currency
    lowBalanceThresholdCents
    isLowBalance
    drainRateCentsPerHour
    paymentGrace {
      active
      endsAt
      remainingCreditCents
      mediaRecoveryUntil
    }
    createdAt
    updatedAt
  }
}
