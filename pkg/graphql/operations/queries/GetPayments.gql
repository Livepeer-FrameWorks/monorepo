query GetPayments($page: ConnectionInput) {
  paymentsConnection(page: $page) {
    edges {
      cursor
      node {
        id
        invoiceId
        method
        amount
        currency
        status
        confirmedAt
        createdAt
        updatedAt
        conversion {
          originalAmountCents
          originalCurrency
          eurAmountCents
          unitsPerEur
          source
          referenceDate
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}
