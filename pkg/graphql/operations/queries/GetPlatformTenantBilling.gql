# Platform-operator drill-down: one tenant's billing surface (snapshot,
# invoices, prepaid balance, transactions, usage). Requires the platform_operator grant.
query GetPlatformTenantBilling($id: ID!, $invoicesFirst: Int = 25, $timeRange: TimeRangeInput) {
  platform {
    tenant(id: $id) {
      tenantId
      billing {
        snapshot {
          billingModel
          status
          tierName
          nextBillingDate
          outstandingAmount
          overdueInvoices
          prepaidBalanceCents
          currency
          subscribedAt
        }
        lifecycle {
          billingStatus
          collectionReady
          collectionProvider
          effectiveBasePrice
          operatorGrant {
            basePrice
            waiveUsage
            collection
            expiresAt
            fallbackTierName
          }
          freeFallback {
            reason
            at
            stage
            providerCancelled
          }
          pendingTier {
            displayName
          }
          pendingEffectiveAt
          pendingReason
          pendingTierState
        }
        invoices(page: { first: $invoicesFirst }) {
          edges {
            node {
              id
              amount
              currency
              presentmentAmountCents
              presentmentCurrency
              presentmentUnitsPerEur
              presentmentReferenceDate
              status
              dueDate
              createdAt
            }
          }
          totalCount
        }
        prepaidBalance {
          balanceCents
          currency
        }
        balanceTransactions(page: { first: 25 }, timeRange: $timeRange) {
          nodes {
            id
            amountCents
            balanceAfterCents
            transactionType
            description
            createdAt
          }
          totalCount
        }
        usageRecords(page: { first: 50 }, timeRange: $timeRange) {
          nodes {
            id
            usageType
            usageValue
            clusterId
            periodStart
            periodEnd
          }
          totalCount
        }
      }
    }
  }
}
