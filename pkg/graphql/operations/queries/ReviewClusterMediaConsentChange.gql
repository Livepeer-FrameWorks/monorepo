query ReviewClusterMediaConsentChange($input: ReviewMediaCapacityConsentInput!) {
  reviewClusterMediaConsentChange(input: $input) {
    __typename
    ... on MediaPlacementReview {
      reviewToken
      digest
      expiresAt
      differences {
        path
        label
        before
        after
      }
      warnings {
        id
        severity
        message
        acknowledgementRequired
      }
      impact {
        affectedStreams
        activePublishers
        complete
        existingSessionsRetained
      }
    }
    ... on MediaPlacementError {
      ...MediaPlacementErrorFields @mask_disable
    }
    ... on AuthError {
      message
    }
    ... on NotFoundError {
      message
    }
  }
}
