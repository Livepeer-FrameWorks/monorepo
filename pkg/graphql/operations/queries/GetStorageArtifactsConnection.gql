query GetStorageArtifactsConnection($input: StorageArtifactsInput) {
  storageArtifactsConnection(input: $input) {
    nodes {
      key
      kind
      id
      hash
      playbackId
      streamId
      streamTitle
      title
      secondaryLabel
      description
      errorMessage
      sizeBytes
      status
      storageLocation
      storageClusterId
      syncStatus
      isSynced
      isFinalized
      hasLocalCopy
      createdAt
      updatedAt
      expiresAt
      effectiveRetention {
        retentionDays
        retentionUntil
        source
      }
      storageCost {
        perDay
        perMonth
        currency
      }
      deleteId
      retentionId
      thumbnailUrl
      durationSeconds
      tracks {
        type
        codec
        width
        height
        fps
        resolution
        bitrateKbps
        channels
        sampleRate
      }
      thumbnailAssets {
        posterUrl
        spriteVttUrl
        spriteJpgUrl
        assetKey
      }
    }
    totalCount
    hasNextPage
    limit
    offset
    lifecycleAvailable
    kindCounts {
      total
      vod
      dvr
      chapter
      clip
    }
  }
}
