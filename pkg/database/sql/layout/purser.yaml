  - purser.payment_reversals
  - purser.operator_credit_clawback_reversals
  - purser.mollie_payment_observations
  - purser.provider_webhook_inbox
  - purser.billing_event_outbox
  - purser.domain_event_outbox
  - purser.cluster_subscription_active_periods
  - purser.usage_records_quarantine
  - purser.media_authority_refresh_outbox
