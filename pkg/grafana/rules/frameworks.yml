groups:
  - name: frameworks.rules
    rules:
      # Always firing. Alertmanager routes it only to the external heartbeat,
      # which alarms when the periodic notifications stop arriving.
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: warning
        annotations:
          summary: "Alerting pipeline heartbeat"
          description: "Always fires so vmalert, Alertmanager and the external heartbeat prove end-to-end alert delivery; the heartbeat service alarms when these notifications stop."

      - alert: ServiceDown
        expr: up{frameworks_service!="", node_id!=""} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.frameworks_service }} on {{ $labels.node_id }} is unreachable"
          description: "VictoriaMetrics has been unable to scrape {{ $labels.instance }} (job {{ $labels.job }}) in {{ $labels.region }} for more than one minute. The process, host, or metrics endpoint is unavailable."

      - alert: TelemetryPlacementLabelsMissing
        expr: max by (job, instance) (up{frameworks_source!="", region=""} or up{frameworks_source!="", cluster=""} or up{frameworks_source!="", node_id=""}) >= 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Telemetry target {{ $labels.job }} at {{ $labels.instance }} lacks placement labels"
          description: "The managed scrape target is missing region, cluster, or node_id. Placement-aware dashboards and alerts cannot identify where this target runs; reconcile its vmagent configuration."

      # Media-authority and durable-trigger safety alerts
      - alert: MediaAuthorityDeliveryStuck
        expr: commodore_media_authority_oldest_pending_seconds > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Media authority delivery is not converging"
          description: "The oldest current {{ $labels.authority_kind }} authority has been unacknowledged for more than five minutes."

      - alert: MediaAuthorityVersionLag
        expr: commodore_media_authority_max_version_lag > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Media authority versions are lagging"
          description: "At least one target cell is more than one {{ $labels.authority_kind }} version behind."

      # The bulk lane is excluded: it carries fan-out and reconciliation, where a
      # tenant with thousands of objects legitimately takes longer than this, and
      # it never stands in front of a change.
      - alert: MediaAuthorityRefreshStuck
        expr: commodore_media_authority_refresh_oldest_pending_seconds{lane!="bulk"} > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Media authority refresh is not converging"
          description: "The oldest due {{ $labels.lane }} refresh obligation has waited more than five minutes. Source changes, including revocations, are not reaching signed authority. Run `frameworks cluster diagnose media-authority`."

      - alert: MediaAuthorityBulkRefreshStuck
        expr: commodore_media_authority_refresh_oldest_pending_seconds{lane="bulk"} > 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Media authority fan-out is not draining"
          description: "The oldest due bulk refresh obligation has waited more than an hour. A tenant change or a re-issue is not reaching that tenant's objects. Run `frameworks cluster diagnose media-authority`."

      # A cell asks the control plane about an authority past its validity, so this
      # costs latency while the control plane answers and refusals when it does
      # not. It means renewal did not reach an authority that is in use.
      - alert: MediaAuthorityExpiredWarm
        expr: commodore_media_authority_expired_warm > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "A media authority in use has expired"
          description: "{{ $value }} {{ $labels.authority_kind }} authorities that are still being renewed hold a version past its validity. Cells fetch them on every decision and refuse them if Commodore cannot be reached. Run `frameworks cluster diagnose media-authority`."

      - alert: MediaAuthorityObservationStale
        expr: time() - commodore_media_authority_observation_timestamp_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Media authority queue health is no longer being observed"
          description: "Queue observation has not completed for more than five minutes. Refresh and expiry gauges may be stale; inspect Commodore database-query failures with `frameworks cluster diagnose media-authority`."

      - alert: FoghornMediaAuthorityFetchFailing
        expr: sum by (instance) (rate(foghorn_media_authority_fetches_total{outcome="unavailable"}[10m])) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "A cell cannot fetch media authority it does not hold"
          description: "{{ $labels.instance }} could not fetch an authority for {{ $value }} decisions per second. Objects that have not been used for a while cannot be served from this cell until Commodore answers."

      - alert: MediaAuthorityRefreshParked
        expr: commodore_media_authority_refresh_parked > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "A media authority target cannot compile"
          description: "{{ $value }} {{ $labels.target_kind }} refresh target(s) are parked: their source state or static configuration cannot produce a valid authority. They are retried once per reconcile pass. `frameworks cluster diagnose media-authority` lists each target with its reason."

      - alert: MediaAuthorityRevocationCheckFailed
        expr: sum by (instance, stage) (increase(commodore_media_authority_revocation_check_failures_total[10m])) > 0
        labels:
          severity: critical
        annotations:
          summary: "A media authority access-revocation check could not complete"
          description: "Commodore could not complete {{ $labels.stage }} during compile-failure access checking. A previously signed allow may remain usable until retry or expiry. Inspect Commodore logs for authority_id and stage; original compile obligations retain their retry classification."

      - alert: MediaAuthorityRejectedDelivery
        expr: commodore_media_authority_rejected_deliveries > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "A cell refuses the current media authority"
          description: "{{ $value }} current {{ $labels.authority_kind }} authority deliveries were refused by their target cell on a precondition (newer held version, digest conflict, or terminal tombstone). Retrying cannot converge them; the cell and Commodore disagree about authority state."

      # Renewal is due a third of the way into a version's validity, whatever
      # that validity is (24 hours, 30 days, a 30-second quote). A renewal of a
      # version that has used less than a quarter of it is a scheduling defect,
      # so any sustained rate is one, regardless of how many authorities exist.
      - alert: MediaAuthorityVersionChurn
        expr: sum by (authority_kind) (rate(commodore_media_authority_early_renewals_total[30m])) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Media authorities are renewed before they are due"
          description: "{{ $labels.authority_kind }} authorities are being renewed early, {{ $value }} per second: versions replaced before a quarter of their validity had passed. Check renewal scheduling before delivery and audit tables grow."

      - alert: PurserMediaAuthorityRefreshWorkerDisabled
        expr: purser_media_authority_refresh_worker_ready == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Purser media-authority refresh worker is disabled"
          description: "Purser cannot drain durable authority-refresh obligations because a required database or Commodore dependency is unavailable."

      - alert: PurserMediaAuthorityRefreshStuck
        expr: purser_media_authority_refresh_oldest_pending_seconds > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Purser media-authority refresh queue is not converging"
          description: "The oldest billing-owned authority refresh was first enqueued more than five minutes ago and still has not completed."

      - alert: PurserMediaAuthorityRefreshFailures
        # A single failure is retried and usually recovers; the Stuck alert
        # covers a queue that does not converge. This one flags repeated
        # failures at one stage.
        expr: sum by (stage) (increase(purser_media_authority_refresh_failures_total[15m])) >= 3
        labels:
          severity: warning
        annotations:
          summary: "Purser media-authority refresh keeps failing"
          description: 'Purser failed at authority refresh stage {{ $labels.stage }} {{ printf "%.0f" $value }} times in 15 minutes. Purser logs name the tenant and the error.'

      - alert: QuartermasterMediaAuthorityRefreshStuck
        expr: quartermaster_media_authority_refresh_oldest_pending_seconds > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Quartermaster media-authority refresh queue is not converging"
          description: "The oldest tenant- or cluster-owned authority refresh was first enqueued more than five minutes ago and still has not reached Commodore. Tenant, cluster-access, and consent changes are not becoming signed authority."

      - alert: QuartermasterMediaAuthorityRefreshFailures
        # A single failure is retried and usually recovers; the Stuck alert
        # covers a queue that does not converge. This one flags repeated
        # failures at one stage.
        expr: sum by (stage) (increase(quartermaster_media_authority_refresh_failures_total[15m])) >= 3
        labels:
          severity: warning
        annotations:
          summary: "Quartermaster media-authority refresh keeps failing"
          description: 'Quartermaster failed at authority refresh stage {{ $labels.stage }} {{ printf "%.0f" $value }} times in 15 minutes. Quartermaster logs name the tenant and the error.'

      # One such read is ordinary: an object nobody used for a while runs out, and
      # the read that finds it asks the control plane for it and carries on. A
      # sustained rate is reads that keep finding expired authority, which is an
      # authority in use that renewal is not reaching (MediaAuthorityExpiredWarm
      # says which side) or a cell that cannot fetch.
      - alert: FoghornAuthorityHardExpired
        expr: sum by (instance) (rate(foghorn_media_authority_local_reads_total{outcome="hard_expired"}[15m])) > 0.05
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Foghorn keeps finding hard-expired local authority"
          description: "{{ $labels.instance }} has been reading authority past its validity for fifteen minutes. Each such read asks Commodore, and is refused when Commodore cannot be reached. Check `commodore_media_authority_expired_warm` and the cell's fetch outcomes."

      - alert: FoghornMediaAuthorityApplyRejected
        expr: increase(foghorn_media_authority_apply_total{outcome=~"verification_rejected|rollback_rejected|conflict_rejected|terminal_lifecycle_rejected|persist_error"}[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Foghorn rejected or could not persist signed authority"
          description: "A {{ $labels.authority_kind }} authority apply ended as {{ $labels.outcome }}. Delivery cannot converge until the signer, version, payload, or local database failure is corrected."

      - alert: FoghornMediaAuthorityStaleDelivery
        expr: increase(foghorn_media_authority_apply_total{outcome="stale_version_rejected"}[15m]) > 2
        labels:
          severity: warning
        annotations:
          summary: "Foghorn repeatedly received obsolete signed authority"
          description: "More than two already-superseded {{ $labels.authority_kind }} authorities reached one Foghorn within fifteen minutes. Current authority remains protected, but delivery ordering or replay is unhealthy."

      - alert: FoghornNodeAdmissionFailure
        expr: increase(foghorn_node_admission_events_total{result=~"failure|saturated"}[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Foghorn node admission is failing"
          description: "Durable node admission operation {{ $labels.operation }} returned {{ $labels.result }}. Outage enrollment may be unavailable for affected nodes."

      - alert: QuartermasterNodeIdentityRejected
        expr: increase(quartermaster_node_identity_rejections_total{reason=~"keyless|invalid_stored_key|key_mismatch"}[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Quartermaster rejected an enrolled node identity"
          description: "Strict node identity validation rejected a request as {{ $labels.reason }}. Use the scoped enrollment-token rotation procedure; do not restore fingerprint-only admission."

      - alert: FoghornAdmissionPayloadDecryptError
        expr: increase(foghorn_admission_payload_crypto_total{result="error"}[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Foghorn could not decrypt a durable admission obligation"
          description: "Admission side effects may be blocked by missing or inconsistent cell encryption material."

      - alert: FoghornRestreamReconciliationFailing
        expr: increase(foghorn_restream_reconcile_total{outcome=~"retryable_failure|terminal_failure|cleanup_unavailable|cleanup_failed|persist_failed|dispatch_failed|missing_revision|legacy_revision_lookup_failed|stale_attempt|batch_failed"}[10m]) > 3
        labels:
          severity: warning
        annotations:
          summary: "Restream desired state is not converging"
          description: "Repeated {{ $labels.operation }} outcomes ended as {{ $labels.outcome }}. Inspect the durable obligation and media-node destination policy."

      - alert: FoghornRestreamProtocolIncompatible
        expr: increase(foghorn_restream_reconcile_total{outcome=~"attempt_protocol_unsupported|missing_attempt"}[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "An edge cannot satisfy the restream attempt-fence protocol"
          description: "Restream activation was diagnosed as {{ $labels.outcome }}. Upgrade the affected edge sidecar; its durable target set will re-arm after reconnect."

      - alert: FoghornOfflineEffectDeadLetter
        expr: increase(foghorn_offline_effect_dead_letters_total{outcome="retained"}[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "A durable ingest-offline obligation exhausted retries"
          description: "A teardown or offline side effect is retained for diagnosis. A late generation-correlated teardown acknowledgement can still revive it."

      - alert: FoghornPushTargetStatusOutboxFailing
        expr: increase(foghorn_push_target_status_outbox_outcomes_total{outcome=~"claim_error|retry_error|settle_error"}[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Restream status delivery is failing"
          description: "The durable push-target status outbox cannot claim, reschedule, or settle an obligation."

      - alert: FoghornRestreamAttemptFenceRejecting
        expr: increase(foghorn_restream_final_fence_total{outcome=~"bind_failed|mist_id_mismatch|missing_reported_id"}[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Restream final reports are failing the runtime identity fence"
          description: "A final report could not be safely matched to the current activation attempt. Inspect control-protocol parity and Mist push identity reporting."

      - alert: FoghornRestreamReconcileSettlementFailing
        expr: increase(foghorn_restream_reconcile_total{outcome=~"legacy_settle_failed|stale_result"}[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Restream convergence results are stale or cannot settle"
          description: "Foghorn received a stale result or failed the rolling-upgrade settlement path. Verify Foghorn and Helmsman protocol versions."

      - alert: CommodoreFieldDecryptFailure
        expr: increase(commodore_field_decrypt_failures_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Commodore cannot decrypt application fields"
          description: "A {{ $labels.purpose }} value in {{ $labels.format }} format failed closed. Check field-key deployment and migration state."

      - alert: PeriscopeRestreamFactQuarantined
        expr: increase(periscope_ingest_clickhouse_inserts_total{table="restream_sessions_anomalous",status=~"invalid_identity|non_terminal_state|invalid_time_range"}[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Restream usage fact was quarantined"
          description: "A final restream event lacked a trustworthy identity, terminal state, or bounded time range and was excluded from billing."

      - alert: PeriscopeRestreamBytesUnobserved
        expr: increase(periscope_ingest_clickhouse_inserts_total{table="restream_sessions_anomalous",status="bytes_unobserved"}[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Restream byte usage was not observed"
          description: "A final restream event retained billable duration but lacked a trustworthy byte counter, so byte usage was recorded as zero."

      - alert: PeriscopeDeliveryLedgerRebuildLagging
        expr: min by (region, ledger) (periscope_ingest_ledger_rebuild_cursor_lag_seconds{ledger="delivery_usage_5m"}) > 900
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "The delivery ledger rebuild is behind"
          description: "The elected Periscope worker has not advanced the delivery ledger cursor to within the 15-minute rollout gate."

      - alert: PeriscopeDeliveryLedgerRebuildMissing
        expr: absent(periscope_ingest_ledger_rebuild_cursor_lag_seconds{ledger="delivery_usage_5m"})
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "The delivery ledger rebuild is not reporting"
          description: "No Periscope ingest replica is exporting the delivery-ledger cursor age; check crash loops and Postgres/ClickHouse connectivity."

      - alert: PeriscopeMalformedBillingFactSkipped
        expr: increase(periscope_metering_billing_malformed_facts_skipped_total[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Metering skipped a malformed canonical fact"
          description: "A canonical {{ $labels.fact_kind }} fact was skipped for {{ $labels.reason }} so the remaining billing slice could advance."

      - alert: PeriscopeProjectionDivergenceOrphanSkipped
        expr: increase(periscope_metering_projection_divergence_billing_total{outcome=~"orphan_skipped|malformed_skipped"}[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Metering skipped an orphan projection divergence"
          description: "A divergence row no longer has a canonical source fact. The slice advanced, but the orphan should be investigated and cleaned up."

      - alert: FoghornSourceAuthorityUnavailable
        expr: increase(foghorn_source_authorization_rejected_total{reason="authority_unavailable"}[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Foghorn cannot authorize source-origin lookups"
          description: "Stream tenant authority was unavailable, so source disclosure failed closed before federation or replication work."

      - alert: FoghornCrossClusterSourceDenied
        expr: increase(foghorn_source_authorization_rejected_total{reason="cluster_not_authorized"}[10m]) > 5
        labels:
          severity: warning
        annotations:
          summary: "Foghorn is rejecting cross-cluster source requests"
          description: "Signed edge callers repeatedly requested source origins outside their tenant-authorized cluster grants."

      - alert: QuartermasterLifecycleAuthorizationDenied
        expr: increase(quartermaster_grpc_requests_total{status="PermissionDenied",method=~".*(Cluster|EnrollmentToken|Node|Tenant).*"}[10m]) > 10
        labels:
          severity: warning
        annotations:
          summary: "Quartermaster lifecycle authorization denials increased"
          description: "Owner/admin, service identity, or tenant/resource binding checks are rejecting edge lifecycle calls."

      - alert: QuartermasterKeylessNodeReconnectRejected
        expr: increase(quartermaster_node_identity_rejections_total{reason=~"keyless|invalid_stored_key"}[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "An enrolled node requires identity-key recovery"
          description: "Strict no-TOFU enforcement rejected an active fingerprint; issue a fresh scoped token and use the documented rotation flow."

      - alert: QuartermasterDNSDesiredStateDrift
        expr: increase(quartermaster_dns_backstop_repairs_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "DNS desired/applied state drift required repair"
          description: "Quartermaster's backstop found missing or stale {{ $labels.resource }} state and enqueued {{ $labels.action }}."

      - alert: QuartermasterNavigatorOutboxFailing
        expr: increase(quartermaster_navigator_outbox_failures_total[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Navigator DNS hand-off is not converging"
          description: "A {{ $labels.resource }} outbox delivery failed and remains queued for retry."

      - alert: QuartermasterNavigatorOutboxBacklog
        expr: quartermaster_navigator_outbox_pending > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Navigator DNS hand-off backlog is not draining"
          description: "Incomplete {{ $labels.resource }} outbox rows have remained pending for fifteen minutes."

      - alert: QuartermasterStaleBillingEntitlement
        expr: increase(quartermaster_billing_entitlement_stale_total[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "A stale billing entitlement observation was fenced"
          description: "Purser attempted an older entitlement materialization; inspect concurrent webhook/bootstrap/sweep reconciliation."

      - alert: PurserTierAccessReconciliationFailing
        expr: increase(purser_tier_access_reconciliation_failures_total[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Purser tier access reconciliation is failing"
          description: "The bounded {{ $labels.operation }} reconciliation path failed; inspect Purser logs and Quartermaster availability before DNS or access state drifts further. An operation=sweep failure blocks the tenant-DNS postdeploy migration until a complete sweep writes its receipt."

      - alert: FoghornConfigSeedAckOutboxStuck
        expr: foghorn_config_seed_apply_ack_outbox_pending > 0 and foghorn_config_seed_apply_ack_outbox_oldest_pending_seconds > 600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Foghorn ConfigSeed acknowledgements are not reaching Navigator"
          description: "At least one durable ConfigSeed apply acknowledgement has remained pending for more than ten minutes; inspect Navigator reachability and Foghorn delivery logs."

      - alert: FoghornConfigSeedAckQuarantined
        expr: foghorn_config_seed_apply_ack_outbox_quarantined > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Foghorn quarantined an invalid ConfigSeed acknowledgement"
          description: "A durable ConfigSeed apply acknowledgement failed identity or signature validation and requires operator inspection."

      - alert: HelmsmanTriggerWALStuck
        expr: helmsman_trigger_wal_pending > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Helmsman durable trigger WAL is not draining"
          description: "One or more Mist lifecycle triggers have awaited a positive Foghorn acknowledgement for ten minutes."

      - alert: HelmsmanCredentialCleanupStuck
        expr: helmsman_credential_cleanup_pending > 0 and helmsman_credential_cleanup_pending_seconds > 300 and helmsman_credential_cleanup_observation_error == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Consumed edge enrollment credentials remain on disk"
          description: "The root credential scrubber has not completed an accepted enrollment request for more than five minutes; inspect the credential-scrubber service and its fixed env-file mounts."

      - alert: HelmsmanCredentialCleanupObservationFailed
        expr: helmsman_credential_cleanup_observation_error > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Helmsman cannot verify enrollment credential cleanup state"
          description: "The cleanup observer cannot safely read or trust the enrollment state directory; inspect its mount, ownership, permissions, and any unexpected symlinks."

      - alert: HelmsmanStreamEndRetrying
        expr: increase(helmsman_trigger_ack_outcomes_total{trigger_type="STREAM_END",outcome="retryable"}[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "STREAM_END is being retried"
          description: "A tenant-unresolved or downstream-failed STREAM_END remains in the Helmsman WAL; inspect WAL depth and Foghorn logs."

      - alert: HelmsmanMistAPIUnreachable
        expr: helmsman_mist_api_reachable == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "MistServer controller API is not answering Helmsman"
          description: "Authenticated api2 calls from Helmsman keep failing, so Foghorn has marked the node unhealthy and excluded it from placement and processing. Check the frameworks-mistserver unit and the controller listener on 4242; restart the unit if the controller is wedged."

      # Crypto custody and scanner safety alerts
      - alert: CryptoScannerLagging
        expr: max by (region, network) (purser_crypto_scanner_block{head="finalized"}) - on(region, network) max by (region, network) (purser_crypto_scanner_block{head="cursor"}) > 500
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Crypto scanner is behind on {{ $labels.network }}"
          description: "The durable deposit cursor is more than 500 finalized blocks behind. New production crypto methods should fail readiness."

      - alert: CryptoScannerErrors
        expr: sum by (region, cluster, network, stage, reason) (increase(purser_crypto_scanner_errors_total{stage!="", reason!=""}[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Crypto scanner {{ $labels.reason }} during {{ $labels.stage }} on {{ $labels.network }}"
          description: 'The {{ $labels.network }} deposit scanner hit {{ $labels.reason }} during {{ $labels.stage }} {{ printf "%.0f" $value }} time(s) in five minutes. The full provider or database error is in purser.crypto_scan_cursors.last_error and Purser logs for this network.'

      - alert: CryptoCustodyBalanceAtRisk
        expr: purser_crypto_unswept_base_units > 0 and on(region, network, asset) purser_crypto_oldest_unswept_age_seconds > 21600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Confirmed {{ $labels.asset }} remains unswept on {{ $labels.network }}"
          description: "Customer custody funds have remained outside the approved treasury for more than six hours."

      - alert: CryptoSweepItemFailed
        expr: purser_crypto_failed_sweep_items > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Crypto sweep item failed on {{ $labels.network }}"
          description: "At least one {{ $labels.asset }} sweep item requires operator reconciliation."

      - alert: CryptoSweepRelayerGasLow
        expr: purser_crypto_sweep_relayer_balance_eth < 0.005
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "USDC sweep relayer gas is low on {{ $labels.network }}"
          description: 'The {{ $labels.network }} USDC sweep relayer has {{ printf "%.6f" $value }} native ETH remaining; at least 0.005 is required for bounded relay gas. Fund the dedicated relayer before queued sweeps stall.'

      - alert: CryptoAllocatedDepositReorg
        expr: increase(purser_crypto_deposit_reorg_reversals_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Allocated crypto deposit was reversed on {{ $labels.network }}"
          description: "A previously credited {{ $labels.purpose }} deposit failed a later canonicality check. Stop new money movement and investigate."

      - alert: X402SettlementLatencyHigh
        expr: purser_x402_settlement_latency_p95_seconds > 120
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "x402 settlement latency is high on {{ $labels.network }}"
          description: "P95 finalized settlement latency over the last 24 hours exceeds two minutes."

      - alert: X402QuoteConversionLow
        expr: purser_x402_quote_conversion_ratio < 0.2
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "x402 quote conversion is low on {{ $labels.network }}"
          description: "Fewer than 20% of x402 quotes created in the last 24 hours reached confirmed settlement."

      - alert: CryptoAccountingAnomalyOpen
        expr: purser_crypto_accounting_anomalies > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Crypto accounting anomaly requires operator action"
          description: "Open {{ $labels.kind }} entries exist in the durable crypto accounting queue."

      - alert: CryptoAccountingAnomalyAging
        expr: purser_crypto_accounting_anomaly_oldest_age_seconds > 3600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Crypto accounting anomaly is older than one hour"
          description: "The oldest open {{ $labels.kind }} entry has not been resolved within one hour."

      - alert: CryptoInvoiceDepositNeedsReview
        expr: purser_crypto_invoice_review_items > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Crypto invoice deposit requires review on {{ $labels.network }}"
          description: "A partial, late, unsupported, or conflicting invoice deposit is waiting for operator allocation."

      - alert: CryptoDepositReconciliationStuck
        expr: purser_crypto_deposit_events{status=~"observed|confirmed"} > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Crypto deposit reconciliation is not converging on {{ $labels.network }}"
          description: "Deposit events have remained before allocation for at least fifteen minutes."

      # Every Bosun replica samples the same ledger, so max across replicas is
      # the platform-wide backlog age.
      - alert: BosunWebhookDeliveryBacklog
        expr: max(bosun_oldest_due_delivery_seconds) > 900
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Webhook deliveries are waiting to be sent"
          description: 'The oldest due webhook delivery has waited {{ printf "%.0f" $value }} seconds. Workers are not keeping up, the database is slow, or one endpoint at its in-flight limit has a large backlog; inspect bosun_delivery_attempts_total and bosun_internal_errors_total.'

      - alert: BosunDomainEventConsumerLag
        expr: max by (topic) (sum by (topic, instance) (bosun_kafka_consumer_lag)) > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Bosun is behind on {{ $labels.topic }}"
          description: 'Bosun has {{ printf "%.0f" $value }} unconsumed records on {{ $labels.topic }}. New webhook deliveries are delayed; a stalled ledger write retries in place and holds the partition.'

      - alert: BosunInternalDeliveryFailures
        expr: sum(increase(bosun_internal_errors_total{stage!="settle_fenced"}[15m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Bosun left claimed webhook deliveries unsent"
          description: "Claims, signing-secret decryption, rendering, or settlement failed on the Bosun side. A permanent cause fails the delivery with error class internal and a transient one retries it after a backoff; a failed claim or settlement retries when the lease expires. Check Bosun logs by stage."

  # Multi-region release gate. Every scraped series carries region and cluster
  # external labels from the vmagent that collected it.
  - name: multiregion.rules
    rules:
      # lag() is the MetricsQL age of the newest sample in the window. A region
      # is stale only when no series from any host in it has reported, so one
      # failed host does not page for the whole region; a region silent for
      # longer than the 2h window drops out and ServiceDown history remains.
      - alert: RegionalTelemetryStale
        expr: min by (region) (lag(up{region!=""}[2h])) > 300
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "No telemetry from region {{ $labels.region }}"
          description: "No vmagent in region {{ $labels.region }} has delivered a sample for more than five minutes. Check the region's vmagent remote write path and cross-region connectivity."

      # replication_latency_ms_max is the windowed maximum time a record took
      # from the source cluster to the target cluster. region is the worker
      # host's region, which is always the link's target region.
      - alert: MM2ReplicationLagHigh
        expr: max by (region, source, target) (kafka_connect_mirror_source_connector_replication_latency_ms_max) > 60000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "MirrorMaker2 link {{ $labels.source }} -> {{ $labels.target }} is lagging"
          description: "Records on the {{ $labels.source }} -> {{ $labels.target }} link have taken more than 60 seconds to replicate for ten minutes. Regional realtime delivery and aggregator analytics or billing are delayed."

      - alert: SignalmanConsumerLagHigh
        expr: max by (region, cluster, node_id, instance, topic) (signalman_kafka_consumer_lag{region!="", node_id!=""}) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Signalman on {{ $labels.node_id }} is behind on {{ $labels.topic }}"
          description: 'Signalman at {{ $labels.instance }} in {{ $labels.region }} has {{ printf "%.0f" $value }} unconsumed messages on {{ $labels.topic }}. Realtime subscribers routed to this replica are delayed.'

      - alert: FoghornRedisDisconnected
        expr: min by (region, cluster, instance) (foghorn_redis_connected) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Foghorn {{ $labels.instance }} in {{ $labels.region }} cannot reach Redis"
          description: "Foghorn {{ $labels.instance }} ({{ $labels.cluster }}) has failed its Redis ping for two minutes. Shared cell state, relay grants, and the HA command relay depend on Redis."

      - alert: ControlCellReassignmentStuck
        expr: max by (region) (quartermaster_control_cell_reassignments{state="failed"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "A control-cell reassignment failed its deadline"
          description: "At least one tenant-private cluster has a failed control-cell reassignment: edges were still observed by another cell at the deadline. Inspect it with `frameworks admin clusters control-cell <cluster-id>` and reassign again or back."
