rule_files:
  - ../frameworks.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: purser_tier_downgrades_held_items{instance="a"}
        values: "0 1x7 0x5"
      - series: purser_tier_downgrades_held_items{instance="b"}
        values: "0 1x7 0x5"
    alert_rule_test:
      - eval_time: 4m
        groupname: frameworks.rules
        alertname: PurserTierDowngradeHeld
        exp_alerts: []
      - eval_time: 7m
        groupname: frameworks.rules
        alertname: PurserTierDowngradeHeld
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: A confirmed downgrade is held past its effective time
              description: "The provider already charges the lower tier, but the local tier has not flipped and the customer's tier changes are refused, or Purser cannot read its held downgrade count from its database. Run frameworks admin billing recovery list: its held downgrades section names each tenant, target tier and closing invoice. frameworks admin billing recovery downgrade --tenant-id <tenant> --reason <reason> shows what holds it (provider confirmation, a draft or manual_review invoice, or a pricing refusal) and, once nothing does, applies it. frameworks cluster doctor --deep also names the tenants of held downgrades. For read failures, restore Purser's database connection."
      - eval_time: 10m
        groupname: frameworks.rules
        alertname: PurserTierDowngradeHeld
        exp_alerts: []
  # The gauge keeps its last good value while reads fail, so only the
  # counter shows an unreadable held-downgrade count.
  - interval: 1m
    input_series:
      - series: purser_tier_downgrades_held_items{instance="a"}
        values: "0x20"
      - series: purser_tier_downgrades_held_read_failures_total{instance="a"}
        values: "0+1x8 8x7"
      - series: purser_tier_downgrades_held_read_failures_total{instance="b"}
        values: "0+1x8 8x7"
    alert_rule_test:
      - eval_time: 4m
        groupname: frameworks.rules
        alertname: PurserTierDowngradeHeld
        exp_alerts: []
      - eval_time: 7m
        groupname: frameworks.rules
        alertname: PurserTierDowngradeHeld
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: A confirmed downgrade is held past its effective time
              description: "The provider already charges the lower tier, but the local tier has not flipped and the customer's tier changes are refused, or Purser cannot read its held downgrade count from its database. Run frameworks admin billing recovery list: its held downgrades section names each tenant, target tier and closing invoice. frameworks admin billing recovery downgrade --tenant-id <tenant> --reason <reason> shows what holds it (provider confirmation, a draft or manual_review invoice, or a pricing refusal) and, once nothing does, applies it. frameworks cluster doctor --deep also names the tenants of held downgrades. For read failures, restore Purser's database connection."
      - eval_time: 12m
        groupname: frameworks.rules
        alertname: PurserTierDowngradeHeld
        exp_alerts: []
  # A single failed read is retried on the next observation and does not fire.
  - interval: 1m
    input_series:
      - series: purser_tier_downgrades_held_items{instance="a"}
        values: "0x15"
      - series: purser_tier_downgrades_held_read_failures_total{instance="a"}
        values: "0x2 1x12"
    alert_rule_test:
      - eval_time: 12m
        groupname: frameworks.rules
        alertname: PurserTierDowngradeHeld
        exp_alerts: []
