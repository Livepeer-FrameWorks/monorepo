# Each failing stage fires with its own label and remedy; a queue read failure
# fires without one.
rule_files:
  - ../frameworks.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: purser_free_fallback_repeatedly_failed_items{instance="a",stage="move"}
        values: "0 1x7 0x4"
      - series: purser_free_fallback_repeatedly_failed_items{instance="b",stage="move"}
        values: "0 1x7 0x4"
    alert_rule_test:
      - eval_time: 4m
        groupname: frameworks.rules
        alertname: PurserFreeFallbackStuck
        exp_alerts: []
      - eval_time: 7m
        groupname: frameworks.rules
        alertname: PurserFreeFallbackStuck
        exp_alerts:
          - exp_labels:
              severity: warning
              stage: move
            exp_annotations:
              summary: Move to Free or its notification needs recovery
              description: "A move to Free keeps failing: provider cancellation, the final invoice or the tier change, or a bank settlement has waited over fourteen days. Run frameworks admin billing recovery list; its free_fallback rows name the tenant and the last error. Restore provider access or the missing metering and Purser retries, or cancel the fallback with frameworks admin billing set-tier. Other tenants continue."
      - eval_time: 10m
        groupname: frameworks.rules
        alertname: PurserFreeFallbackStuck
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: purser_free_fallback_repeatedly_failed_items{instance="a",stage="notice"}
        values: "0 1x7 0x4"
      - series: purser_free_fallback_repeatedly_failed_items{instance="a",stage="move"}
        values: "0x12"
    alert_rule_test:
      - eval_time: 7m
        groupname: frameworks.rules
        alertname: PurserFreeFallbackStuck
        exp_alerts:
          - exp_labels:
              severity: warning
              stage: notice
            exp_annotations:
              summary: Move to Free or its notification needs recovery
              description: "A grace or completed-move email to a tenant keeps failing. Run frameworks admin billing recovery list; its free_fallback rows name the tenant and the delivery error. Fix the tenant's billing_email; after five failures the row shows notice_abandoned and frameworks admin billing recovery notice --tenant-id <tenant> --reason <reason> sends it again. Mail failures never block the move itself. Other tenants continue."
      - eval_time: 10m
        groupname: frameworks.rules
        alertname: PurserFreeFallbackStuck
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: purser_free_fallback_repeatedly_failed_items{instance="a",stage="move"}
        values: "0 NaNx20 0x35"
      - series: purser_free_fallback_read_failures_total{instance="a"}
        values: "0+1x20 20x35"
      - series: purser_free_fallback_read_failures_total{instance="b"}
        values: "0+1x20 20x35"
    alert_rule_test:
      - eval_time: 4m
        groupname: frameworks.rules
        alertname: PurserFreeFallbackStuck
        exp_alerts: []
      - eval_time: 7m
        groupname: frameworks.rules
        alertname: PurserFreeFallbackStuck
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Move to Free or its notification needs recovery
              description: "Purser cannot read its Free fallback queue from its database, so moves to Free and their emails are not being retried. Restore Purser's database connection. Other tenants continue."
      - eval_time: 50m
        groupname: frameworks.rules
        alertname: PurserFreeFallbackStuck
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: purser_free_fallback_repeatedly_failed_items{instance="a",stage="move"}
        values: "0x35"
      - series: purser_free_fallback_read_failures_total{instance="a"}
        values: "0 1x35"
    alert_rule_test:
      - eval_time: 20m
        groupname: frameworks.rules
        alertname: PurserFreeFallbackStuck
        exp_alerts: []
