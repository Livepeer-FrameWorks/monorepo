# Both recovery queues fire after five minutes and resolve when drained.
rule_files:
  - ../frameworks.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: commodore_tenant_account_closure_repeatedly_failed_items{instance="a"}
        values: "0 1x7 0x4"
      - series: purser_operator_grant_expiry_repeatedly_failed_items{instance="a"}
        values: "0 1x7 0x4"
      - series: commodore_tenant_account_closure_repeatedly_failed_items{instance="b"}
        values: "0 1x7 0x4"
      - series: purser_operator_grant_expiry_repeatedly_failed_items{instance="b"}
        values: "0 1x7 0x4"
    alert_rule_test:
      - eval_time: 4m
        groupname: frameworks.rules
        alertname: CommodoreTenantAccountClosureStuck
        exp_alerts: []
      - eval_time: 7m
        groupname: frameworks.rules
        alertname: CommodoreTenantAccountClosureStuck
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Tenant closure is awaiting synchronization
              description: A closed tenant's Quartermaster teardown has failed more than once, or Commodore cannot read its closure queue from its database. Commodore retries every minute and logs each failure as "Finish tenant closure" with tenant_id and the Quartermaster error. frameworks cluster doctor --deep names the affected tenants; frameworks admin tenants get <tenant> shows the Quartermaster synchronization as failing, with its attempts and that error. Restore Commodore's connection to Quartermaster, or Commodore's database for read failures; the closure completes on the next retry. Access is already revoked locally, so users stay closed while this fires.
      - eval_time: 10m
        groupname: frameworks.rules
        alertname: CommodoreTenantAccountClosureStuck
        exp_alerts: []
      - eval_time: 4m
        groupname: frameworks.rules
        alertname: PurserOperatorGrantExpiryStuck
        exp_alerts: []
      - eval_time: 7m
        groupname: frameworks.rules
        alertname: PurserOperatorGrantExpiryStuck
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Operator grant expiry needs recovery
              description: "An operator grant past its deadline failed billing-boundary reconciliation more than once, or Purser cannot read its expiry queue. Run frameworks admin billing grant list --include-expired: it names each tenant with its failed attempts and last error, and grant show --tenant-id <tenant> shows one in full. Correct the billing or pricing error; retries run every five minutes. Other expiries continue."
      - eval_time: 10m
        groupname: frameworks.rules
        alertname: PurserOperatorGrantExpiryStuck
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: commodore_tenant_account_closure_repeatedly_failed_items{instance="a"}
        values: "0 NaNx20 0x12"
      - series: commodore_tenant_account_closure_read_failures_total{instance="a"}
        values: "0+1x20 20x30"
      - series: commodore_tenant_account_closure_read_failures_total{instance="b"}
        values: "0+1x20 20x30"
    alert_rule_test:
      - eval_time: 4m
        groupname: frameworks.rules
        alertname: CommodoreTenantAccountClosureStuck
        exp_alerts: []
      - eval_time: 7m
        groupname: frameworks.rules
        alertname: CommodoreTenantAccountClosureStuck
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Tenant closure is awaiting synchronization
              description: A closed tenant's Quartermaster teardown has failed more than once, or Commodore cannot read its closure queue from its database. Commodore retries every minute and logs each failure as "Finish tenant closure" with tenant_id and the Quartermaster error. frameworks cluster doctor --deep names the affected tenants; frameworks admin tenants get <tenant> shows the Quartermaster synchronization as failing, with its attempts and that error. Restore Commodore's connection to Quartermaster, or Commodore's database for read failures; the closure completes on the next retry. Access is already revoked locally, so users stay closed while this fires.
      - eval_time: 19m
        groupname: frameworks.rules
        alertname: CommodoreTenantAccountClosureStuck
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Tenant closure is awaiting synchronization
              description: A closed tenant's Quartermaster teardown has failed more than once, or Commodore cannot read its closure queue from its database. Commodore retries every minute and logs each failure as "Finish tenant closure" with tenant_id and the Quartermaster error. frameworks cluster doctor --deep names the affected tenants; frameworks admin tenants get <tenant> shows the Quartermaster synchronization as failing, with its attempts and that error. Restore Commodore's connection to Quartermaster, or Commodore's database for read failures; the closure completes on the next retry. Access is already revoked locally, so users stay closed while this fires.
      - eval_time: 50m
        groupname: frameworks.rules
        alertname: CommodoreTenantAccountClosureStuck
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: purser_operator_grant_expiry_repeatedly_failed_items{instance="a"}
        values: "0 NaNx20 0x12"
      - series: purser_operator_grant_expiry_read_failures_total{instance="a"}
        values: "0+1x20 20x30"
      - series: purser_operator_grant_expiry_read_failures_total{instance="b"}
        values: "0+1x20 20x30"
    alert_rule_test:
      - eval_time: 4m
        groupname: frameworks.rules
        alertname: PurserOperatorGrantExpiryStuck
        exp_alerts: []
      - eval_time: 7m
        groupname: frameworks.rules
        alertname: PurserOperatorGrantExpiryStuck
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Operator grant expiry needs recovery
              description: "An operator grant past its deadline failed billing-boundary reconciliation more than once, or Purser cannot read its expiry queue. Run frameworks admin billing grant list --include-expired: it names each tenant with its failed attempts and last error, and grant show --tenant-id <tenant> shows one in full. Correct the billing or pricing error; retries run every five minutes. Other expiries continue."
      - eval_time: 19m
        groupname: frameworks.rules
        alertname: PurserOperatorGrantExpiryStuck
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Operator grant expiry needs recovery
              description: "An operator grant past its deadline failed billing-boundary reconciliation more than once, or Purser cannot read its expiry queue. Run frameworks admin billing grant list --include-expired: it names each tenant with its failed attempts and last error, and grant show --tenant-id <tenant> shows one in full. Correct the billing or pricing error; retries run every five minutes. Other expiries continue."
      - eval_time: 50m
        groupname: frameworks.rules
        alertname: PurserOperatorGrantExpiryStuck
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: commodore_tenant_account_closure_read_failures_total{instance="a"}
        values: "0 2x20"
      - series: purser_operator_grant_expiry_read_failures_total{instance="a"}
        values: "0 2x20"
    alert_rule_test:
      - eval_time: 7m
        groupname: frameworks.rules
        alertname: CommodoreTenantAccountClosureStuck
        exp_alerts: []
      - eval_time: 7m
        groupname: frameworks.rules
        alertname: PurserOperatorGrantExpiryStuck
        exp_alerts: []
      - eval_time: 10m
        groupname: frameworks.rules
        alertname: CommodoreTenantAccountClosureStuck
        exp_alerts: []
      - eval_time: 10m
        groupname: frameworks.rules
        alertname: PurserOperatorGrantExpiryStuck
        exp_alerts: []
  - interval: 1m
    input_series:
      # Two replicas report cell eu until it clears; cell us stays stuck. Each
      # cell fires and resolves on its own.
      - series: commodore_account_ingest_stop_oldest_pending_seconds{instance="a",cell="eu"}
        values: "0 600x10 0x5"
      - series: commodore_account_ingest_stop_oldest_pending_seconds{instance="b",cell="eu"}
        values: "0 600x10 0x5"
      - series: commodore_account_ingest_stop_oldest_pending_seconds{instance="a",cell="us"}
        values: "0 600x20"
    alert_rule_test:
      - eval_time: 4m
        groupname: frameworks.rules
        alertname: CommodoreAccountIngestRevocationStuck
        exp_alerts: []
      - eval_time: 7m
        groupname: frameworks.rules
        alertname: CommodoreAccountIngestRevocationStuck
        exp_alerts:
          - exp_labels:
              severity: warning
              cell: eu
            exp_annotations:
              summary: Cell eu has not accepted an account session stop
              description: "A revoked user, tenant or stream still has an ingest stop that cell eu has not accepted, including backoff. frameworks cluster doctor --deep names the affected tenants and frameworks admin tenants get <tenant> lists each pending stop with its cells and last error. Restore cell eu, or upgrade its Foghorn if the error is Unimplemented; Commodore retries the stop until the cell accepts it. If the cell is removed for good, frameworks admin clusters retire eu --reason <reason> settles the stops owed to it. Tenant closure proceeds independently of stop delivery. The alert fires per cell, so silencing one cell leaves the others visible."
          - exp_labels:
              severity: warning
              cell: us
            exp_annotations:
              summary: Cell us has not accepted an account session stop
              description: "A revoked user, tenant or stream still has an ingest stop that cell us has not accepted, including backoff. frameworks cluster doctor --deep names the affected tenants and frameworks admin tenants get <tenant> lists each pending stop with its cells and last error. Restore cell us, or upgrade its Foghorn if the error is Unimplemented; Commodore retries the stop until the cell accepts it. If the cell is removed for good, frameworks admin clusters retire us --reason <reason> settles the stops owed to it. Tenant closure proceeds independently of stop delivery. The alert fires per cell, so silencing one cell leaves the others visible."
      - eval_time: 15m
        groupname: frameworks.rules
        alertname: CommodoreAccountIngestRevocationStuck
        exp_alerts:
          - exp_labels:
              severity: warning
              cell: us
            exp_annotations:
              summary: Cell us has not accepted an account session stop
              description: "A revoked user, tenant or stream still has an ingest stop that cell us has not accepted, including backoff. frameworks cluster doctor --deep names the affected tenants and frameworks admin tenants get <tenant> lists each pending stop with its cells and last error. Restore cell us, or upgrade its Foghorn if the error is Unimplemented; Commodore retries the stop until the cell accepts it. If the cell is removed for good, frameworks admin clusters retire us --reason <reason> settles the stops owed to it. Tenant closure proceeds independently of stop delivery. The alert fires per cell, so silencing one cell leaves the others visible."
  - interval: 1m
    input_series:
      - series: commodore_account_ingest_stop_oldest_pending_seconds{instance="a",cell="unknown"}
        values: "0 600x10 0x5"
    alert_rule_test:
      - eval_time: 7m
        groupname: frameworks.rules
        alertname: CommodoreAccountIngestRevocationStuck
        exp_alerts:
          - exp_labels:
              severity: warning
              cell: unknown
            exp_annotations:
              summary: Account session-stop delivery has not reached a cell
              description: "A revoked user, tenant or stream has an ingest stop whose last attempt failed before contacting any cell, or that has not been attempted yet. frameworks cluster doctor --deep names the affected tenants and frameworks admin tenants get <tenant> shows each pending stop with its last error; that error comes from Commodore's database, so restore Commodore's database connection and Commodore retries. Tenant closure proceeds independently of stop delivery. The alert fires per cell, so silencing one cell leaves the others visible."
      - eval_time: 15m
        groupname: frameworks.rules
        alertname: CommodoreAccountIngestRevocationStuck
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: commodore_tenant_account_closure_failed_items{instance="a"}
        values: "0 1x8 0x4"
      - series: purser_operator_grant_expiry_failed_items{instance="a"}
        values: "0 1x8 0x4"
      - series: commodore_tenant_account_closure_repeatedly_failed_items{instance="a"}
        values: "0x14"
      - series: purser_operator_grant_expiry_repeatedly_failed_items{instance="a"}
        values: "0x14"
    alert_rule_test:
      - eval_time: 7m
        groupname: frameworks.rules
        alertname: CommodoreTenantAccountClosureStuck
        exp_alerts: []
      - eval_time: 7m
        groupname: frameworks.rules
        alertname: PurserOperatorGrantExpiryStuck
        exp_alerts: []
