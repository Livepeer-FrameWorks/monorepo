# Both recovery queues fire after five minutes and resolve when drained.
rule_files:
  - ../frameworks.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: commodore_tenant_account_closure_repeatedly_failed_items{instance="a"}
        values: "0 1x7 0x4"
      - series: purser_operator_grant_expiry_repeatedly_failed_items{instance="a"}
        values: "0 1x7 0x4"
      - series: commodore_tenant_account_closure_repeatedly_failed_items{instance="b"}
        values: "0 1x7 0x4"
      - series: purser_operator_grant_expiry_repeatedly_failed_items{instance="b"}
        values: "0 1x7 0x4"
    alert_rule_test:
      - eval_time: 4m
        groupname: frameworks.rules
        alertname: CommodoreTenantAccountClosureStuck
        exp_alerts: []
      - eval_time: 7m
        groupname: frameworks.rules
        alertname: CommodoreTenantAccountClosureStuck
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Tenant closure is awaiting synchronization
              description: A closed tenant's Quartermaster teardown has failed more than once, or Commodore cannot read its closure queue from its database. Commodore retries every minute and logs each failure as "Finish tenant closure" with tenant_id and the Quartermaster error. frameworks cluster doctor --deep names the affected tenants; frameworks admin tenants get <tenant> shows the Quartermaster synchronization as failing, with its attempts and that error. Restore Commodore's connection to Quartermaster, or Commodore's database for read failures; the closure completes on the next retry. Access is already revoked locally, so users stay closed while this fires.
      - eval_time: 10m
        groupname: frameworks.rules
        alertname: CommodoreTenantAccountClosureStuck
        exp_alerts: []
      - eval_time: 4m
        groupname: frameworks.rules
        alertname: PurserOperatorGrantExpiryStuck
        exp_alerts: []
      - eval_time: 7m
        groupname: frameworks.rules
        alertname: PurserOperatorGrantExpiryStuck
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Operator grant expiry needs recovery
              description: "An operator grant past its deadline failed billing-boundary reconciliation more than once, or Purser cannot read its expiry queue. Run frameworks admin billing grant list --include-expired: it names each tenant with its failed attempts and last error, and grant show --tenant-id <tenant> shows one in full. Correct the billing or pricing error; retries run every five minutes. Other expiries continue."
      - eval_time: 10m
        groupname: frameworks.rules
        alertname: PurserOperatorGrantExpiryStuck
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: commodore_tenant_account_closure_repeatedly_failed_items{instance="a"}
        values: "0 NaNx20 0x12"
      - series: commodore_tenant_account_closure_read_failures_total{instance="a"}
        values: "0+1x20 20x30"
      - series: commodore_tenant_account_closure_read_failures_total{instance="b"}
        values: "0+1x20 20x30"
    alert_rule_test:
      - eval_time: 4m
        groupname: frameworks.rules
        alertname: CommodoreTenantAccountClosureStuck
        exp_alerts: []
      - eval_time: 7m
        groupname: frameworks.rules
        alertname: CommodoreTenantAccountClosureStuck
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Tenant closure is awaiting synchronization
              description: A closed tenant's Quartermaster teardown has failed more than once, or Commodore cannot read its closure queue from its database. Commodore retries every minute and logs each failure as "Finish tenant closure" with tenant_id and the Quartermaster error. frameworks cluster doctor --deep names the affected tenants; frameworks admin tenants get <tenant> shows the Quartermaster synchronization as failing, with its attempts and that error. Restore Commodore's connection to Quartermaster, or Commodore's database for read failures; the closure completes on the next retry. Access is already revoked locally, so users stay closed while this fires.
      - eval_time: 19m
        groupname: frameworks.rules
        alertname: CommodoreTenantAccountClosureStuck
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Tenant closure is awaiting synchronization
              description: A closed tenant's Quartermaster teardown has failed more than once, or Commodore cannot read its closure queue from its database. Commodore retries every minute and logs each failure as "Finish tenant closure" with tenant_id and the Quartermaster error. frameworks cluster doctor --deep names the affected tenants; frameworks admin tenants get <tenant> shows the Quartermaster synchronization as failing, with its attempts and that error. Restore Commodore's connection to Quartermaster, or Commodore's database for read failures; the closure completes on the next retry. Access is already revoked locally, so users stay closed while this fires.
      - eval_time: 50m
        groupname: frameworks.rules
        alertname: CommodoreTenantAccountClosureStuck
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: purser_operator_grant_expiry_repeatedly_failed_items{instance="a"}
        values: "0 NaNx20 0x12"
      - series: purser_operator_grant_expiry_read_failures_total{instance="a"}
        values: "0+1x20 20x30"
      - series: purser_operator_grant_expiry_read_failures_total{instance="b"}
        values: "0+1x20 20x30"
    alert_rule_test:
      - eval_time: 4m
        groupname: frameworks.rules
        alertname: PurserOperatorGrantExpiryStuck
        exp_alerts: []
      - eval_time: 7m
        groupname: frameworks.rules
        alertname: PurserOperatorGrantExpiryStuck
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Operator grant expiry needs recovery
              description: "An operator grant past its deadline failed billing-boundary reconciliation more than once, or Purser cannot read its expiry queue. Run frameworks admin billing grant list --include-expired: it names each tenant with its failed attempts and last error, and grant show --tenant-id <tenant> shows one in full. Correct the billing or pricing error; retries run every five minutes. Other expiries continue."
      - eval_time: 19m
        groupname: frameworks.rules
        alertname: PurserOperatorGrantExpiryStuck
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Operator grant expiry needs recovery
              description: "An operator grant past its deadline failed billing-boundary reconciliation more than once, or Purser cannot read its expiry queue. Run frameworks admin billing grant list --include-expired: it names each tenant with its failed attempts and last error, and grant show --tenant-id <tenant> shows one in full. Correct the billing or pricing error; retries run every five minutes. Other expiries continue."
      - eval_time: 50m
        groupname: frameworks.rules
        alertname: PurserOperatorGrantExpiryStuck
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: commodore_tenant_account_closure_read_failures_total{instance="a"}
        values: "0 2x20"
      - series: purser_operator_grant_expiry_read_failures_total{instance="a"}
        values: "0 2x20"
    alert_rule_test:
      - eval_time: 7m
        groupname: frameworks.rules
        alertname: CommodoreTenantAccountClosureStuck
        exp_alerts: []
      - eval_time: 7m
        groupname: frameworks.rules
        alertname: PurserOperatorGrantExpiryStuck
        exp_alerts: []
      - eval_time: 10m
        groupname: frameworks.rules
        alertname: CommodoreTenantAccountClosureStuck
        exp_alerts: []
      - eval_time: 10m
        groupname: frameworks.rules
        alertname: PurserOperatorGrantExpiryStuck
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: commodore_media_authority_refresh_oldest_pending_seconds{instance="a",lane="ingest_revocation"}
        values: "0 600x10 0x5"
      - series: commodore_media_authority_refresh_oldest_pending_seconds{instance="b",lane="ingest_revocation"}
        values: "0 600x10 0x5"
    alert_rule_test:
      - eval_time: 4m
        groupname: frameworks.rules
        alertname: CommodoreAccountIngestRevocationStuck
        exp_alerts: []
      - eval_time: 7m
        groupname: frameworks.rules
        alertname: CommodoreAccountIngestRevocationStuck
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Account session-stop delivery is awaiting a cell
              description: "A revoked user, tenant or stream still has an ingest stop that a cell has not accepted, including backoff. frameworks cluster doctor --deep names the affected tenants. frameworks cluster diagnose media-authority lists the retrying refresh targets on lane ingest_revocation with the tenant and the last error, which names the cell; frameworks admin tenants get <tenant> lists that tenant's pending stops with their cells. Restore that cell, or upgrade its Foghorn if the error is Unimplemented; Commodore retries the stop until the cell accepts it. For a cell removed for good, frameworks admin clusters retire <cluster-id> --reason <reason> settles the stops owed to it. Tenant closure proceeds independently of stop delivery. This alert aggregates all cells: silencing it also hides stops pending on other cells."
      - eval_time: 15m
        groupname: frameworks.rules
        alertname: CommodoreAccountIngestRevocationStuck
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: commodore_tenant_account_closure_failed_items{instance="a"}
        values: "0 1x8 0x4"
      - series: purser_operator_grant_expiry_failed_items{instance="a"}
        values: "0 1x8 0x4"
      - series: commodore_tenant_account_closure_repeatedly_failed_items{instance="a"}
        values: "0x14"
      - series: purser_operator_grant_expiry_repeatedly_failed_items{instance="a"}
        values: "0x14"
    alert_rule_test:
      - eval_time: 7m
        groupname: frameworks.rules
        alertname: CommodoreTenantAccountClosureStuck
        exp_alerts: []
      - eval_time: 7m
        groupname: frameworks.rules
        alertname: PurserOperatorGrantExpiryStuck
        exp_alerts: []
