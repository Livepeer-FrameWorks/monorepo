syntax = "proto3";

package x402;

option go_package = "github.com/Livepeer-FrameWorks/monorepo/pkg/proto/x402;x402pb";

// The x402 client payment payload, shared by the Gateway (parses the
// PAYMENT-SIGNATURE header) and Purser (verify/settle). The original JSON is
// preserved because facilitators verify the exact official v2 wire document.

// X-PAYMENT header payload from client
message X402PaymentPayload {
  int32 x402_version = 1;
  string scheme = 2;                    // v1 compatibility; v2 copies accepted.scheme
  string network = 3;                   // v1 compatibility; v2 uses CAIP-2 accepted.network
  X402ExactPayload payload = 4;
  bytes canonical_payload_json = 5;     // Exact decoded PAYMENT-SIGNATURE JSON
  X402AcceptedRequirements accepted = 6;
  string quote_id = 7;                  // FrameWorks quote echoed from accepted.extra
}

message X402AcceptedRequirements {
  string scheme = 1;
  string network = 2;                   // CAIP-2, for example eip155:8453
  string asset = 3;
  string amount = 4;                    // Atomic asset units
  string pay_to = 5;
  int32 max_timeout_seconds = 6;
  bytes extra_json = 7;                 // Exact accepted.extra object
}

message X402ExactPayload {
  string signature = 5;                 // EIP-712 signature (hex)
  X402Authorization authorization = 6;
}

message X402Authorization {
  string from = 1;                      // Payer address
  string to = 2;                        // PayTo address (must match ours)
  string value = 3;                     // Amount in USDC smallest units (6 decimals)
  string valid_after = 4;               // Unix timestamp (uint256 as string)
  string valid_before = 5;              // Unix timestamp (uint256 as string)
  string nonce = 6;                     // Unique nonce (uint256 as hex)
}
