version: v2
inputs:
  - directory: .
    exclude_paths:
      - google
plugins:
  - local:
      - go
      - run
      - google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
    out: .
    opt:
      - module=github.com/Livepeer-FrameWorks/monorepo/pkg/proto
    strategy: all
    include_imports: false
    include_wkt: false
  - local:
      - go
      - run
      - google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
    out: .
    opt:
      - module=github.com/Livepeer-FrameWorks/monorepo/pkg/proto
    strategy: all
    include_imports: false
    include_wkt: false
