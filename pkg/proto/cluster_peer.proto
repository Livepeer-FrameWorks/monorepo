syntax = "proto3";

package cluster_peer;

option go_package = "github.com/Livepeer-FrameWorks/monorepo/pkg/proto/cluster_peer;clusterpeerpb";

import "google/protobuf/timestamp.proto";
import "tenant_limits.proto";

enum TenantClusterAccessSource {
  TENANT_CLUSTER_ACCESS_SOURCE_UNSPECIFIED = 0;
  TENANT_CLUSTER_ACCESS_SOURCE_PLATFORM_TIER = 1;
  TENANT_CLUSTER_ACCESS_SOURCE_OWNER = 2;
  TENANT_CLUSTER_ACCESS_SOURCE_PRIVATE_INVITE = 3;
  TENANT_CLUSTER_ACCESS_SOURCE_MARKETPLACE_SUBSCRIPTION = 4;
  TENANT_CLUSTER_ACCESS_SOURCE_OPERATOR_OVERRIDE = 5;
}

// Lightweight cluster metadata for tenant-scoped cluster context. Foghorn
// derives federation address from base_url + cluster_slug convention.
message TenantClusterPeer {
  string cluster_id = 1;
  string cluster_slug = 2;      // DNS-safe label
  string base_url = 3;          // e.g., "frameworks.cloud"
  string cluster_name = 4;      // Human label for UX
  string role = 5;              // "preferred", "official", "subscribed"
  string cluster_type = 6;      // infrastructure plane: "central" or "edge"
  string foghorn_grpc_addr = 7; // Resolved Foghorn gRPC address (host:port) from service_instances
  string s3_bucket = 20;        // Cluster S3 bucket (for cross-cluster artifact affinity)
  string s3_endpoint = 21;      // S3 endpoint URL
  string s3_region = 22;        // S3 region
  string s3_prefix = 23;        // S3 keyspace prefix — part of the physical-identity tuple: mint routing compares it exactly so a shared bucket under different prefixes is NOT treated as the same backing
  bool s3_prefix_present = 24;  // whether the cluster's s3_prefix is ADOPTED (not NULL). false ⇒ INCOMPLETE descriptor: mint routing must fail closed rather than treat a collapsed empty prefix as a real one

  // Multi-region routing fields surfaced for Commodore route filtering.
  // region_id (e.g. "eu-west", "us-east", "ap-tokyo").
  string region_id = 30;
  // cell_id (failure-isolation cell; defaults to cluster_id today).
  string cell_id = 31;
  // cluster_class: platform_official | tenant_private | third_party_marketplace.
  // Commodore's plan-aware filter rejects clusters whose class is not allowed
  // by the tenant's plan tier (free -> official only; premium -> +marketplace;
  // enterprise -> +private).
  string cluster_class = 32;
  string deployment_model = 33;
  string owner_tenant_id = 34;
  string access_level = 35;
  // health_status: healthy | degraded | offline. Resolver excludes
  // non-healthy peers from the candidate set.
  string health_status = 36;
  bool access_active = 37;
  string subscription_status = 38;
  TenantClusterAccessSource access_source = 39;
  optional google.protobuf.Timestamp access_expires_at = 40;
  // Foghorn HA/database cell that controls this virtual cluster. Authority
  // delivery targets this cell, not cluster_id.
  string control_cell_id = 41;
  // Foghorn cells permitted to serve content for this cluster. The control
  // cell is the default single entry; multi-cell serving is explicit.
  repeated string eligible_serving_cell_ids = 42;
  // Access-specific runtime cap override for this tenant/cluster pair.
  tenant_limits.TenantResourceLimits resource_limits = 43;
  bool allow_private_pull_sources = 44;
}
