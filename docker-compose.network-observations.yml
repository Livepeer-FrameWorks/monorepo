# Optional local overlay. Apply the network_observer baseline to its own database first.
services:
  network-observer:
    profiles: [network-observations]
    build:
      context: .
      dockerfile: api_network_observer/Dockerfile
    environment:
      DATABASE_URL: postgresql://network_observer:${POSTGRES_PASSWORD}@postgres:5432/network_observer?sslmode=disable
      NETWORK_OBSERVER_SECRET: ${NETWORK_OBSERVER_SECRET:?set shared observer secret}
      NETWORK_OBSERVER_TENANT_ID: ${NETWORK_OBSERVER_TENANT_ID:?set platform tenant scope}
      NETWORK_OBSERVER_CLUSTER_ID: ${CLUSTER_ID:?set cluster identity}
      NETWORK_OBSERVER_ENVIRONMENT: ${NETWORK_OBSERVER_ENVIRONMENT:-staging}
      LIVEPEER_ETH_RPC_URL: ${LIVEPEER_ETH_RPC_URL:?set production chain RPC}
      LIVEPEER_CONTROLLER: ${LIVEPEER_CONTROLLER:?set controller contract}
      DECKLOG_GRPC_ADDR: decklog:19006
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set service token}
      KAFKA_BROKERS: kafka:9092
      GRPC_TLS_MODE: disabled
      GRPC_ALLOW_INSECURE: "true"
    ports: ["127.0.0.1:18024:18024"]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://localhost:18024/ready]
      interval: 10s
      timeout: 5s
      retries: 3
  bridge:
    environment:
      NETWORK_OBSERVER_URL: http://network-observer:18024
      NETWORK_OBSERVER_SECRET: ${NETWORK_OBSERVER_SECRET:?set shared observer secret}
      NETWORK_PUBLIC_TENANT_IDS: ${NETWORK_OBSERVER_TENANT_ID:?set platform tenant scope}
      NETWORK_OBSERVER_ENVIRONMENT: ${NETWORK_OBSERVER_ENVIRONMENT:-staging}
