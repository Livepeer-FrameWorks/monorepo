version: "2"
sql:
  - engine: postgresql
    schema: ../pkg/database/sql/schema/lookout.sql
    queries: internal/database/queries
    gen:
      go:
        package: lookoutdb
        out: internal/database/lookoutdb
        sql_package: database/sql
        emit_db_tags: true
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        omit_unused_structs: true
        overrides:
          - db_type: uuid
            go_type: string
          - db_type: uuid
            nullable: true
            go_type:
              import: database/sql
              type: NullString
          - db_type: jsonb
            go_type:
              import: encoding/json
              type: RawMessage
