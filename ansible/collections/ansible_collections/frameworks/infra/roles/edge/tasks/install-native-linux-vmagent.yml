---
# Edge-local vmagent. Writes a scrape config for the edge services and runs
# vmagent as a dedicated systemd unit. Kept here (not in prometheus_stack)
# because the scrape targets and unit name are edge-shaped.

- name: Ensure edge vmagent directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: frameworks
    group: frameworks
    mode: "0755"
  loop:
    - /opt/frameworks/vmagent-edge
    - /etc/frameworks/telemetry
    - /var/log/frameworks

- name: Render vmagent scrape config
  ansible.builtin.template:
    src: vmagent-edge.yml.j2
    dest: /etc/frameworks/vmagent-edge.yml
    owner: frameworks
    group: frameworks
    mode: "0644"
  notify: edge vmagent restart

- name: Stage telemetry token (when provided)
  ansible.builtin.copy:
    dest: /etc/frameworks/telemetry/token
    content: "{{ edge_telemetry_token }}\n"
    owner: frameworks
    group: frameworks
    mode: "0600"
  when: edge_telemetry_token | length > 0
  no_log: true

- name: Set vmagent install sentinel path
  ansible.builtin.set_fact:
    edge_vmagent_install_sentinel: "/opt/frameworks/vmagent-edge/.installed-{{ edge_vmagent_artifact_checksum | default('') | hash('sha1') }}"

# The sentinel names the pinned artifact, so the archive is fetched once per
# pin rather than kept on disk to make the download a no-op.
- name: Inspect vmagent install sentinel
  ansible.builtin.stat:
    path: "{{ edge_vmagent_install_sentinel }}"
  register: edge_vmagent_sentinel_stat

- name: Report vmagent artifact drift in check mode
  ansible.builtin.debug:
    msg: "vmagent would be installed from {{ edge_vmagent_artifact_url }}"
  changed_when: not (edge_vmagent_sentinel_stat.stat.exists | default(false))
  notify: edge vmagent restart
  when: ansible_check_mode

# The vmutils archive carries every vmutils binary; only vmagent is installed.
- name: Install vmagent from the vmutils tarball
  when:
    - not ansible_check_mode
    - not (edge_vmagent_sentinel_stat.stat.exists | default(false))
  block:
    - name: Download vmutils tarball
      ansible.builtin.get_url:
        url: "{{ edge_vmagent_artifact_url }}"
        dest: "/tmp/vmagent-edge.tar.gz"
        checksum: "{{ edge_vmagent_artifact_checksum }}"
        mode: "0644"
        timeout: 300

    - name: Create vmutils extraction directory
      ansible.builtin.tempfile:
        state: directory
        suffix: vmutils
      register: edge_vmagent_extract_dir

    - name: Extract vmutils tarball
      ansible.builtin.unarchive:
        src: "/tmp/vmagent-edge.tar.gz"
        dest: "{{ edge_vmagent_extract_dir.path }}"
        remote_src: true

    - name: Install vmagent-prod binary and mark sentinel
      ansible.builtin.shell: |
        set -e
        install -m 0755 -o frameworks -g frameworks "{{ edge_vmagent_extract_dir.path }}/vmagent-prod" /opt/frameworks/vmagent-edge/vmagent
        touch "{{ edge_vmagent_install_sentinel }}"
        chown frameworks:frameworks "{{ edge_vmagent_install_sentinel }}"
      args:
        creates: "{{ edge_vmagent_install_sentinel }}"
      notify: edge vmagent restart
  always:
    - name: Remove downloaded vmutils tarball
      ansible.builtin.file:
        path: /tmp/vmagent-edge.tar.gz
        state: absent

    - name: Remove vmutils extraction directory
      ansible.builtin.file:
        path: "{{ edge_vmagent_extract_dir.path }}"
        state: absent
      when: edge_vmagent_extract_dir.path is defined

- name: Set edge vmagent bearer token argument
  ansible.builtin.set_fact:
    edge_vmagent_bearer_token_arg: >-
      {{ ' -remoteWrite.bearerTokenFile=/etc/frameworks/telemetry/token'
         if edge_telemetry_token | length > 0 or edge_existing_telemetry_token.stat.exists | default(false)
         else '' }}

- name: Render vmagent systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/frameworks-vmagent-edge.service
    mode: "0644"
    content: |
      [Unit]
      Description=FrameWorks vmagent (edge telemetry)
      After=network-online.target frameworks-mistserver.service frameworks-helmsman.service
      Wants=network-online.target

      [Service]
      User=frameworks
      Group=frameworks
      WorkingDirectory=/opt/frameworks/vmagent-edge
      ExecStart=/opt/frameworks/vmagent-edge/vmagent \
        -httpListenAddr=127.0.0.1:8429 \
        -promscrape.config=/etc/frameworks/vmagent-edge.yml \
        -remoteWrite.maxDiskUsagePerURL=512MB \
        -remoteWrite.url={{ edge_telemetry_url }}{{ edge_vmagent_bearer_token_arg }}
      Restart=always
      RestartSec=5
      LimitNOFILE=1048576

      [Install]
      WantedBy=multi-user.target
  notify: edge vmagent restart

- name: Flush handlers before starting edge vmagent
  ansible.builtin.meta: flush_handlers

- name: Ensure edge vmagent service is running
  ansible.builtin.systemd:
    name: frameworks-vmagent-edge
    state: started
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode
