---
# Drives the role's migrate tasks with items shaped like the ones `cluster migrate` sends for
# YugabyteDB (cli/pkg/provisioner migrationItem, statements split one per entry): a transactional
# item, a concurrent index build, a rerun that applies nothing, an edited applied item, a precheck
# refusal, a failing item and its corrected rerun.
- name: Create the fixture database, owner and schema
  ansible.builtin.shell: |
    set -eu
    ysqlsh=/opt/yugabyte/current/postgres/bin/ysqlsh
    [ -x "$ysqlsh" ] || ysqlsh=/opt/yugabyte/current/bin/ysqlsh
    ysql() { "$ysqlsh" -X -h {{ yugabyte_node_address }} -p 5433 -U yugabyte -d "$1" -v ON_ERROR_STOP=1 -tA -c "$2"; }
    if [ "$(ysql yugabyte "SELECT 1 FROM pg_roles WHERE rolname = 'migrate_fixture'")" != "1" ]; then
      ysql yugabyte 'CREATE ROLE migrate_fixture LOGIN'
    fi
    if [ "$(ysql yugabyte "SELECT 1 FROM pg_database WHERE datname = 'migrate_fixture'")" != "1" ]; then
      ysql yugabyte 'CREATE DATABASE migrate_fixture OWNER migrate_fixture'
    fi
    ysql migrate_fixture 'CREATE SCHEMA IF NOT EXISTS migrate_fixture AUTHORIZATION migrate_fixture'
  changed_when: false

- name: Declare the fixture migration items
  ansible.builtin.set_fact:
    migrate_fixture_table:
      db: migrate_fixture
      owner: migrate_fixture
      schema: migrate_fixture
      version: v0.0.1
      phase: expand
      sequence: 1
      filename: 001_fixture_table.sql
      checksum: fixture-001
      transactional: true
      sql: >-
        CREATE TABLE IF NOT EXISTS migrate_fixture.items (id bigint PRIMARY KEY, label text NOT NULL);
        ALTER TABLE migrate_fixture.items ADD COLUMN IF NOT EXISTS note text;
      statements:
        - CREATE TABLE IF NOT EXISTS migrate_fixture.items (id bigint PRIMARY KEY, label text NOT NULL)
        - ALTER TABLE migrate_fixture.items ADD COLUMN IF NOT EXISTS note text
      invalid_index_guards: []
      precheck_path: ""
      precheck_query: ""
    migrate_fixture_index:
      db: migrate_fixture
      owner: migrate_fixture
      schema: migrate_fixture
      version: v0.0.1
      phase: expand
      sequence: 2
      filename: 002_fixture_index.notx.sql
      checksum: fixture-002
      transactional: false
      sql: CREATE INDEX CONCURRENTLY IF NOT EXISTS items_label_idx ON migrate_fixture.items (label);
      statements:
        - CREATE INDEX CONCURRENTLY IF NOT EXISTS items_label_idx ON migrate_fixture.items (label)
      invalid_index_guards: [migrate_fixture.items_label_idx]
      precheck_path: ""
      precheck_query: ""
    # Overrides of the table item: one its precheck rejects, one whose second statement fails.
    migrate_fixture_checked:
      sequence: 3
      filename: 003_fixture_checked.sql
      checksum: fixture-003
      statements:
        - CREATE TABLE migrate_fixture.checked (id bigint)
      precheck_path: v0.0.1/expand/003_fixture_checked.precheck.sql
      precheck_query: >-
        SELECT count(*) OVER () AS precheck_total, 'row ' || n AS precheck_row
        FROM generate_series(1, 2) AS n
    migrate_fixture_failing:
      sequence: 4
      filename: 004_fixture_fails.sql
      checksum: fixture-004
      statements:
        - CREATE TABLE IF NOT EXISTS migrate_fixture.partial (id bigint)
        - SELECT 1 / 0

- name: Apply the fixture items
  ansible.builtin.include_tasks: migrate-run.yml
  vars:
    yugabyte_migrate_items: "{{ [migrate_fixture_table, migrate_fixture_index] }}"

- name: Read the fixture ledger, table and index
  community.postgresql.postgresql_query:
    login_host: "{{ yugabyte_ysql_local_host }}"
    login_port: "{{ yugabyte_ysql_port }}"
    login_user: "{{ yugabyte_superuser_role }}"
    login_password: "{{ yugabyte_superuser_password }}"
    login_db: migrate_fixture
    query:
      - SELECT version, phase, seq, filename, checksum, transactional FROM _migrations ORDER BY seq
      - >-
        SELECT count(*) AS columns FROM information_schema.columns
        WHERE table_schema = 'migrate_fixture' AND table_name = 'items'
      - >-
        SELECT i.indisvalid AND i.indisready AS index_valid FROM pg_index i
        WHERE i.indexrelid = to_regclass('migrate_fixture.items_label_idx')
  register: migrate_fixture_state
  changed_when: false

- name: Assert both items applied and recorded
  ansible.builtin.assert:
    that:
      - ledger | map(attribute='seq') | list == [1, 2]
      - ledger | map(attribute='checksum') | list == ['fixture-001', 'fixture-002']
      - ledger | map(attribute='transactional') | list == [true, false]
      - migrate_fixture_state.query_all_results[1][0].columns == 3
      - migrate_fixture_state.query_all_results[2][0].index_valid
    fail_msg: "{{ migrate_fixture_state.query_all_results }}"
  vars:
    ledger: "{{ migrate_fixture_state.query_all_results[0] }}"

- name: Rerun the applied items
  ansible.builtin.include_tasks: migrate-run.yml
  vars:
    yugabyte_migrate_items: "{{ [migrate_fixture_table, migrate_fixture_index] }}"

- name: Assert the rerun found nothing pending
  ansible.builtin.assert:
    that: yugabyte_pending_migrate_items | default([]) | length == 0
    fail_msg: "rerun selected {{ yugabyte_pending_migrate_items }}"

- name: Apply an applied item whose checksum changed
  block:
    - name: Run migrate with the edited item
      ansible.builtin.include_tasks: migrate-run.yml
      vars:
        yugabyte_migrate_items: "{{ [migrate_fixture_table | combine({'checksum': 'fixture-001-edited'})] }}"

    - name: Fail when the edited item was accepted
      ansible.builtin.set_fact:
        migrate_fixture_edited_error: ""
  rescue:
    - name: Record the edited-item refusal
      ansible.builtin.set_fact:
        migrate_fixture_edited_error: "{{ ansible_failed_result.msg | default('') }}"

- name: Assert an edited applied item is refused
  ansible.builtin.assert:
    that: "'Migration checksum mismatch for migrate_fixture/v0.0.1/expand/001_fixture_table.sql' in migrate_fixture_edited_error"
    fail_msg: "edited item: {{ migrate_fixture_edited_error }}"

- name: Apply an item its precheck rejects
  block:
    - name: Run migrate with the rejected item
      ansible.builtin.include_tasks: migrate-run.yml
      vars:
        yugabyte_migrate_items: "{{ [migrate_fixture_table | combine(migrate_fixture_checked)] }}"

    - name: Fail when the rejected item was applied
      ansible.builtin.set_fact:
        migrate_fixture_precheck_error: ""
  rescue:
    - name: Record the precheck refusal
      ansible.builtin.set_fact:
        migrate_fixture_precheck_error: "{{ ansible_failed_result.msg | default('') }}"

- name: Apply an item whose statement fails
  block:
    - name: Run migrate with the failing item
      ansible.builtin.include_tasks: migrate-run.yml
      vars:
        yugabyte_migrate_items: "{{ [migrate_fixture_table | combine(migrate_fixture_failing)] }}"

    - name: Fail when the failing item was applied
      ansible.builtin.set_fact:
        migrate_fixture_failed_error: ""
  rescue:
    - name: Record the failed item
      ansible.builtin.set_fact:
        migrate_fixture_failed_error: "{{ ansible_failed_result.msg | default('') }}"

# YugabyteDB runs an item's statements one at a time in autocommit, so a failed item keeps the
# statements before the failing one; it has no ledger row, so its rerun executes them again.
- name: Read what the refused and failed items left
  community.postgresql.postgresql_query:
    login_host: "{{ yugabyte_ysql_local_host }}"
    login_port: "{{ yugabyte_ysql_port }}"
    login_user: "{{ yugabyte_superuser_role }}"
    login_password: "{{ yugabyte_superuser_password }}"
    login_db: migrate_fixture
    query:
      - SELECT seq FROM _migrations ORDER BY seq
      - SELECT to_regclass('migrate_fixture.checked') IS NULL AS precheck_left_nothing
  register: migrate_fixture_after_failures
  changed_when: false

- name: Assert the refused and failed items left no ledger rows
  ansible.builtin.assert:
    that:
      - migrate_fixture_precheck_error is search('its precheck v0.0.1/expand/003_fixture_checked.precheck.sql\s+found 2 row\(s\)')
      - "'migrate_fixture/v0.0.1/expand/004_fixture_fails.sql was not recorded: statement 2 of 2' in migrate_fixture_failed_error"
      - "'SQLSTATE 22012: division by zero' in migrate_fixture_failed_error"
      - migrate_fixture_after_failures.query_all_results[0] | map(attribute='seq') | list == [1, 2]
      - migrate_fixture_after_failures.query_all_results[1][0].precheck_left_nothing
    fail_msg: >-
      precheck: {{ migrate_fixture_precheck_error }}; failure: {{ migrate_fixture_failed_error }};
      state: {{ migrate_fixture_after_failures.query_all_results }}

- name: Apply the corrected failing item at the same sequence
  ansible.builtin.include_tasks: migrate-run.yml
  vars:
    yugabyte_migrate_items: >-
      {{ [migrate_fixture_table, migrate_fixture_index,
          migrate_fixture_table | combine(migrate_fixture_failing)
            | combine({'statements': [migrate_fixture_failing.statements[0], 'SELECT 1']})] }}

- name: Read the ledger after the corrected item
  community.postgresql.postgresql_query:
    login_host: "{{ yugabyte_ysql_local_host }}"
    login_port: "{{ yugabyte_ysql_port }}"
    login_user: "{{ yugabyte_superuser_role }}"
    login_password: "{{ yugabyte_superuser_password }}"
    login_db: migrate_fixture
    query:
      - SELECT seq, filename FROM _migrations ORDER BY seq
      - SELECT to_regclass('migrate_fixture.partial') IS NOT NULL AS partial_exists
  register: migrate_fixture_after_rerun
  changed_when: false

- name: Assert the corrected item replayed its applied statement and was recorded
  ansible.builtin.assert:
    that:
      - yugabyte_pending_migrate_items | map(attribute='filename') | list == ['004_fixture_fails.sql']
      - migrate_fixture_after_rerun.query_all_results[0] | map(attribute='seq') | list == [1, 2, 4]
      - migrate_fixture_after_rerun.query_all_results[0][2].filename == '004_fixture_fails.sql'
      - migrate_fixture_after_rerun.query_all_results[1][0].partial_exists
    fail_msg: "pending: {{ yugabyte_pending_migrate_items }}; state: {{ migrate_fixture_after_rerun.query_all_results }}"
