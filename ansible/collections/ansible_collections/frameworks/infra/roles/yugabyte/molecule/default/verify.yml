---
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Refresh service facts
      ansible.builtin.service_facts:

    - name: Assert yb-master service is running and enabled
      ansible.builtin.assert:
        that:
          - ansible_facts.services['yb-master.service'].state == 'running'
          - ansible_facts.services['yb-master.service'].status == 'enabled'
        fail_msg: "yb-master not running/enabled"

    - name: Assert yb-tserver service is running and enabled
      ansible.builtin.assert:
        that:
          - ansible_facts.services['yb-tserver.service'].state == 'running'
          - ansible_facts.services['yb-tserver.service'].status == 'enabled'
        fail_msg: "yb-tserver not running/enabled"

    - name: Confirm YSQL listener responds on the node address
      ansible.builtin.wait_for:
        host: "{{ yugabyte_node_address }}"
        port: 5433
        timeout: 30

    - name: Confirm nothing listens for YSQL on loopback
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 5433
        state: stopped
        timeout: 1

    # The post-expand report reads the quartermaster database.
    - name: Create the database the post-expand report reads
      ansible.builtin.shell: |
        set -eu
        ysqlsh=/opt/yugabyte/current/postgres/bin/ysqlsh
        [ -x "$ysqlsh" ] || ysqlsh=/opt/yugabyte/current/bin/ysqlsh
        ysql() { "$ysqlsh" -X -h {{ yugabyte_node_address }} -p 5433 -U yugabyte -d yugabyte -v ON_ERROR_STOP=1 -tA -c "$1"; }
        if [ "$(ysql "SELECT 1 FROM pg_database WHERE datname = 'quartermaster'")" != "1" ]; then
          ysql 'CREATE DATABASE quartermaster'
        fi
      changed_when: false

    - name: Copy the YSQL scripts the CLI runs on a node
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/cli-scripts/"
        dest: /tmp/fw-cli-scripts/
        mode: "0644"

    - name: Run the CLI's YSQL scripts against the node's listener
      ansible.builtin.command: sh /tmp/fw-cli-scripts/{{ item }}
      loop:
        - ysql-timing-probe.sh
        - media-authority-probe.sh
        - post-expand-report.sh
        - postgres-snapshot.sh
        - local-queries.sh
      register: yugabyte_cli_scripts
      changed_when: false
      failed_when: false

    - name: Assert every CLI YSQL script reached the listener
      ansible.builtin.assert:
        that:
          - item.rc == 0
          - item.item != 'ysql-timing-probe.sh' or 'ysql_elapsed_us=' in item.stdout
          - item.item != 'post-expand-report.sh' or '"expand_applied":false' in item.stdout
          - item.item != 'local-queries.sh' or '@@fw-done 0 0 ' in item.stdout
        fail_msg: "{{ item.item }} exited {{ item.rc }}: {{ item.stdout }} {{ item.stderr }}"
      loop: "{{ yugabyte_cli_scripts.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Confirm yb-master binary is present and executable
      ansible.builtin.stat:
        path: /opt/yugabyte/current/bin/yb-master
        follow: true
      register: master_bin

    - name: Assert binary
      ansible.builtin.assert:
        that:
          - master_bin.stat.exists
          - master_bin.stat.executable

    - name: Confirm installation sentinel + post-install sentinel
      ansible.builtin.stat:
        path: "{{ item }}"
      register: sentinels
      loop:
        - /opt/yugabyte/current/.post_install_done
        - /opt/yugabyte/current/.installed

    - name: Assert sentinels
      ansible.builtin.assert:
        that: sentinels.results | map(attribute='stat.exists') | list == [true, true]

    - name: Assert the daily log prune timer is enabled
      ansible.builtin.assert:
        that:
          - ansible_facts.services['yugabyte-log-prune.service'] is defined
        fail_msg: "yugabyte-log-prune.service is not installed"

    - name: Read log prune timer state
      ansible.builtin.command: systemctl is-enabled yugabyte-log-prune.timer
      register: yugabyte_prune_timer
      changed_when: false

    - name: Assert log prune timer enabled
      ansible.builtin.assert:
        that: yugabyte_prune_timer.stdout == 'enabled'

    - name: Read the flagfiles and the sysctl drop-in
      ansible.builtin.slurp:
        src: "{{ item }}"
      register: yugabyte_rendered
      loop:
        - /opt/yugabyte/conf/master.conf
        - /opt/yugabyte/conf/tserver.conf
        - /etc/sysctl.d/99-yugabyte.conf

    - name: Assert bounded logs and no host-wide core pattern
      ansible.builtin.assert:
        that:
          - "'--max_log_size=256' in (yugabyte_rendered.results[0].content | b64decode)"
          - "'--max_log_size=256' in (yugabyte_rendered.results[1].content | b64decode)"
          - "'log_rotation_size=256MB' in (yugabyte_rendered.results[1].content | b64decode)"
          - "'core_pattern' not in (yugabyte_rendered.results[2].content | b64decode)"
