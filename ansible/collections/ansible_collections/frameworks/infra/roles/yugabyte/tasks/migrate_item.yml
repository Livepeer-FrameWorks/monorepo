---
# Applies one pending migration item (Yugabyte). migrate.yml includes this file once per item, in order, so an item's
# precheck runs immediately before that item and after every earlier item has applied.

# A precheck returns the rows the item's DDL would fail on. It runs in a READ ONLY transaction; when it returns rows
# the item fails here, before its first statement, and nothing of it is applied. The query task keeps the role's
# no_log, so the refusal below carries the rows the operator needs.
- name: Run migration precheck (Yugabyte)
  community.postgresql.postgresql_query:
    login_host: 127.0.0.1
    login_port: "{{ yugabyte_ysql_port }}"
    login_user: "{{ yugabyte_superuser_role }}"
    login_password: "{{ yugabyte_superuser_password }}"
    login_db: "{{ item.db }}"
    query:
      - SET TRANSACTION READ ONLY
      - "{{ item.precheck_query }}"
  register: yugabyte_migration_precheck
  changed_when: false
  no_log: true
  when:
    - not ansible_check_mode
    - item.precheck_query | default('') | length > 0

- name: Refuse migration its precheck rejects (Yugabyte)
  ansible.builtin.fail:
    msg: >-
      {{ item.db }}/{{ item.version }}/{{ item.phase }}/{{ item.filename }} was not applied: its precheck
      {{ item.precheck_path }} found {{ precheck_rows[0].precheck_total }} row(s) the migration would fail on.
      Nothing of this item ran. Resolve these rows, then rerun the migration.
      First {{ precheck_rows | length }}: {{ precheck_rows | map(attribute='precheck_row') | join('; ') }}
  vars:
    precheck_rows: "{{ yugabyte_migration_precheck.query_all_results[1] | default([]) }}"
  when:
    - item.precheck_query | default('') | length > 0
    - precheck_rows | length > 0

# Migrations run while services are live. YugabyteDB runs DDL outside transaction blocks, and a schema change on a
# colocated database aborts a transaction that already wrote rows (40001), so an item is never sent as one transaction:
# frameworks.infra.yugabyte_migration_apply runs its statements one at a time in autocommit on one session, which holds
# the per-database advisory lock for the whole item, and writes the ledger row only after the last statement. A failed
# or interrupted item keeps the statements it applied and has no ledger row; its rerun executes every statement again,
# which `cluster migrate validate` requires each post-floor statement to survive (cli/pkg/provisioner/
# migrate_rerun_safety.go). A transactional item runs each statement under lock_timeout, so a statement that cannot get
# its lock fails fast instead of queueing live traffic behind it, and statement_timeout, and replays only that statement
# when it failed on the lock timeout, a serialization failure, or a deadlock. A .notx.sql item runs without timeouts,
# because a concurrent index build waits for older transactions and a large build can run long; it is never replayed.
# An interrupted CREATE INDEX CONCURRENTLY leaves an invalid index that IF NOT EXISTS would skip, so the ledger row
# would be written over a broken index; the item repairs it itself, inside the advisory lock. Only then is a guarded
# index known to be abandoned: every migrator builds under that lock, and a build in progress is invalid too. The
# repair also rechecks the ledger, so an item another migrator applied meanwhile keeps its valid index. A plain DROP
# INDEX takes the table's ACCESS EXCLUSIVE lock, so the repair runs between its own lock and statement timeouts. On
# YugabyteDB a CREATE ROLE or other shared-catalog DDL anywhere on the cluster during the build aborts it, and the
# engine's own retry of CREATE INDEX CONCURRENTLY IF NOT EXISTS then finds the aborted index and reports success, so
# after its statements the item checks every guarded index is valid and ready before it writes its ledger row.
- name: Apply migration (Yugabyte)
  frameworks.infra.yugabyte_migration_apply:
    login_host: 127.0.0.1
    login_port: "{{ yugabyte_ysql_port }}"
    login_user: "{{ yugabyte_superuser_role }}"
    login_password: "{{ yugabyte_superuser_password }}"
    db: "{{ item.db }}"
    owner: "{{ item.owner }}"
    label: "{{ item.db }}/{{ item.version }}/{{ item.phase }}/{{ item.filename }}"
    statements: "{{ item.statements }}"
    bounded: "{{ item.transactional | default(true) }}"
    lock_timeout: 5s
    statement_timeout: 15min
    retries: 6
    retry_delay: 10
    invalid_index_repair: "{{ (item.invalid_index_guards | default([]) | length > 0) | ternary(invalid_index_repair_sql, '') }}"
    invalid_index_verify: "{{ (item.invalid_index_guards | default([]) | length > 0) | ternary(invalid_index_verify_sql, '') }}"
    ledger_insert: "{{ migration_ledger_sql }}"
  register: yugabyte_migration_apply
  when: not ansible_check_mode
  vars:
    invalid_index_repair_sql: >-
      DO $repair$
      DECLARE target text;
      BEGIN
        IF NOT EXISTS (SELECT 1 FROM _migrations
                        WHERE version = '{{ item.version }}' AND phase = '{{ item.phase }}' AND seq = {{ item.sequence }}) THEN
          FOR target IN
            SELECT format('%I.%I', n.nspname, c.relname)
              FROM pg_index i
              JOIN pg_class c ON c.oid = i.indexrelid
              JOIN pg_namespace n ON n.oid = c.relnamespace
             WHERE NOT i.indisvalid
               AND n.nspname || '.' || c.relname = ANY(
                 ARRAY['{{ item.invalid_index_guards | default([]) | map('replace', "'", "''") | join("', '") }}']::text[])
          LOOP
            EXECUTE 'DROP INDEX IF EXISTS ' || target;
          END LOOP;
        END IF;
      END $repair$
    invalid_index_verify_sql: >-
      DO $verify$
      DECLARE broken text;
      BEGIN
        SELECT string_agg(guard, ', ' ORDER BY guard) INTO broken
          FROM unnest(ARRAY['{{ item.invalid_index_guards | default([]) | map('replace', "'", "''") | join("', '") }}']::text[]) AS guard
         WHERE NOT EXISTS (
           SELECT 1
             FROM pg_index i
             JOIN pg_class c ON c.oid = i.indexrelid
             JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname || '.' || c.relname = guard
              AND i.indisvalid AND i.indisready);
        IF broken IS NOT NULL THEN
          RAISE EXCEPTION 'concurrent index build left % missing or invalid; the item is not recorded and its rerun rebuilds it', broken;
        END IF;
      END $verify$
    migration_ledger_sql: >-
      INSERT INTO _migrations (version, phase, seq, filename, checksum, transactional)
      VALUES ('{{ item.version }}', '{{ item.phase }}', {{ item.sequence }},
              '{{ item.filename }}', '{{ item.checksum }}',
              {{ item.transactional | default(true) | ternary('true', 'false') }})
