---
# Seed runs locally as the built-in Yugabyte admin role. The generated HBA
# trusts this role only from this node's own YSQL address.

- name: Ensure YSQL Ansible module prerequisites
  ansible.builtin.import_tasks: ysql_prereqs.yml

- name: Apply SQL seeds via YSQL
  community.postgresql.postgresql_query:
    login_host: "{{ yugabyte_ysql_local_host }}"
    login_port: "{{ yugabyte_ysql_port }}"
    login_user: "{{ yugabyte_superuser_role }}"
    login_password: "{{ yugabyte_superuser_password }}"
    login_db: "{{ item.db }}"
    query: "{{ item.sql }}"
  loop: "{{ yugabyte_seed_items | default([]) }}"
  loop_control:
    label: "{{ item.db }}"
  no_log: true
  when:
    - not ansible_check_mode
    - yugabyte_seed_items | default([]) | length > 0
