---
# Time-sync: install + start chrony only if no time-sync daemon is already
# active on the host. Probe uses service_facts populated in preflight.
- name: Check whether any time-sync service is already running
  ansible.builtin.set_fact:
    yugabyte_timesync_running: >-
      {{ ((ansible_facts.services | default({})) | dict2items
         | selectattr('key', 'in', ['chronyd.service', 'chrony.service', 'systemd-timesyncd.service', 'ntpd.service', 'ntp.service'])
         | selectattr('value.state', 'equalto', 'running')
         | list | length) > 0 }}

- name: Install time-sync package
  ansible.builtin.package:
    name: "{{ yugabyte_timesync.package }}"
    state: present
  when:
    - yugabyte_manage_timesync
    - not yugabyte_timesync_running

- name: Enable and start time-sync service
  ansible.builtin.systemd:
    name: "{{ yugabyte_timesync.service }}"
    state: started
    enabled: true
  when:
    - yugabyte_manage_timesync
    - not yugabyte_timesync_running

- name: Ensure python command is available for YugabyteDB post-install
  ansible.builtin.package:
    name: python-is-python3
    state: present
  when: ansible_os_family == "Debian"

# curl is required by yugabyte's post_install.sh; the package name is 'curl'
# across all supported distro families so a single package task is correct.
- name: Ensure curl is installed
  ansible.builtin.package:
    name: curl
    state: present

- name: Ensure yugabyte group
  ansible.builtin.group:
    name: "{{ yugabyte_group }}"
    system: true
    state: present

- name: Ensure yugabyte user
  ansible.builtin.user:
    name: "{{ yugabyte_user }}"
    group: "{{ yugabyte_group }}"
    system: true
    shell: /usr/sbin/nologin
    state: present

- name: Ensure FrameWorks runtime directory
  ansible.builtin.file:
    path: /var/lib/frameworks
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure private Yugabyte relayout directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ yugabyte_relayout_operator_user }}"
    mode: "0700"
  loop:
    - "{{ yugabyte_relayout_dump_dir }}"
    - "{{ yugabyte_relayout_worker_dir }}"

- name: Ensure yugabyte directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ yugabyte_user }}"
    group: "{{ yugabyte_group }}"
    mode: "0755"
  loop:
    - "{{ yugabyte_install_dir }}"
    - "{{ yugabyte_conf_dir }}"
    - "{{ yugabyte_data_dir }}"
    - "{{ yugabyte_cores_dir }}"

- name: Stat YugabyteDB binary
  ansible.builtin.stat:
    path: "{{ yugabyte_bin_dir }}/yb-master"
    follow: true
  register: yugabyte_bin_stat
  check_mode: false
  changed_when: false

- name: Stat YugabyteDB install sentinel
  ansible.builtin.stat:
    path: "{{ yugabyte_install_sentinel }}"
  register: yugabyte_install_sentinel_stat
  check_mode: false
  changed_when: false

- name: Stat YugabyteDB relocation sentinel
  ansible.builtin.stat:
    path: "{{ yugabyte_post_install_sentinel }}"
  register: yugabyte_relocation_sentinel_stat
  check_mode: false
  changed_when: false

- name: Decide whether YugabyteDB reinstall is required
  ansible.builtin.set_fact:
    yugabyte_reinstall_required: >-
      {{
        not (yugabyte_bin_stat.stat.exists | default(false)) or
        not (yugabyte_install_sentinel_stat.stat.exists | default(false)) or
        not (yugabyte_relocation_sentinel_stat.stat.exists | default(false))
      }}

- name: Read selected YugabyteDB release
  ansible.builtin.stat:
    path: "{{ yugabyte_current_link }}"
    follow: false
  register: yugabyte_current
  check_mode: false
  changed_when: false

- name: Read in-place artifact identity before adopting release directories
  ansible.builtin.stat:
    path: "{{ yugabyte_install_dir }}/.installed-{{ yugabyte_artifact_id }}"
  register: yugabyte_in_place_identity
  check_mode: false
  changed_when: false

- name: Require the engine selector to be a symlink
  ansible.builtin.assert:
    that: not yugabyte_current.stat.exists or (yugabyte_current.stat.islnk | default(false))
    fail_msg: "{{ yugabyte_current_link }} must be a symlink, not a directory or file"

- name: Stat bootstrap sentinel for the engine change guard
  ansible.builtin.stat:
    path: "{{ yugabyte_bootstrap_sentinel }}"
  register: yugabyte_engine_guard_bootstrap
  check_mode: false
  changed_when: false

- name: Refuse an engine change outside cluster upgrade
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }} already joined the YugabyteDB universe with another engine artifact. Changing the engine
      needs the ordered upgrade (every master, then every tserver, then finalize): run frameworks cluster upgrade
      yugabyte.
  when:
    - yugabyte_engine_guard_bootstrap.stat.exists | default(false)
    - >-
      (yugabyte_current.stat.exists and yugabyte_current.stat.lnk_source != yugabyte_release_dir) or
      (not yugabyte_current.stat.exists and not yugabyte_in_place_identity.stat.exists)
    - not (yugabyte_allow_engine_change | bool)

- name: Refuse to overwrite an incomplete selected release
  ansible.builtin.assert:
    that: >-
      not (yugabyte_reinstall_required | bool) or
      (yugabyte_current.stat.lnk_source | default('')) != yugabyte_release_dir
    fail_msg: "Selected YugabyteDB release is incomplete; refusing to alter files that running processes may use"

- name: Report pending YugabyteDB reinstall under --check
  ansible.builtin.debug:
    msg: >-
      yugabyte would reinstall:
      binary_exists={{ yugabyte_bin_stat.stat.exists | default(false) }},
      sentinel={{ yugabyte_install_sentinel }}
  changed_when: yugabyte_reinstall_required | bool
  when: ansible_check_mode

- name: Remove unpublished partial extraction
  ansible.builtin.file:
    path: "{{ yugabyte_release_dir }}"
    state: absent
  when:
    - not ansible_check_mode
    - yugabyte_reinstall_required | default(false)

- name: Create clean artifact directory
  ansible.builtin.file:
    path: "{{ yugabyte_release_dir }}"
    state: directory
    owner: "{{ yugabyte_user }}"
    group: "{{ yugabyte_group }}"
    mode: "0755"
  when:
    - not ansible_check_mode
    - yugabyte_reinstall_required | default(false)

- name: Download pinned YugabyteDB tarball
  ansible.builtin.get_url:
    url: "{{ yugabyte_artifact_url }}"
    dest: "{{ yugabyte_tarball_path }}"
    checksum: "{{ yugabyte_artifact_checksum }}"
    mode: "0644"
    timeout: 300
  when:
    - not ansible_check_mode
    - yugabyte_reinstall_required | default(true)

# Each archive has its own tree. Old processes keep their executable, libraries and catalog files until restarted.
- name: Extract YugabyteDB tarball into clean artifact directory
  ansible.builtin.unarchive:
    src: "{{ yugabyte_tarball_path }}"
    dest: "{{ yugabyte_release_dir }}"
    remote_src: true
    owner: "{{ yugabyte_user }}"
    group: "{{ yugabyte_group }}"
    extra_opts:
      - --strip-components=1
    creates: "{{ yugabyte_install_sentinel }}"
  when:
    - not ansible_check_mode
    - yugabyte_reinstall_required | default(true)

- name: Run YugabyteDB post_install.sh (relocates embedded absolute paths)
  ansible.builtin.command: "{{ yugabyte_bin_dir }}/post_install.sh"
  args:
    creates: "{{ yugabyte_post_install_sentinel }}"
  register: yugabyte_post_install
  when: not ansible_check_mode

- name: Record post_install completion marker # noqa: no-handler
  ansible.builtin.file:
    path: "{{ yugabyte_post_install_sentinel }}"
    state: touch
    owner: "{{ yugabyte_user }}"
    group: "{{ yugabyte_group }}"
    mode: "0644"
  when:
    - not ansible_check_mode
    - yugabyte_post_install is changed

- name: Record installation sentinel
  ansible.builtin.file:
    path: "{{ yugabyte_install_sentinel }}"
    state: touch
    owner: "{{ yugabyte_user }}"
    group: "{{ yugabyte_group }}"
    mode: "0644"
  changed_when: false
  when:
    - not ansible_check_mode
    - yugabyte_reinstall_required | default(true)

# Service units use the absolute release path; current selects tools and the desired engine, not a running process's files.
- name: Select complete YugabyteDB release atomically
  ansible.builtin.shell: |
    set -eu
    link={{ yugabyte_current_link | quote }}
    pending="$(mktemp -d {{ (yugabyte_install_dir ~ '/.select-XXXXXX') | quote }})"
    trap 'rm -rf "$pending"' EXIT
    ln -s {{ yugabyte_release_dir | quote }} "$pending/current"
    mv -Tf "$pending/current" "$link"
  args:
    executable: /bin/bash
  changed_when: true
  notify:
    - yugabyte restart master
    - yugabyte restart tserver
  when:
    - not ansible_check_mode
    - (yugabyte_current.stat.lnk_source | default('')) != yugabyte_release_dir
