---
- name: Validate migration owner identifiers (Yugabyte)
  ansible.builtin.assert:
    that:
      - item.owner is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - item.schema is match('^[A-Za-z_][A-Za-z0-9_]*$')
    fail_msg: "Migration owner identifiers must be simple SQL identifiers"
  loop: "{{ yugabyte_migrate_items | default([]) }}"
  loop_control:
    label: "{{ item.db }}:{{ item.owner }}"
  when: yugabyte_migrate_items | default([]) | length > 0

# Mirror of postgres/tasks/migrate.yml for Yugabyte. Local admin traffic uses
# the built-in yugabyte role, which the generated HBA trusts only from 127.0.0.1.

- name: Ensure YSQL Ansible module prerequisites
  ansible.builtin.import_tasks: ysql_prereqs.yml

- name: Read applied migrations per database (Yugabyte)
  community.postgresql.postgresql_query:
    login_host: 127.0.0.1
    login_port: "{{ yugabyte_ysql_port }}"
    login_user: "{{ yugabyte_superuser_role }}"
    login_password: "{{ yugabyte_superuser_password }}"
    db: "{{ db_entry }}"
    query: "SELECT version || ':' || phase || ':' || seq AS key, checksum FROM _migrations"
  register: yugabyte_applied_queries
  changed_when: false
  failed_when: false
  check_mode: false
  loop: "{{ yugabyte_migrate_items | default([]) | map(attribute='db') | unique | list }}"
  loop_control:
    loop_var: db_entry
  no_log: true

- name: Fail on migration ledger read errors (Yugabyte)
  ansible.builtin.fail:
    msg: "Read _migrations failed for {{ item.db_entry }}."
  loop: "{{ yugabyte_applied_queries.results | default([]) }}"
  loop_control:
    label: "{{ item.db_entry }}"
  vars:
    ledger_read_error: "{{ (item.msg | default('')) ~ (item.stderr | default('')) }}"
  no_log: true
  when:
    - item.failed | default(false)
    - "'_migrations' not in ledger_read_error or 'does not exist' not in ledger_read_error"

- name: Index applied migrations by database (Yugabyte)
  ansible.builtin.set_fact:
    yugabyte_applied_by_db: >-
      {{ yugabyte_applied_by_db | default({})
         | combine({ item.db_entry:
                     dict((item.query_result | default([]) | map(attribute='key') | list)
                          | zip(item.query_result | default([]) | map(attribute='checksum') | list)) }) }}
  loop: "{{ yugabyte_applied_queries.results | default([]) }}"
  loop_control:
    label: "{{ item.db_entry }}"

- name: Fail on edited applied migrations (Yugabyte)
  ansible.builtin.fail:
    msg: >-
      Migration checksum mismatch for {{ item.db }}/{{ item.version }}/{{ item.phase }}/{{ item.filename }}:
      database has {{ yugabyte_applied_by_db[item.db][item.version ~ ':' ~ item.phase ~ ':' ~ (item.sequence | string)] }},
      embedded file has {{ item.checksum }}.
  loop: "{{ yugabyte_migrate_items | default([]) }}"
  loop_control:
    label: "{{ item.db }}/{{ item.version }}/{{ item.phase }}/{{ item.filename }}"
  vars:
    migration_key: "{{ item.version ~ ':' ~ item.phase ~ ':' ~ (item.sequence | string) }}"
  when:
    - yugabyte_migrate_items | default([]) | length > 0
    - migration_key in (yugabyte_applied_by_db[item.db] | default({}))
    - yugabyte_applied_by_db[item.db][migration_key] != item.checksum

- name: Select pending migrations (Yugabyte)
  ansible.builtin.set_fact:
    yugabyte_pending_migrate_items: "{{ yugabyte_pending_migrate_items | default([]) + [item] }}"
  loop: "{{ yugabyte_migrate_items | default([]) }}"
  loop_control:
    label: "{{ item.db }}/{{ item.version }}/{{ item.phase }}/{{ item.filename }}"
  vars:
    migration_key: "{{ item.version ~ ':' ~ item.phase ~ ':' ~ (item.sequence | string) }}"
  when:
    - yugabyte_migrate_items | default([]) | length > 0
    - migration_key not in (yugabyte_applied_by_db[item.db] | default({}))

- name: Report pending migrations (Yugabyte)
  ansible.builtin.debug:
    msg: >-
      Would apply {{ item.db }}/{{ item.version }}/{{ item.phase }}/{{ item.filename }}
      as {{ item.owner }}.
  loop: "{{ yugabyte_pending_migrate_items | default([]) }}"
  loop_control:
    label: "{{ item.db }}/{{ item.version }}/{{ item.phase }}/{{ item.filename }}"
  when: ansible_check_mode

- name: Reconcile application schema ownership before migrations (Yugabyte)
  community.postgresql.postgresql_query:
    login_host: 127.0.0.1
    login_port: "{{ yugabyte_ysql_port }}"
    login_user: "{{ yugabyte_superuser_role }}"
    login_password: "{{ yugabyte_superuser_password }}"
    db: "{{ db_entry }}"
    query: |
      DO $frameworks_migration_ownership$
      DECLARE
        target_schema text := '{{ migration_target.schema }}';
        target_owner text := '{{ migration_target.owner }}';
        target_owner_oid oid;
        obj record;
      BEGIN
        SELECT oid INTO target_owner_oid FROM pg_roles WHERE rolname = target_owner;
        IF target_owner_oid IS NULL THEN
          RAISE EXCEPTION 'role % does not exist', target_owner;
        END IF;
        IF NOT EXISTS (SELECT 1 FROM pg_namespace WHERE nspname = target_schema) THEN
          RAISE EXCEPTION 'application schema % does not exist', target_schema;
        END IF;

        IF EXISTS (
          SELECT 1 FROM pg_namespace
          WHERE nspname = target_schema AND nspowner <> target_owner_oid
        ) THEN
          EXECUTE format('ALTER SCHEMA %I OWNER TO %I', target_schema, target_owner);
        END IF;

        FOR obj IN
          SELECT n.nspname, c.relname, c.relkind
          FROM pg_class c
          JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE n.nspname = target_schema
            AND c.relkind IN ('r', 'p', 'v', 'm', 'S', 'f')
            AND c.relowner <> target_owner_oid
        LOOP
          IF obj.relkind = 'S' THEN
            EXECUTE format('ALTER SEQUENCE %I.%I OWNER TO %I', obj.nspname, obj.relname, target_owner);
          ELSIF obj.relkind = 'v' THEN
            EXECUTE format('ALTER VIEW %I.%I OWNER TO %I', obj.nspname, obj.relname, target_owner);
          ELSIF obj.relkind = 'm' THEN
            EXECUTE format('ALTER MATERIALIZED VIEW %I.%I OWNER TO %I', obj.nspname, obj.relname, target_owner);
          ELSIF obj.relkind = 'f' THEN
            EXECUTE format('ALTER FOREIGN TABLE %I.%I OWNER TO %I', obj.nspname, obj.relname, target_owner);
          ELSE
            EXECUTE format('ALTER TABLE %I.%I OWNER TO %I', obj.nspname, obj.relname, target_owner);
          END IF;
        END LOOP;

        FOR obj IN
          SELECT n.nspname, p.proname, pg_get_function_identity_arguments(p.oid) AS args
          FROM pg_proc p
          JOIN pg_namespace n ON n.oid = p.pronamespace
          WHERE n.nspname = target_schema
            AND p.proowner <> target_owner_oid
            AND p.prokind = 'f'
        LOOP
          EXECUTE format('ALTER FUNCTION %I.%I(%s) OWNER TO %I', obj.nspname, obj.proname, obj.args, target_owner);
        END LOOP;

        FOR obj IN
          SELECT n.nspname, p.proname, pg_get_function_identity_arguments(p.oid) AS args
          FROM pg_proc p
          JOIN pg_namespace n ON n.oid = p.pronamespace
          WHERE n.nspname = target_schema
            AND p.proowner <> target_owner_oid
            AND p.prokind = 'p'
        LOOP
          EXECUTE format('ALTER PROCEDURE %I.%I(%s) OWNER TO %I', obj.nspname, obj.proname, obj.args, target_owner);
        END LOOP;
      END
      $frameworks_migration_ownership$;
  loop: "{{ yugabyte_pending_migrate_items | default([]) | map(attribute='db') | unique | list }}"
  loop_control:
    loop_var: db_entry
  no_log: true
  vars:
    migration_target: "{{ yugabyte_pending_migrate_items | selectattr('db', 'equalto', db_entry) | first }}"
  when:
    - not ansible_check_mode
    - yugabyte_pending_migrate_items | default([]) | length > 0

- name: Ensure _migrations tracking table per database (Yugabyte)
  community.postgresql.postgresql_query:
    login_host: 127.0.0.1
    login_port: "{{ yugabyte_ysql_port }}"
    login_user: "{{ yugabyte_superuser_role }}"
    login_password: "{{ yugabyte_superuser_password }}"
    db: "{{ db_entry }}"
    query: |
      CREATE TABLE IF NOT EXISTS _migrations (
        version    TEXT NOT NULL,
        phase      TEXT NOT NULL DEFAULT 'expand',
        seq        INT NOT NULL,
        filename   TEXT NOT NULL,
        checksum   TEXT NOT NULL,
        transactional BOOLEAN NOT NULL DEFAULT true,
        applied_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        PRIMARY KEY (version, phase, seq)
      );
      ALTER TABLE _migrations
        ADD COLUMN IF NOT EXISTS phase TEXT NOT NULL DEFAULT 'expand';
      ALTER TABLE _migrations
        ADD COLUMN IF NOT EXISTS transactional BOOLEAN NOT NULL DEFAULT true;
      DO $$
      BEGIN
        IF EXISTS (
          SELECT 1
          FROM pg_constraint
          WHERE conrelid = '_migrations'::regclass
            AND conname = '_migrations_pkey'
            AND array_length(conkey, 1) = 2
        ) THEN
          ALTER TABLE _migrations DROP CONSTRAINT _migrations_pkey;
        END IF;
        IF NOT EXISTS (
          SELECT 1
          FROM pg_constraint
          WHERE conrelid = '_migrations'::regclass
            AND conname = '_migrations_pkey'
        ) THEN
          ALTER TABLE _migrations
            ADD CONSTRAINT _migrations_pkey PRIMARY KEY (version, phase, seq);
        END IF;
      END $$;
  loop: "{{ yugabyte_pending_migrate_items | default([]) | map(attribute='db') | unique | list }}"
  loop_control:
    loop_var: db_entry
  no_log: true
  when: not ansible_check_mode

- name: Apply pending migrations (Yugabyte)
  community.postgresql.postgresql_query:
    login_host: 127.0.0.1
    login_port: "{{ yugabyte_ysql_port }}"
    login_user: "{{ yugabyte_superuser_role }}"
    login_password: "{{ yugabyte_superuser_password }}"
    db: "{{ item.db }}"
    query: >-
      {{
        [
          "SELECT pg_advisory_lock(hashtext('frameworks_migrations'), hashtext('" ~ item.db ~ "'))",
          'SET ROLE "' ~ item.owner ~ '"'
        ]
        + item.statements
        + [
          "RESET ROLE",
          migration_ledger_sql,
          "SELECT pg_advisory_unlock(hashtext('frameworks_migrations'), hashtext('" ~ item.db ~ "'))"
        ]
      }}
    autocommit: "{{ not (item.transactional | default(true)) }}"
  loop: "{{ yugabyte_pending_migrate_items | default([]) }}"
  loop_control:
    label: "{{ item.db }}/{{ item.version }}/{{ item.phase }}/{{ item.filename }}"
  no_log: true
  when:
    - not ansible_check_mode
    - yugabyte_pending_migrate_items | default([]) | length > 0
  vars:
    migration_ledger_sql: >-
      INSERT INTO _migrations (version, phase, seq, filename, checksum, transactional)
      VALUES ('{{ item.version }}', '{{ item.phase }}', {{ item.sequence }},
              '{{ item.filename }}', '{{ item.checksum }}',
              {{ item.transactional | default(true) | ternary('true', 'false') }})
