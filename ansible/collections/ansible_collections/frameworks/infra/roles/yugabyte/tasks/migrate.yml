---
- name: Validate migration owner identifiers (Yugabyte)
  ansible.builtin.assert:
    that:
      - item.owner is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - item.schema is match('^[A-Za-z_][A-Za-z0-9_]*$')
    fail_msg: "Migration owner identifiers must be simple SQL identifiers"
  loop: "{{ yugabyte_migrate_items | default([]) }}"
  loop_control:
    label: "{{ item.db }}:{{ item.owner }}"
  when: yugabyte_migrate_items | default([]) | length > 0

# Mirror of postgres/tasks/migrate.yml for Yugabyte. Local admin traffic uses
# the built-in yugabyte role, which the generated HBA trusts only from this
# node's own YSQL address.

- name: Ensure YSQL Ansible module prerequisites
  ansible.builtin.import_tasks: ysql_prereqs.yml

- name: Read applied migrations per database (Yugabyte)
  community.postgresql.postgresql_query:
    login_host: "{{ yugabyte_ysql_local_host }}"
    login_port: "{{ yugabyte_ysql_port }}"
    login_user: "{{ yugabyte_superuser_role }}"
    login_password: "{{ yugabyte_superuser_password }}"
    login_db: "{{ db_entry }}"
    query: "SELECT version || ':' || phase || ':' || seq AS key, checksum FROM _migrations"
  register: yugabyte_applied_queries
  changed_when: false
  failed_when: false
  check_mode: false
  loop: "{{ yugabyte_migrate_items | default([]) | map(attribute='db') | unique | list }}"
  loop_control:
    loop_var: db_entry
  no_log: true

- name: Fail on migration ledger read errors (Yugabyte)
  ansible.builtin.fail:
    msg: "Read _migrations failed for {{ item.db_entry }}."
  loop: "{{ yugabyte_applied_queries.results | default([]) }}"
  loop_control:
    label: "{{ item.db_entry }}"
  vars:
    ledger_read_error: "{{ (item.msg | default('')) ~ (item.stderr | default('')) }}"
  no_log: true
  when:
    - item.failed | default(false)
    - "'_migrations' not in ledger_read_error or 'does not exist' not in ledger_read_error"

- name: Index applied migrations by database (Yugabyte)
  ansible.builtin.set_fact:
    yugabyte_applied_by_db: >-
      {{ yugabyte_applied_by_db | default({})
         | combine({ item.db_entry:
                     dict((item.query_result | default([]) | map(attribute='key') | list)
                          | zip(item.query_result | default([]) | map(attribute='checksum') | list)) }) }}
  loop: "{{ yugabyte_applied_queries.results | default([]) }}"
  loop_control:
    label: "{{ item.db_entry }}"

- name: Fail on edited applied migrations (Yugabyte)
  ansible.builtin.fail:
    msg: >-
      Migration checksum mismatch for {{ item.db }}/{{ item.version }}/{{ item.phase }}/{{ item.filename }}:
      database has {{ yugabyte_applied_by_db[item.db][item.version ~ ':' ~ item.phase ~ ':' ~ (item.sequence | string)] }},
      embedded file has {{ item.checksum }}.
  loop: "{{ yugabyte_migrate_items | default([]) }}"
  loop_control:
    label: "{{ item.db }}/{{ item.version }}/{{ item.phase }}/{{ item.filename }}"
  vars:
    migration_key: "{{ item.version ~ ':' ~ item.phase ~ ':' ~ (item.sequence | string) }}"
  when:
    - yugabyte_migrate_items | default([]) | length > 0
    - migration_key in (yugabyte_applied_by_db[item.db] | default({}))
    - yugabyte_applied_by_db[item.db][migration_key] != item.checksum

- name: Select pending migrations (Yugabyte)
  ansible.builtin.set_fact:
    yugabyte_pending_migrate_items: "{{ yugabyte_pending_migrate_items | default([]) + [item] }}"
  loop: "{{ yugabyte_migrate_items | default([]) }}"
  loop_control:
    label: "{{ item.db }}/{{ item.version }}/{{ item.phase }}/{{ item.filename }}"
  vars:
    migration_key: "{{ item.version ~ ':' ~ item.phase ~ ':' ~ (item.sequence | string) }}"
  when:
    - yugabyte_migrate_items | default([]) | length > 0
    - migration_key not in (yugabyte_applied_by_db[item.db] | default({}))

- name: Report pending migrations (Yugabyte)
  ansible.builtin.debug:
    msg: >-
      Would apply {{ item.db }}/{{ item.version }}/{{ item.phase }}/{{ item.filename }}
      as {{ item.owner }}.
  loop: "{{ yugabyte_pending_migrate_items | default([]) }}"
  loop_control:
    label: "{{ item.db }}/{{ item.version }}/{{ item.phase }}/{{ item.filename }}"
  when: ansible_check_mode

# Ownership is planned by one catalog read and then changed one statement per transaction (autocommit). A YSQL
# transaction keeps the catalog version it began with: once another session raised it (the auto-analyze service
# does at any time after rows were written) and the transaction ran a breaking DDL such as ALTER SCHEMA ... OWNER,
# its next catalog read fails with MISMATCHED_SCHEMA. A statement that starts its own transaction reads the current
# catalog.
- name: Plan application schema ownership before migrations (Yugabyte)
  community.postgresql.postgresql_query:
    login_host: "{{ yugabyte_ysql_local_host }}"
    login_port: "{{ yugabyte_ysql_port }}"
    login_user: "{{ yugabyte_superuser_role }}"
    login_password: "{{ yugabyte_superuser_password }}"
    login_db: "{{ db_entry }}"
    query: |
      WITH target AS (
        SELECT n.oid AS schema_oid, n.nspname AS schema_name, n.nspowner AS schema_owner,
               r.rolname AS owner_name, r.oid AS owner_oid
        -- The casts fail when the application schema or the owner role is missing.
        FROM pg_namespace n
        JOIN pg_roles r ON r.oid = quote_ident('{{ migration_target.owner }}')::regrole
        WHERE n.oid = quote_ident('{{ migration_target.schema }}')::regnamespace
      )
      SELECT ddl FROM (
        SELECT 0 AS phase, ''::text AS object_name, format('ALTER SCHEMA %I OWNER TO %I', t.schema_name, t.owner_name) AS ddl
        FROM target t
        WHERE t.schema_owner <> t.owner_oid
        UNION ALL
        SELECT 1, c.relname::text, format(
          CASE c.relkind
            WHEN 'S' THEN 'ALTER SEQUENCE %I.%I OWNER TO %I'
            WHEN 'v' THEN 'ALTER VIEW %I.%I OWNER TO %I'
            WHEN 'm' THEN 'ALTER MATERIALIZED VIEW %I.%I OWNER TO %I'
            WHEN 'f' THEN 'ALTER FOREIGN TABLE %I.%I OWNER TO %I'
            ELSE 'ALTER TABLE %I.%I OWNER TO %I'
          END, t.schema_name, c.relname, t.owner_name)
        FROM target t
        JOIN pg_class c ON c.relnamespace = t.schema_oid
        WHERE c.relkind IN ('r', 'p', 'v', 'm', 'S', 'f')
          AND c.relowner <> t.owner_oid
          -- A sequence owned by a column (serial, identity) cannot change owner by itself; ALTER TABLE moves it.
          AND NOT (c.relkind = 'S' AND EXISTS (
            SELECT 1 FROM pg_depend d
            WHERE d.classid = 'pg_class'::regclass AND d.objid = c.oid
              AND d.refclassid = 'pg_class'::regclass AND d.deptype IN ('a', 'i')
          ))
        UNION ALL
        SELECT 2, p.proname || '(' || pg_get_function_identity_arguments(p.oid) || ')',
          format('ALTER %s %I.%I(%s) OWNER TO %I',
            CASE p.prokind WHEN 'p' THEN 'PROCEDURE' ELSE 'FUNCTION' END,
            t.schema_name, p.proname, pg_get_function_identity_arguments(p.oid), t.owner_name)
        FROM target t
        JOIN pg_proc p ON p.pronamespace = t.schema_oid
        WHERE p.proowner <> t.owner_oid
          AND p.prokind IN ('f', 'p')
      ) ownership
      ORDER BY phase, object_name
  register: yugabyte_migration_ownership_plans
  changed_when: false
  loop: "{{ yugabyte_pending_migrate_items | default([]) | map(attribute='db') | unique | list }}"
  loop_control:
    loop_var: db_entry
  vars:
    migration_target: "{{ yugabyte_pending_migrate_items | selectattr('db', 'equalto', db_entry) | first }}"
  when:
    - not ansible_check_mode
    - yugabyte_pending_migrate_items | default([]) | length > 0

- name: Reconcile application schema ownership before migrations (Yugabyte)
  community.postgresql.postgresql_query:
    login_host: "{{ yugabyte_ysql_local_host }}"
    login_port: "{{ yugabyte_ysql_port }}"
    login_user: "{{ yugabyte_superuser_role }}"
    login_password: "{{ yugabyte_superuser_password }}"
    login_db: "{{ ownership_plan.db_entry }}"
    autocommit: true
    query: "{{ ownership_plan.query_result | map(attribute='ddl') | list }}"
  loop: "{{ yugabyte_migration_ownership_plans.results | default([]) }}"
  loop_control:
    loop_var: ownership_plan
    label: "{{ ownership_plan.db_entry }}"
  when:
    - not ansible_check_mode
    - yugabyte_pending_migrate_items | default([]) | length > 0
    - ownership_plan.query_result | default([]) | length > 0

- name: Ensure _migrations tracking table per database (Yugabyte)
  community.postgresql.postgresql_query:
    login_host: "{{ yugabyte_ysql_local_host }}"
    login_port: "{{ yugabyte_ysql_port }}"
    login_user: "{{ yugabyte_superuser_role }}"
    login_password: "{{ yugabyte_superuser_password }}"
    login_db: "{{ db_entry }}"
    query: |
      CREATE TABLE IF NOT EXISTS _migrations (
        version    TEXT NOT NULL,
        phase      TEXT NOT NULL DEFAULT 'expand',
        seq        INT NOT NULL,
        filename   TEXT NOT NULL,
        checksum   TEXT NOT NULL,
        transactional BOOLEAN NOT NULL DEFAULT true,
        applied_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        PRIMARY KEY (version, phase, seq)
      );
      ALTER TABLE _migrations
        ADD COLUMN IF NOT EXISTS phase TEXT NOT NULL DEFAULT 'expand';
      ALTER TABLE _migrations
        ADD COLUMN IF NOT EXISTS transactional BOOLEAN NOT NULL DEFAULT true;
      DO $$
      BEGIN
        IF EXISTS (
          SELECT 1
          FROM pg_constraint
          WHERE conrelid = '_migrations'::regclass
            AND conname = '_migrations_pkey'
            AND array_length(conkey, 1) = 2
        ) THEN
          ALTER TABLE _migrations DROP CONSTRAINT _migrations_pkey;
        END IF;
        IF NOT EXISTS (
          SELECT 1
          FROM pg_constraint
          WHERE conrelid = '_migrations'::regclass
            AND conname = '_migrations_pkey'
        ) THEN
          ALTER TABLE _migrations
            ADD CONSTRAINT _migrations_pkey PRIMARY KEY (version, phase, seq);
        END IF;
      END $$;
  loop: "{{ yugabyte_pending_migrate_items | default([]) | map(attribute='db') | unique | list }}"
  loop_control:
    loop_var: db_entry
  no_log: true
  when: not ansible_check_mode

# Items apply one at a time and in order, each with its precheck first (migrate_item.yml). The included tasks carry
# the migrate tag through apply, because tags on an include do not reach the tasks it loads.
- name: Apply pending migrations (Yugabyte)
  ansible.builtin.include_tasks:
    file: migrate_item.yml
    apply:
      tags: [migrate]
  loop: "{{ yugabyte_pending_migrate_items | default([]) }}"
  loop_control:
    label: "{{ item.db }}/{{ item.version }}/{{ item.phase }}/{{ item.filename }}"
  when:
    - not ansible_check_mode
    - yugabyte_pending_migrate_items | default([]) | length > 0
