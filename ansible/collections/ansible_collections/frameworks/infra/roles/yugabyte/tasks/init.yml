---
# YSQL is PostgreSQL-wire-compatible. Init runs locally as the built-in
# yugabyte admin role, which the generated HBA trusts only from 127.0.0.1.
# Application owners get the SOPS-backed password and connect over SCRAM.

- name: Ensure YSQL Ansible module prerequisites
  ansible.builtin.import_tasks: ysql_prereqs.yml

- name: Assert application passwords are present
  ansible.builtin.assert:
    that: (item.password | default(yugabyte_application_password)) | length > 0
    fail_msg: "Yugabyte database {{ item.name }} requires an application password; supply per-database password or yugabyte_application_password"
  loop: "{{ yugabyte_databases }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  when: yugabyte_databases | length > 0

- name: Assert runtime passwords are present and independent
  ansible.builtin.assert:
    that:
      - (item.runtime_password | default(yugabyte_runtime_password)) | length > 0
      - (item.runtime_password | default(yugabyte_runtime_password)) != (item.password | default(yugabyte_application_password))
      - (item.runtime_role | default((item.owner | default(item.name, true)) ~ '_runtime', true)) != (item.owner | default(item.name, true))
    fail_msg: "Yugabyte database {{ item.name }} requires distinct owner/runtime roles and passwords"
  loop: "{{ yugabyte_databases }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  when: yugabyte_databases | length > 0

- name: Create application owner roles
  community.postgresql.postgresql_user:
    name: "{{ item.owner | default(item.name, true) }}"
    password: "{{ item.password | default(yugabyte_application_password) }}"
    role_attr_flags: LOGIN
    login_host: 127.0.0.1
    login_port: "{{ yugabyte_ysql_port }}"
    login_user: "{{ yugabyte_superuser_role }}"
    login_password: "{{ yugabyte_superuser_password }}"
    login_db: yugabyte
    state: present
  loop: "{{ yugabyte_databases }}"
  loop_control:
    label: "{{ item.owner | default(item.name, true) }}"
  no_log: true
  when:
    - not ansible_check_mode
    - yugabyte_databases | length > 0

# Colocation is fixed when a database is created. Existing databases are never
# altered or recreated here; placement drift is reported by cluster doctor.
- name: Validate database identifiers used in CREATE DATABASE
  ansible.builtin.assert:
    that:
      - item.name is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - (item.owner | default(item.name, true)) is match('^[A-Za-z_][A-Za-z0-9_]*$')
    fail_msg: "Yugabyte database {{ item.name }} and its owner must be plain SQL identifiers"
  # Loops over the identifiers only: an assert echoes each loop item in its
  # result, and the database entries carry their passwords.
  loop: >-
    {{ yugabyte_databases | map('dict2items')
       | map('selectattr', 'key', 'in', ['name', 'owner']) | map('items2dict') | list }}
  loop_control:
    label: "{{ item.name }}"
  when: yugabyte_databases | length > 0

- name: Read existing databases
  community.postgresql.postgresql_query:
    login_host: 127.0.0.1
    login_port: "{{ yugabyte_ysql_port }}"
    login_user: "{{ yugabyte_superuser_role }}"
    login_password: "{{ yugabyte_superuser_password }}"
    login_db: yugabyte
    query: SELECT datname FROM pg_database
  register: yugabyte_existing_databases
  when:
    - not ansible_check_mode
    - yugabyte_databases | length > 0

- name: Create colocated databases
  community.postgresql.postgresql_query:
    login_host: 127.0.0.1
    login_port: "{{ yugabyte_ysql_port }}"
    login_user: "{{ yugabyte_superuser_role }}"
    login_password: "{{ yugabyte_superuser_password }}"
    login_db: yugabyte
    autocommit: true
    query: >-
      CREATE DATABASE "{{ item.name }}"
      WITH OWNER = "{{ item.owner }}" COLOCATION = true
  # The placements list carries no credentials, so an engine error stays visible.
  loop: "{{ yugabyte_database_placements | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - not ansible_check_mode
    - item.colocated | bool
    - item.name not in (yugabyte_existing_databases.query_result | default([]) | map(attribute='datname') | list)

- name: Create databases
  community.postgresql.postgresql_db:
    name: "{{ item.name }}"
    owner: "{{ item.owner }}"
    login_host: 127.0.0.1
    login_port: "{{ yugabyte_ysql_port }}"
    login_user: "{{ yugabyte_superuser_role }}"
    login_password: "{{ yugabyte_superuser_password }}"
    state: present
  loop: "{{ yugabyte_database_placements | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - not ansible_check_mode
    - not (item.colocated | bool)

- name: Create least-privilege application runtime roles
  community.postgresql.postgresql_user:
    name: "{{ item.runtime_role | default((item.owner | default(item.name, true)) ~ '_runtime', true) }}"
    password: "{{ item.runtime_password | default(yugabyte_runtime_password) }}"
    role_attr_flags: LOGIN,NOSUPERUSER,NOCREATEDB,NOCREATEROLE,NOREPLICATION
    login_host: 127.0.0.1
    login_port: "{{ yugabyte_ysql_port }}"
    login_user: "{{ yugabyte_superuser_role }}"
    login_password: "{{ yugabyte_superuser_password }}"
    login_db: yugabyte
    state: present
  loop: "{{ yugabyte_databases }}"
  loop_control:
    label: "{{ item.runtime_role | default((item.owner | default(item.name, true)) ~ '_runtime', true) }}"
  no_log: true
  when:
    - not ansible_check_mode
    - yugabyte_databases | length > 0

# Services log in as the runtime roles, and nothing else does: migrations, backups, restores, relayout and cluster
# doctor connect as the superuser, and relayout's probes SET ROLE, which does not apply a role's settings. A transaction
# a service leaves open keeps its locks and provisional writes until its session ends, so a runtime session idle inside
# a transaction is ended after a minute and a runtime statement is cancelled after a minute. A role's settings apply
# at login, so a service's pool takes them up as it opens connections. ALTER ROLE changes the shared catalog, which
# invalidates every backend's catalog cache on the cluster, so a role is altered only when its settings differ.
- name: Find runtime roles without session limits
  community.postgresql.postgresql_query:
    login_host: 127.0.0.1
    login_port: "{{ yugabyte_ysql_port }}"
    login_user: "{{ yugabyte_superuser_role }}"
    login_password: "{{ yugabyte_superuser_password }}"
    login_db: yugabyte
    query: >-
      SELECT r.rolname FROM pg_roles r
      WHERE r.rolname = ANY(string_to_array(%(roles)s, ','))
        AND NOT EXISTS (
          SELECT 1 FROM pg_db_role_setting s
          WHERE s.setrole = r.oid AND s.setdatabase = 0 AND s.setconfig @> string_to_array(%(limits)s, ','))
      ORDER BY r.rolname
    # Lists are passed joined: the module renders a list argument with its elements' Python quotes inside the array.
    named_args:
      roles: "{{ yugabyte_runtime_role_names | join(',') }}"
      limits: >-
        statement_timeout={{ yugabyte_runtime_statement_timeout }},idle_in_transaction_session_timeout={{
        yugabyte_runtime_idle_in_transaction_session_timeout }}
  register: yugabyte_runtime_roles_unbounded
  changed_when: false
  vars:
    yugabyte_runtime_role_names: >-
      {%- set names = [] -%}
      {%- for database in yugabyte_databases -%}
      {%- set _ = names.append(database.runtime_role | default((database.owner | default(database.name, true)) ~ '_runtime', true)) -%}
      {%- endfor -%}
      {{ names | unique | list }}
  when:
    - not ansible_check_mode
    - yugabyte_databases | length > 0

- name: Bound runtime role sessions
  community.postgresql.postgresql_query:
    login_host: 127.0.0.1
    login_port: "{{ yugabyte_ysql_port }}"
    login_user: "{{ yugabyte_superuser_role }}"
    login_password: "{{ yugabyte_superuser_password }}"
    login_db: yugabyte
    autocommit: true
    query:
      - ALTER ROLE "{{ item.rolname }}" SET statement_timeout = '{{ yugabyte_runtime_statement_timeout }}'
      - >-
        ALTER ROLE "{{ item.rolname }}"
        SET idle_in_transaction_session_timeout = '{{ yugabyte_runtime_idle_in_transaction_session_timeout }}'
  # The module reports no rows as an empty mapping.
  loop: "{{ yugabyte_runtime_roles_unbounded.query_result | default([]) | list }}"
  loop_control:
    label: "{{ item.rolname }}"
  when: not ansible_check_mode

- name: Grant database ownership to owner role
  community.postgresql.postgresql_owner:
    login_db: "{{ item.name }}"
    new_owner: "{{ item.owner | default(item.name, true) }}"
    obj_type: database
    login_host: 127.0.0.1
    login_port: "{{ yugabyte_ysql_port }}"
    login_user: "{{ yugabyte_superuser_role }}"
    login_password: "{{ yugabyte_superuser_password }}"
  loop: "{{ yugabyte_databases }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  when:
    - not ansible_check_mode
    - yugabyte_databases | length > 0
