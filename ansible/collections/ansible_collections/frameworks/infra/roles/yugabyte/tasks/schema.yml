---
# Baseline schema SQL runs locally as the built-in Yugabyte admin role. The CLI
# passes local temp file paths; Ansible copies those bytes and executes them
# with ysqlsh -f so SQL text is never Jinja-rendered.
# A baseline is applied to a schema without tables, or to any item with
# reapply=true: the CLI sets it when completing a schema whose baseline apply
# was interrupted and for the scratch reference database that completion is
# verified against. The CLI renders an item without reapply with its indexes
# built NONCONCURRENTLY, which indexes only the rows present when the build
# starts; this gate applies such an item only while the schema has no tables,
# so no session can write to them during the build. A reapply item keeps
# online index builds.

- name: Ensure YSQL Ansible module prerequisites
  ansible.builtin.import_tasks: ysql_prereqs.yml

- name: Validate baseline schema ownership identifiers
  ansible.builtin.assert:
    that:
      - item.db is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - (item.schema | default(item.db, true)) is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - (item.owner | default(item.db, true)) is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - (item.runtime_role | default((item.owner | default(item.db, true)) ~ '_runtime')) is match('^[A-Za-z_][A-Za-z0-9_]*$')
    fail_msg: "Baseline schema db/schema/owner identifiers must be simple SQL identifiers"
  loop: "{{ yugabyte_schema_items | default([]) }}"
  loop_control:
    label: "{{ item.db }}"
  when: yugabyte_schema_items | default([]) | length > 0

- name: Probe baseline schema state
  community.postgresql.postgresql_query:
    login_host: 127.0.0.1
    login_port: "{{ yugabyte_ysql_port }}"
    login_user: "{{ yugabyte_superuser_role }}"
    login_password: "{{ yugabyte_superuser_password }}"
    login_db: "{{ item.db }}"
    query: |
      SELECT EXISTS (
        SELECT 1
        FROM information_schema.tables
        WHERE table_schema = '{{ item.schema | default(item.db, true) }}'
          AND table_type = 'BASE TABLE'
      ) AS has_tables
  register: yugabyte_schema_state_queries
  changed_when: false
  check_mode: false
  loop: "{{ yugabyte_schema_items | default([]) }}"
  loop_control:
    label: "{{ item.db }}"
  no_log: true
  when: yugabyte_schema_items | default([]) | length > 0

- name: Index baseline schema state by database
  ansible.builtin.set_fact:
    yugabyte_schema_has_tables_by_db: >-
      {{ yugabyte_schema_has_tables_by_db | default({})
         | combine({ item.item.db: (item.query_result[0].has_tables | default(false) | bool) }) }}
  loop: "{{ yugabyte_schema_state_queries.results | default([]) }}"
  loop_control:
    label: "{{ item.item.db }}"
  no_log: true

- name: Copy baseline schema SQL files
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/tmp/frameworks-schema-{{ item.db | regex_replace('[^A-Za-z0-9_.-]', '_') }}.sql"
    mode: "0600"
  loop: "{{ yugabyte_schema_items | default([]) }}"
  loop_control:
    label: "{{ item.db }}"
  no_log: true
  when:
    - not ansible_check_mode
    - yugabyte_schema_items | default([]) | length > 0
    - (not (yugabyte_schema_has_tables_by_db[item.db] | default(false))) or (item.reapply | default(false) | bool)

# ysqlsh sends the baseline one statement at a time in autocommit. Sent as one query, the file runs as one implicit
# transaction that YugabyteDB can neither keep nor retry: DDL runs outside transaction blocks, so an ALTER TABLE or
# foreign key on a colocated database's shared tablet aborts the transaction holding the file's earlier inserts
# (40001), and query-layer retries do not apply to multi-statement queries. ON_ERROR_STOP ends the apply at the
# first failing statement; a reapply finishes it through the baseline's IF NOT EXISTS DDL. The tools come from the
# selected release, as relayout selects them, or from an in-place installation the role has not converted yet.
- name: Apply baseline schemas via YSQL
  ansible.builtin.shell: |
    set -eu
    current={{ yugabyte_current_link | quote }}
    ysqlsh=""
    if [ -e "$current" ] || [ -L "$current" ]; then
      for candidate in "$current/postgres/bin/ysqlsh" "$current/bin/ysqlsh"; do
        if [ -x "$candidate" ]; then ysqlsh="$candidate"; break; fi
      done
    else
      for candidate in {{ (yugabyte_install_dir ~ '/postgres/bin/ysqlsh') | quote }} {{ (yugabyte_install_dir ~ '/bin/ysqlsh') | quote }}; do
        if [ -x "$candidate" ]; then ysqlsh="$candidate"; break; fi
      done
    fi
    if [ -z "$ysqlsh" ]; then
      echo "no ysqlsh in the selected YugabyteDB release or {{ yugabyte_install_dir }}" >&2
      exit 2
    fi
    exec "$ysqlsh" -X -q -v ON_ERROR_STOP=1 -h 127.0.0.1 -p {{ yugabyte_ysql_port | quote }} \
      -U {{ yugabyte_superuser_role | quote }} -d {{ item.db | quote }} \
      -f {{ ('/tmp/frameworks-schema-' ~ (item.db | regex_replace('[^A-Za-z0-9_.-]', '_')) ~ '.sql') | quote }}
  args:
    executable: /bin/bash
  environment:
    PGPASSWORD: "{{ yugabyte_superuser_password }}"
  changed_when: true
  loop: "{{ yugabyte_schema_items | default([]) }}"
  loop_control:
    label: "{{ item.db }}"
  when:
    - not ansible_check_mode
    - yugabyte_schema_items | default([]) | length > 0
    - (not (yugabyte_schema_has_tables_by_db[item.db] | default(false))) or (item.reapply | default(false) | bool)

# Ownership and grants are planned by one catalog read and then run one statement per transaction (autocommit). A
# YSQL transaction keeps the catalog version it began with: once another session raised it (the auto-analyze
# service does at any time after rows were written) and the transaction ran a breaking DDL such as
# ALTER SCHEMA ... OWNER, its next catalog read, including the one inside GRANT ... ON ALL TABLES, fails with
# MISMATCHED_SCHEMA. A statement that starts its own transaction reads the current catalog.
- name: Plan baseline schema ownership changes
  community.postgresql.postgresql_query:
    login_host: 127.0.0.1
    login_port: "{{ yugabyte_ysql_port }}"
    login_user: "{{ yugabyte_superuser_role }}"
    login_password: "{{ yugabyte_superuser_password }}"
    login_db: "{{ item.db }}"
    query: |
      WITH target AS (
        SELECT n.oid AS schema_oid, n.nspname AS schema_name, n.nspowner AS schema_owner,
               r.rolname AS owner_name, r.oid AS owner_oid
        FROM pg_namespace n
        -- The cast fails when the owner role is missing.
        CROSS JOIN LATERAL (
          SELECT rolname, oid FROM pg_roles WHERE oid = quote_ident('{{ item.owner | default(item.db, true) }}')::regrole
        ) r
        WHERE n.nspname = '{{ item.schema | default(item.db, true) }}'
      )
      SELECT ddl FROM (
        SELECT 0 AS phase, ''::text AS object_name, format('ALTER SCHEMA %I OWNER TO %I', t.schema_name, t.owner_name) AS ddl
        FROM target t
        WHERE t.schema_owner <> t.owner_oid
        UNION ALL
        SELECT 1, c.relname::text, format(
          CASE c.relkind
            WHEN 'S' THEN 'ALTER SEQUENCE %I.%I OWNER TO %I'
            WHEN 'v' THEN 'ALTER VIEW %I.%I OWNER TO %I'
            WHEN 'm' THEN 'ALTER MATERIALIZED VIEW %I.%I OWNER TO %I'
            WHEN 'f' THEN 'ALTER FOREIGN TABLE %I.%I OWNER TO %I'
            ELSE 'ALTER TABLE %I.%I OWNER TO %I'
          END, t.schema_name, c.relname, t.owner_name)
        FROM target t
        JOIN pg_class c ON c.relnamespace = t.schema_oid
        WHERE c.relkind IN ('r', 'p', 'v', 'm', 'S', 'f')
          AND c.relowner <> t.owner_oid
          -- A sequence owned by a column (serial, identity) cannot change owner by itself; ALTER TABLE moves it.
          AND NOT (c.relkind = 'S' AND EXISTS (
            SELECT 1 FROM pg_depend d
            WHERE d.classid = 'pg_class'::regclass AND d.objid = c.oid
              AND d.refclassid = 'pg_class'::regclass AND d.deptype IN ('a', 'i')
          ))
        UNION ALL
        SELECT 2, p.proname || '(' || pg_get_function_identity_arguments(p.oid) || ')',
          format('ALTER %s %I.%I(%s) OWNER TO %I',
            CASE p.prokind WHEN 'p' THEN 'PROCEDURE' ELSE 'FUNCTION' END,
            t.schema_name, p.proname, pg_get_function_identity_arguments(p.oid), t.owner_name)
        FROM target t
        JOIN pg_proc p ON p.pronamespace = t.schema_oid
        WHERE p.proowner <> t.owner_oid
          AND p.prokind IN ('f', 'p')
        UNION ALL
        SELECT 3 + g.position, '', format(g.template, t.schema_name, t.owner_name)
        FROM target t
        CROSS JOIN unnest(ARRAY[
          'GRANT USAGE, CREATE ON SCHEMA %I TO %I',
          'GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA %I TO %I',
          'GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA %I TO %I',
          'GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA %I TO %I',
          'ALTER DEFAULT PRIVILEGES IN SCHEMA %I GRANT ALL PRIVILEGES ON TABLES TO %I',
          'ALTER DEFAULT PRIVILEGES IN SCHEMA %I GRANT ALL PRIVILEGES ON SEQUENCES TO %I',
          'ALTER DEFAULT PRIVILEGES IN SCHEMA %I GRANT EXECUTE ON FUNCTIONS TO %I'
        ]) WITH ORDINALITY AS g(template, position)
      ) ownership
      ORDER BY phase, object_name
  register: yugabyte_schema_ownership_plans
  changed_when: false
  loop: "{{ yugabyte_schema_items | default([]) }}"
  loop_control:
    label: "{{ item.db }}"
  when:
    - not ansible_check_mode
    - yugabyte_schema_items | default([]) | length > 0

- name: Grant baseline schema ownership to application role
  community.postgresql.postgresql_query:
    login_host: 127.0.0.1
    login_port: "{{ yugabyte_ysql_port }}"
    login_user: "{{ yugabyte_superuser_role }}"
    login_password: "{{ yugabyte_superuser_password }}"
    login_db: "{{ ownership_plan.item.db }}"
    autocommit: true
    query: "{{ ownership_plan.query_result | map(attribute='ddl') | list }}"
  loop: "{{ yugabyte_schema_ownership_plans.results | default([]) }}"
  loop_control:
    loop_var: ownership_plan
    label: "{{ ownership_plan.item.db }}"
  when:
    - not ansible_check_mode
    - yugabyte_schema_items | default([]) | length > 0
    - ownership_plan.query_result | default([]) | length > 0

- name: Grant least-privilege runtime access to application schema
  community.postgresql.postgresql_query:
    login_host: 127.0.0.1
    login_port: "{{ yugabyte_ysql_port }}"
    login_user: "{{ yugabyte_superuser_role }}"
    login_password: "{{ yugabyte_superuser_password }}"
    login_db: "{{ item.db }}"
    # One transaction per statement, for the catalog-version reason above the ownership plan. A missing schema or
    # runtime role fails the first statement that names it.
    autocommit: true
    query:
      - GRANT CONNECT ON DATABASE "{{ item.db }}" TO "{{ runtime_role }}"
      - GRANT USAGE ON SCHEMA "{{ target_schema }}" TO "{{ runtime_role }}"
      - REVOKE CREATE ON SCHEMA "{{ target_schema }}" FROM "{{ runtime_role }}"
      - GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA "{{ target_schema }}" TO "{{ runtime_role }}"
      - GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA "{{ target_schema }}" TO "{{ runtime_role }}"
      - GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA "{{ target_schema }}" TO "{{ runtime_role }}"
      - >-
        ALTER DEFAULT PRIVILEGES FOR ROLE "{{ target_owner }}" IN SCHEMA "{{ target_schema }}"
        GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO "{{ runtime_role }}"
      - >-
        ALTER DEFAULT PRIVILEGES FOR ROLE "{{ target_owner }}" IN SCHEMA "{{ target_schema }}"
        GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO "{{ runtime_role }}"
      - >-
        ALTER DEFAULT PRIVILEGES FOR ROLE "{{ target_owner }}" IN SCHEMA "{{ target_schema }}"
        GRANT EXECUTE ON FUNCTIONS TO "{{ runtime_role }}"
  vars:
    target_schema: "{{ item.schema | default(item.db, true) }}"
    target_owner: "{{ item.owner | default(item.db, true) }}"
    runtime_role: "{{ item.runtime_role | default((item.owner | default(item.db, true)) ~ '_runtime') }}"
  loop: "{{ yugabyte_schema_items | default([]) }}"
  loop_control:
    label: "{{ item.db }}:{{ item.runtime_role | default((item.owner | default(item.db, true)) ~ '_runtime') }}"
  no_log: true
  when:
    - not ansible_check_mode
    - yugabyte_schema_items | default([]) | length > 0

- name: Remove baseline schema SQL files
  ansible.builtin.file:
    path: "/tmp/frameworks-schema-{{ item.db | regex_replace('[^A-Za-z0-9_.-]', '_') }}.sql"
    state: absent
  loop: "{{ yugabyte_schema_items | default([]) }}"
  loop_control:
    label: "{{ item.db }}"
  no_log: true
  when:
    - not ansible_check_mode
    - yugabyte_schema_items | default([]) | length > 0
    - (not (yugabyte_schema_has_tables_by_db[item.db] | default(false))) or (item.reapply | default(false) | bool)
