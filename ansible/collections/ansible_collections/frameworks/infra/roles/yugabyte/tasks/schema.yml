---
# Baseline schema SQL runs locally as the built-in Yugabyte admin role. The CLI
# passes local temp file paths; Ansible copies those bytes and executes them
# with ysqlsh -f so SQL text is never Jinja-rendered.
# A baseline is applied to a schema without tables, or to any item with
# reapply=true: the CLI sets it when completing a schema whose baseline apply
# was interrupted and for the scratch reference database that completion is
# verified against. The CLI renders an item without reapply with its indexes
# built NONCONCURRENTLY, which indexes only the rows present when the build
# starts; this gate applies such an item only while the schema has no tables,
# so no session can write to them during the build. A reapply item keeps
# online index builds.

- name: Ensure YSQL Ansible module prerequisites
  ansible.builtin.import_tasks: ysql_prereqs.yml

- name: Validate baseline schema ownership identifiers
  ansible.builtin.assert:
    that:
      - item.db is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - (item.schema | default(item.db, true)) is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - (item.owner | default(item.db, true)) is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - (item.runtime_role | default((item.owner | default(item.db, true)) ~ '_runtime')) is match('^[A-Za-z_][A-Za-z0-9_]*$')
    fail_msg: "Baseline schema db/schema/owner identifiers must be simple SQL identifiers"
  loop: "{{ yugabyte_schema_items | default([]) }}"
  loop_control:
    label: "{{ item.db }}"
  when: yugabyte_schema_items | default([]) | length > 0

- name: Probe baseline schema state
  community.postgresql.postgresql_query:
    login_host: 127.0.0.1
    login_port: "{{ yugabyte_ysql_port }}"
    login_user: "{{ yugabyte_superuser_role }}"
    login_password: "{{ yugabyte_superuser_password }}"
    login_db: "{{ item.db }}"
    query: |
      SELECT EXISTS (
        SELECT 1
        FROM information_schema.tables
        WHERE table_schema = '{{ item.schema | default(item.db, true) }}'
          AND table_type = 'BASE TABLE'
      ) AS has_tables
  register: yugabyte_schema_state_queries
  changed_when: false
  check_mode: false
  loop: "{{ yugabyte_schema_items | default([]) }}"
  loop_control:
    label: "{{ item.db }}"
  no_log: true
  when: yugabyte_schema_items | default([]) | length > 0

- name: Index baseline schema state by database
  ansible.builtin.set_fact:
    yugabyte_schema_has_tables_by_db: >-
      {{ yugabyte_schema_has_tables_by_db | default({})
         | combine({ item.item.db: (item.query_result[0].has_tables | default(false) | bool) }) }}
  loop: "{{ yugabyte_schema_state_queries.results | default([]) }}"
  loop_control:
    label: "{{ item.item.db }}"
  no_log: true

- name: Copy baseline schema SQL files
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/tmp/frameworks-schema-{{ item.db | regex_replace('[^A-Za-z0-9_.-]', '_') }}.sql"
    mode: "0600"
  loop: "{{ yugabyte_schema_items | default([]) }}"
  loop_control:
    label: "{{ item.db }}"
  no_log: true
  when:
    - not ansible_check_mode
    - yugabyte_schema_items | default([]) | length > 0
    - (not (yugabyte_schema_has_tables_by_db[item.db] | default(false))) or (item.reapply | default(false) | bool)

# ysqlsh sends the baseline one statement at a time in autocommit. Sent as one query, the file runs as one implicit
# transaction that YugabyteDB can neither keep nor retry: DDL runs outside transaction blocks, so an ALTER TABLE or
# foreign key on a colocated database's shared tablet aborts the transaction holding the file's earlier inserts
# (40001), and query-layer retries do not apply to multi-statement queries. ON_ERROR_STOP ends the apply at the
# first failing statement; a reapply finishes it through the baseline's IF NOT EXISTS DDL. The tools come from the
# selected release, as relayout selects them, or from an in-place installation the role has not converted yet.
- name: Apply baseline schemas via YSQL
  ansible.builtin.shell: |
    set -eu
    current={{ yugabyte_current_link | quote }}
    ysqlsh=""
    if [ -e "$current" ] || [ -L "$current" ]; then
      for candidate in "$current/postgres/bin/ysqlsh" "$current/bin/ysqlsh"; do
        if [ -x "$candidate" ]; then ysqlsh="$candidate"; break; fi
      done
    else
      for candidate in {{ (yugabyte_install_dir ~ '/postgres/bin/ysqlsh') | quote }} {{ (yugabyte_install_dir ~ '/bin/ysqlsh') | quote }}; do
        if [ -x "$candidate" ]; then ysqlsh="$candidate"; break; fi
      done
    fi
    if [ -z "$ysqlsh" ]; then
      echo "no ysqlsh in the selected YugabyteDB release or {{ yugabyte_install_dir }}" >&2
      exit 2
    fi
    exec "$ysqlsh" -X -q -v ON_ERROR_STOP=1 -h 127.0.0.1 -p {{ yugabyte_ysql_port | quote }} \
      -U {{ yugabyte_superuser_role | quote }} -d {{ item.db | quote }} \
      -f {{ ('/tmp/frameworks-schema-' ~ (item.db | regex_replace('[^A-Za-z0-9_.-]', '_')) ~ '.sql') | quote }}
  args:
    executable: /bin/bash
  environment:
    PGPASSWORD: "{{ yugabyte_superuser_password }}"
  changed_when: true
  loop: "{{ yugabyte_schema_items | default([]) }}"
  loop_control:
    label: "{{ item.db }}"
  when:
    - not ansible_check_mode
    - yugabyte_schema_items | default([]) | length > 0
    - (not (yugabyte_schema_has_tables_by_db[item.db] | default(false))) or (item.reapply | default(false) | bool)

- name: Grant baseline schema ownership to application role
  community.postgresql.postgresql_query:
    login_host: 127.0.0.1
    login_port: "{{ yugabyte_ysql_port }}"
    login_user: "{{ yugabyte_superuser_role }}"
    login_password: "{{ yugabyte_superuser_password }}"
    login_db: "{{ item.db }}"
    query: |
      DO $frameworks_schema_ownership$
      DECLARE
        target_schema text := '{{ item.schema | default(item.db, true) }}';
        target_owner text := '{{ item.owner | default(item.db, true) }}';
        target_owner_oid oid;
        obj record;
      BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_namespace WHERE nspname = target_schema) THEN
          RETURN;
        END IF;

        SELECT oid INTO target_owner_oid FROM pg_roles WHERE rolname = target_owner;
        IF target_owner_oid IS NULL THEN
          RAISE EXCEPTION 'role % does not exist', target_owner;
        END IF;

        IF EXISTS (
          SELECT 1 FROM pg_namespace
          WHERE nspname = target_schema AND nspowner <> target_owner_oid
        ) THEN
          EXECUTE format('ALTER SCHEMA %I OWNER TO %I', target_schema, target_owner);
        END IF;

        FOR obj IN
          SELECT n.nspname, c.relname, c.relkind
          FROM pg_class c
          JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE n.nspname = target_schema
            AND c.relkind IN ('r', 'p', 'v', 'm', 'S', 'f')
            AND c.relowner <> target_owner_oid
            -- A sequence owned by a column (serial, identity) cannot change owner by itself; ALTER TABLE moves it.
            AND NOT (c.relkind = 'S' AND EXISTS (
              SELECT 1 FROM pg_depend d
              WHERE d.classid = 'pg_class'::regclass AND d.objid = c.oid
                AND d.refclassid = 'pg_class'::regclass AND d.deptype IN ('a', 'i')
            ))
        LOOP
          IF obj.relkind = 'S' THEN
            EXECUTE format('ALTER SEQUENCE %I.%I OWNER TO %I', obj.nspname, obj.relname, target_owner);
          ELSIF obj.relkind = 'v' THEN
            EXECUTE format('ALTER VIEW %I.%I OWNER TO %I', obj.nspname, obj.relname, target_owner);
          ELSIF obj.relkind = 'm' THEN
            EXECUTE format('ALTER MATERIALIZED VIEW %I.%I OWNER TO %I', obj.nspname, obj.relname, target_owner);
          ELSIF obj.relkind = 'f' THEN
            EXECUTE format('ALTER FOREIGN TABLE %I.%I OWNER TO %I', obj.nspname, obj.relname, target_owner);
          ELSE
            EXECUTE format('ALTER TABLE %I.%I OWNER TO %I', obj.nspname, obj.relname, target_owner);
          END IF;
        END LOOP;

        FOR obj IN
          SELECT n.nspname, p.proname, pg_get_function_identity_arguments(p.oid) AS args
          FROM pg_proc p
          JOIN pg_namespace n ON n.oid = p.pronamespace
          WHERE n.nspname = target_schema
            AND p.proowner <> target_owner_oid
            AND p.prokind = 'f'
        LOOP
          EXECUTE format('ALTER FUNCTION %I.%I(%s) OWNER TO %I', obj.nspname, obj.proname, obj.args, target_owner);
        END LOOP;

        FOR obj IN
          SELECT n.nspname, p.proname, pg_get_function_identity_arguments(p.oid) AS args
          FROM pg_proc p
          JOIN pg_namespace n ON n.oid = p.pronamespace
          WHERE n.nspname = target_schema
            AND p.proowner <> target_owner_oid
            AND p.prokind = 'p'
        LOOP
          EXECUTE format('ALTER PROCEDURE %I.%I(%s) OWNER TO %I', obj.nspname, obj.proname, obj.args, target_owner);
        END LOOP;

        EXECUTE format('GRANT USAGE, CREATE ON SCHEMA %I TO %I', target_schema, target_owner);
        EXECUTE format('GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA %I TO %I', target_schema, target_owner);
        EXECUTE format('GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA %I TO %I', target_schema, target_owner);
        EXECUTE format('GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA %I TO %I', target_schema, target_owner);
        EXECUTE format('ALTER DEFAULT PRIVILEGES IN SCHEMA %I GRANT ALL PRIVILEGES ON TABLES TO %I', target_schema, target_owner);
        EXECUTE format('ALTER DEFAULT PRIVILEGES IN SCHEMA %I GRANT ALL PRIVILEGES ON SEQUENCES TO %I', target_schema, target_owner);
        EXECUTE format('ALTER DEFAULT PRIVILEGES IN SCHEMA %I GRANT EXECUTE ON FUNCTIONS TO %I', target_schema, target_owner);
      END
      $frameworks_schema_ownership$;
  loop: "{{ yugabyte_schema_items | default([]) }}"
  loop_control:
    label: "{{ item.db }}"
  when:
    - not ansible_check_mode
    - yugabyte_schema_items | default([]) | length > 0

- name: Grant least-privilege runtime access to application schema
  community.postgresql.postgresql_query:
    login_host: 127.0.0.1
    login_port: "{{ yugabyte_ysql_port }}"
    login_user: "{{ yugabyte_superuser_role }}"
    login_password: "{{ yugabyte_superuser_password }}"
    login_db: "{{ item.db }}"
    query: |
      DO $frameworks_runtime_grants$
      DECLARE
        target_schema text := '{{ item.schema | default(item.db, true) }}';
        target_owner text := '{{ item.owner | default(item.db, true) }}';
        target_runtime text := '{{ item.runtime_role | default((item.owner | default(item.db, true)) ~ '_runtime') }}';
      BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_namespace WHERE nspname = target_schema) THEN
          RAISE EXCEPTION 'application schema % does not exist', target_schema;
        END IF;
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = target_runtime) THEN
          RAISE EXCEPTION 'runtime role % does not exist', target_runtime;
        END IF;
        EXECUTE format('GRANT CONNECT ON DATABASE %I TO %I', current_database(), target_runtime);
        EXECUTE format('GRANT USAGE ON SCHEMA %I TO %I', target_schema, target_runtime);
        EXECUTE format('REVOKE CREATE ON SCHEMA %I FROM %I', target_schema, target_runtime);
        EXECUTE format('GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA %I TO %I', target_schema, target_runtime);
        EXECUTE format('GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA %I TO %I', target_schema, target_runtime);
        EXECUTE format('GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA %I TO %I', target_schema, target_runtime);
        EXECUTE format(
          'ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA %I GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO %I',
          target_owner, target_schema, target_runtime);
        EXECUTE format(
          'ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA %I GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO %I',
          target_owner, target_schema, target_runtime);
        EXECUTE format('ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA %I GRANT EXECUTE ON FUNCTIONS TO %I', target_owner, target_schema, target_runtime);
      END
      $frameworks_runtime_grants$;
  loop: "{{ yugabyte_schema_items | default([]) }}"
  loop_control:
    label: "{{ item.db }}:{{ item.runtime_role | default((item.owner | default(item.db, true)) ~ '_runtime') }}"
  no_log: true
  when:
    - not ansible_check_mode
    - yugabyte_schema_items | default([]) | length > 0

- name: Remove baseline schema SQL files
  ansible.builtin.file:
    path: "/tmp/frameworks-schema-{{ item.db | regex_replace('[^A-Za-z0-9_.-]', '_') }}.sql"
    state: absent
  loop: "{{ yugabyte_schema_items | default([]) }}"
  loop_control:
    label: "{{ item.db }}"
  no_log: true
  when:
    - not ansible_check_mode
    - yugabyte_schema_items | default([]) | length > 0
    - (not (yugabyte_schema_has_tables_by_db[item.db] | default(false))) or (item.reapply | default(false) | bool)
