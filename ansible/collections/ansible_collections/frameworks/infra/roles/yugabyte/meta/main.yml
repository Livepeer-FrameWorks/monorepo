---
galaxy_info:
  role_name: yugabyte
  author: FrameWorks Infra
  description: >-
    Install and manage a YugabyteDB node (yb-master + yb-tserver). Artifacts
    and versions are supplied by the FrameWorks CLI from the release manifest;
    this role never picks its own version.
  license: AGPL-3.0-or-later
  min_ansible_version: "2.15"
  platforms:
    - name: Ubuntu
      versions: [jammy, noble]
    - name: Debian
      versions: [bookworm]
    - name: EL
      versions: ["9"]
  galaxy_tags:
    - database
    - yugabyte
    - distributed

dependencies: []

argument_specs:
  main:
    short_description: Install and run a YugabyteDB node.
    options:
      yugabyte_artifact_url:
        type: str
        required: true
        description: HTTPS URL of the pinned YugabyteDB tarball.
      yugabyte_artifact_checksum:
        type: str
        required: true
        description: "sha256 checksum prefix, e.g. 'sha256:abc123...'. Verified by get_url."
      yugabyte_version:
        type: str
        required: true
        description: Release version label (for logging/introspection).
      yugabyte_restart_scope:
        type: str
        required: false
        default: all
        choices: [all, master, tserver]
        description: Processes a restart touches; cluster upgrade restarts every master before any tserver.
      yugabyte_allow_engine_change:
        type: bool
        required: false
        default: false
        description: Allow changing the engine of a node that already joined the universe; set only by cluster upgrade.
      yugabyte_master_addresses:
        type: str
        required: false
        description: Comma-separated list of yb-master host:port entries.
      yugabyte_replication_factor:
        type: int
        required: false
        default: 3
      yugabyte_node_address:
        type: str
        required: false
      yugabyte_placement_zone:
        type: str
        required: false
      yugabyte_databases:
        type: list
        elements: dict
        required: false
        description: Databases created at init-tag time.
        options:
          name:
            type: str
            required: true
          owner:
            type: str
            required: false
          password:
            type: str
            required: false
            no_log: true
          runtime_role:
            type: str
            required: false
          runtime_password:
            type: str
            required: false
            no_log: true
          colocated:
            type: bool
            required: false
      yugabyte_database_placements:
        type: list
        elements: dict
        required: false
        description: Name, owner, and colocation of each database in yugabyte_databases, without credentials.
        options:
          name:
            type: str
            required: true
          owner:
            type: str
            required: true
          colocated:
            type: bool
            required: true
            description: Create the database WITH COLOCATION = true when it does not exist yet.
      yugabyte_application_password:
        type: str
        required: false
        no_log: true
        description: Password for the per-database owner role.
      yugabyte_runtime_password:
        type: str
        required: true
        no_log: true
        description: Independent password for restricted application runtime roles.
      yugabyte_superuser_password:
        type: str
        required: false
        no_log: true
        description: Optional password for the yugabyte superuser. Init uses local admin trust.
