---
# One `cluster migrate` run of the role over clickhouse_migrate_items. The role keeps the ledger it
# read and the apply results in facts, which persist across includes in one play, so each run starts
# from empty ones.
- name: Reset the role's migration facts
  ansible.builtin.set_fact:
    clickhouse_ledger_by_db: {}
    clickhouse_migrate_apply: {}

- name: Run the role's migrate tasks
  ansible.builtin.include_role:
    name: frameworks.infra.clickhouse
    tasks_from: migrate
