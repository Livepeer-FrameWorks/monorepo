---
- name: Ensure frameworks group
  ansible.builtin.group:
    name: "{{ helmsman_group }}"
    system: true

- name: Ensure frameworks user
  ansible.builtin.user:
    name: "{{ helmsman_user }}"
    group: "{{ helmsman_group }}"
    groups: "{{ helmsman_extra_groups | default(omit) }}"
    append: "{{ helmsman_extra_groups is defined and (helmsman_extra_groups | string | length) > 0 }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  notify: helmsman restart

- name: Ensure directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ helmsman_user }}"
    group: "{{ helmsman_group }}"
    mode: "0755"
  loop:
    - /etc/frameworks
    - "{{ helmsman_install_dir }}"

- name: Install unzip (zip archives only)
  ansible.builtin.package:
    name: unzip
    state: present
  when: helmsman_is_zip | bool
  # async kills a stalled apt fetch at the deadline; until re-runs it.
  register: helmsman_package_attempt
  until: helmsman_package_attempt is succeeded
  retries: 1
  delay: 10
  async: 600
  poll: 5

- name: Set install sentinel and binary receipt paths
  ansible.builtin.set_fact:
    helmsman_install_sentinel: "{{ helmsman_install_dir }}/.installed-{{ helmsman_artifact_checksum | default('') | hash('sha1') }}"
    helmsman_binary_receipt: "{{ helmsman_install_dir }}/.binary-sha256"

- name: Inspect Helmsman install sentinel
  ansible.builtin.stat:
    path: "{{ helmsman_install_sentinel }}"
  register: helmsman_sentinel_stat
  check_mode: false

# The receipt is the sha256 of the binary this role installed; a binary the
# component updater replaced no longer matches it.
- name: Compare installed Helmsman binary with its install receipt
  ansible.builtin.shell: |
    set -euo pipefail
    installed="$(sha256sum "{{ helmsman_install_dir }}/helmsman" | awk '{print $1}')"
    printf '%s\n' "$installed"
    test "$installed" = "$(cat "{{ helmsman_binary_receipt }}")"
  args:
    executable: /bin/bash
  register: helmsman_binary_receipt_check
  changed_when: false
  failed_when: false
  check_mode: false

# The sentinel names the pinned artifact, so the archive is fetched once per
# pin, or again only when the installed binary no longer matches its receipt.
- name: Decide whether Helmsman reinstall is required
  ansible.builtin.set_fact:
    helmsman_reinstall_required: >-
      {{
        not (helmsman_sentinel_stat.stat.exists | default(false))
        or (helmsman_binary_receipt_check.rc | default(1)) != 0
      }}

- name: Report Helmsman artifact drift in check mode
  ansible.builtin.debug:
    msg: "Helmsman would be installed from {{ helmsman_artifact_url }}"
  changed_when: helmsman_reinstall_required | bool
  when: ansible_check_mode

# The always section runs on every pass, so an asset an earlier run left
# behind is removed (and reported under --check) even when nothing installs.
- name: Install Helmsman artifact
  block:
    - name: Download and extract Helmsman artifact
      when:
        - not ansible_check_mode
        - helmsman_reinstall_required | bool
      block:
        - name: Remove stale Helmsman install sentinel before reinstall
          ansible.builtin.file:
            path: "{{ helmsman_install_sentinel }}"
            state: absent

        - name: Download Helmsman asset
          ansible.builtin.get_url:
            url: "{{ helmsman_artifact_url }}"
            dest: "/tmp/helmsman.asset"
            checksum: "{{ helmsman_artifact_checksum }}"
            mode: "0644"
            timeout: 300
            headers:
              Cache-Control: no-cache
          register: helmsman_download
          until: helmsman_download is succeeded
          retries: 4
          delay: 3

        - name: Extract Helmsman
          ansible.builtin.unarchive:
            src: "/tmp/helmsman.asset"
            dest: "{{ helmsman_install_dir }}"
            remote_src: true
            owner: "{{ helmsman_user }}"
            group: "{{ helmsman_group }}"
            creates: "{{ helmsman_install_sentinel }}"
          register: helmsman_extract_result
  always:
    - name: Remove downloaded Helmsman asset
      ansible.builtin.file:
        path: /tmp/helmsman.asset
        state: absent

# Release archives ship the binary under one of three names; normalize to
# "helmsman", record its receipt and mark the sentinel. The task reports a
# change, and restarts Helmsman, only when the binary differs from the one it
# replaced, so recording a receipt for an unchanged binary restarts nothing.
- name: Normalize extracted binary name
  ansible.builtin.shell: |
    set -eo pipefail
    previous={{ (helmsman_binary_receipt_check.stdout_lines | default([''], true) | first) | quote }}
    if ls "{{ helmsman_install_dir }}"/frameworks-helmsman-* >/dev/null 2>&1; then
      mv "{{ helmsman_install_dir }}"/frameworks-helmsman-* "{{ helmsman_install_dir }}/helmsman"
    elif [ -f "{{ helmsman_install_dir }}/frameworks" ]; then
      mv "{{ helmsman_install_dir }}/frameworks" "{{ helmsman_install_dir }}/helmsman"
    fi
    chmod 0755 "{{ helmsman_install_dir }}/helmsman"
    chown {{ helmsman_user }}:{{ helmsman_group }} "{{ helmsman_install_dir }}/helmsman"
    installed="$(sha256sum "{{ helmsman_install_dir }}/helmsman" | awk '{print $1}')"
    printf '%s\n' "$installed" > "{{ helmsman_binary_receipt }}"
    touch "{{ helmsman_install_sentinel }}"
    chown {{ helmsman_user }}:{{ helmsman_group }} "{{ helmsman_install_sentinel }}" "{{ helmsman_binary_receipt }}"
    if [ "$installed" != "$previous" ]; then echo binary-changed; fi
  args:
    creates: "{{ helmsman_install_sentinel }}"
    executable: /bin/bash
  register: helmsman_normalize
  changed_when: "'binary-changed' in helmsman_normalize.stdout"
  notify: helmsman restart
  when: not ansible_check_mode

# The component updater (helmsman itself) owns this file at runtime. Stamp
# only when this run actually installed the pinned artifact, or the key was
# never seeded — never regress a version the updater recorded.
- name: Check recorded Helmsman component version
  ansible.builtin.command:
    argv:
      - grep
      - -q
      - "^HELMSMAN_VERSION="
      - "{{ helmsman_component_versions_file }}"
  register: helmsman_version_recorded
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - helmsman_component_versions_file | length > 0

- name: Record Helmsman version for the component updater
  ansible.builtin.lineinfile:
    path: "{{ helmsman_component_versions_file }}"
    regexp: "^HELMSMAN_VERSION="
    line: "HELMSMAN_VERSION={{ helmsman_version }}"
    create: true
    owner: "{{ helmsman_user }}"
    group: "{{ helmsman_group }}"
    mode: "0644"
  when:
    - not ansible_check_mode
    - helmsman_component_versions_file | length > 0
    - helmsman_version | length > 0
    - (helmsman_extract_result is changed) or (helmsman_version_recorded.rc | default(1)) != 0
