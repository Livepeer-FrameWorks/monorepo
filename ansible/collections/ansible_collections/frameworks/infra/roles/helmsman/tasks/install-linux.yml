---
- name: Ensure frameworks group
  ansible.builtin.group:
    name: "{{ helmsman_group }}"
    system: true

- name: Ensure frameworks user
  ansible.builtin.user:
    name: "{{ helmsman_user }}"
    group: "{{ helmsman_group }}"
    groups: "{{ helmsman_extra_groups | default(omit) }}"
    append: "{{ helmsman_extra_groups is defined and (helmsman_extra_groups | string | length) > 0 }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  notify: helmsman restart

- name: Ensure directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ helmsman_user }}"
    group: "{{ helmsman_group }}"
    mode: "0755"
  loop:
    - /etc/frameworks
    - "{{ helmsman_install_dir }}"

- name: Install unzip (zip archives only)
  ansible.builtin.package:
    name: unzip
    state: present
  when: helmsman_is_zip | bool
  # async kills a stalled apt fetch at the deadline; until re-runs it.
  register: helmsman_package_attempt
  until: helmsman_package_attempt is succeeded
  retries: 1
  delay: 10
  async: 600
  poll: 5

- name: Set install sentinel path
  ansible.builtin.set_fact:
    helmsman_install_sentinel: "{{ helmsman_install_dir }}/.installed-{{ helmsman_artifact_checksum | default('') | hash('sha1') }}"

# Check mode never downloads; the sentinel names the pinned artifact, so a new
# pin shows up as the install it causes.
- name: Inspect Helmsman install sentinel
  ansible.builtin.stat:
    path: "{{ helmsman_install_sentinel }}"
  register: helmsman_sentinel_stat
  when: ansible_check_mode

- name: Report Helmsman artifact drift in check mode
  ansible.builtin.debug:
    msg: "Helmsman would be installed from {{ helmsman_artifact_url }}"
  changed_when: not (helmsman_sentinel_stat.stat.exists | default(false))
  when: ansible_check_mode

# Every apply downloads the pinned artifact to compare its binary with the
# installed one, which the component updater may have replaced. The always
# section runs on every pass, so an asset an earlier run left behind is removed
# (and reported under --check) too.
- name: Install Helmsman artifact
  block:
    - name: Download, verify and extract Helmsman artifact
      when: not ansible_check_mode
      block:
        - name: Download Helmsman asset
          ansible.builtin.get_url:
            url: "{{ helmsman_artifact_url }}"
            dest: "/tmp/helmsman.asset"
            checksum: "{{ helmsman_artifact_checksum }}"
            mode: "0644"
            timeout: 300
            headers:
              Cache-Control: no-cache
          register: helmsman_download
          until: helmsman_download is succeeded
          retries: 4
          delay: 3

        - name: Create Helmsman artifact verification directory
          ansible.builtin.tempfile:
            state: directory
            suffix: helmsman-verify
          register: helmsman_verify_dir

        - name: Extract Helmsman artifact for binary verification
          ansible.builtin.unarchive:
            src: "/tmp/helmsman.asset"
            dest: "{{ helmsman_verify_dir.path }}"
            remote_src: true

        - name: Read desired Helmsman binary checksum
          ansible.builtin.shell: |
            set -e
            desired_binary=""
            for candidate in \
              "{{ helmsman_verify_dir.path }}"/frameworks-helmsman-* \
              "{{ helmsman_verify_dir.path }}/frameworks" \
              "{{ helmsman_verify_dir.path }}/helmsman"; do
              if [ -f "$candidate" ]; then
                desired_binary="$candidate"
                break
              fi
            done
            if [ -z "$desired_binary" ]; then
              echo "missing helmsman binary in artifact" >&2
              exit 1
            fi
            sha256sum "$desired_binary"
          args:
            executable: /bin/sh
          register: helmsman_desired_binary_checksum
          changed_when: false

        - name: Read installed Helmsman binary checksum
          ansible.builtin.command:
            argv:
              - sha256sum
              - "{{ helmsman_install_dir }}/helmsman"
          register: helmsman_installed_binary_checksum
          changed_when: false
          failed_when: false

        - name: Remove stale Helmsman install sentinel when binary differs from artifact
          ansible.builtin.file:
            path: "{{ helmsman_install_sentinel }}"
            state: absent
          when:
            - helmsman_installed_binary_checksum.rc != 0
              or ((helmsman_installed_binary_checksum.stdout.split() | first) | default(''))
              != ((helmsman_desired_binary_checksum.stdout.split() | first) | default(''))

        - name: Extract Helmsman
          ansible.builtin.unarchive:
            src: "/tmp/helmsman.asset"
            dest: "{{ helmsman_install_dir }}"
            remote_src: true
            owner: "{{ helmsman_user }}"
            group: "{{ helmsman_group }}"
            creates: "{{ helmsman_install_sentinel }}"
          register: helmsman_extract_result
          notify: helmsman restart
  always:
    - name: Remove downloaded Helmsman asset
      ansible.builtin.file:
        path: /tmp/helmsman.asset
        state: absent

    - name: Remove Helmsman artifact verification directory
      ansible.builtin.file:
        path: "{{ helmsman_verify_dir.path }}"
        state: absent
      when: helmsman_verify_dir.path is defined

# Release archives ship the binary under one of three names; normalize to
# "helmsman" then mark the sentinel so this block is a true once-per-pin op.
- name: Normalize extracted binary name
  ansible.builtin.shell: |
    set -e
    if ls "{{ helmsman_install_dir }}"/frameworks-helmsman-* >/dev/null 2>&1; then
      mv "{{ helmsman_install_dir }}"/frameworks-helmsman-* "{{ helmsman_install_dir }}/helmsman"
    elif [ -f "{{ helmsman_install_dir }}/frameworks" ]; then
      mv "{{ helmsman_install_dir }}/frameworks" "{{ helmsman_install_dir }}/helmsman"
    fi
    chmod 0755 "{{ helmsman_install_dir }}/helmsman"
    chown {{ helmsman_user }}:{{ helmsman_group }} "{{ helmsman_install_dir }}/helmsman"
    touch "{{ helmsman_install_sentinel }}"
    chown {{ helmsman_user }}:{{ helmsman_group }} "{{ helmsman_install_sentinel }}"
  args:
    creates: "{{ helmsman_install_sentinel }}"
  when: not ansible_check_mode

# The component updater (helmsman itself) owns this file at runtime. Stamp
# only when this run actually installed the pinned artifact, or the key was
# never seeded — never regress a version the updater recorded.
- name: Check recorded Helmsman component version
  ansible.builtin.command:
    argv:
      - grep
      - -q
      - "^HELMSMAN_VERSION="
      - "{{ helmsman_component_versions_file }}"
  register: helmsman_version_recorded
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - helmsman_component_versions_file | length > 0

- name: Record Helmsman version for the component updater
  ansible.builtin.lineinfile:
    path: "{{ helmsman_component_versions_file }}"
    regexp: "^HELMSMAN_VERSION="
    line: "HELMSMAN_VERSION={{ helmsman_version }}"
    create: true
    owner: "{{ helmsman_user }}"
    group: "{{ helmsman_group }}"
    mode: "0644"
  when:
    - not ansible_check_mode
    - helmsman_component_versions_file | length > 0
    - helmsman_version | length > 0
    - (helmsman_extract_result is changed) or (helmsman_version_recorded.rc | default(1)) != 0
