---
- name: Resolve Helmsman trigger WAL directory
  ansible.builtin.set_fact:
    helmsman_effective_trigger_wal_dir: >-
      {{
        helmsman_trigger_wal_dir
        if helmsman_trigger_wal_dir | default('', true) | length > 0
        else (
          (helmsman_darwin_conf_dir | default(helmsman_darwin_system_conf_dir)) ~ '/helmsman/trigger-wal'
          if ansible_facts.os_family == 'Darwin'
          else helmsman_state_dir ~ '/trigger-wal'
        )
      }}

- name: Build helmsman env map
  ansible.builtin.set_fact:
    helmsman_env_full: >-
      {{ {
        'NODE_ID': helmsman_node_id,
        'EDGE_PUBLIC_URL': 'https://' ~ helmsman_edge_domain ~ '/view',
        'EDGE_DOMAIN': helmsman_edge_domain,
        'FOGHORN_CONTROL_ADDR': helmsman_foghorn_grpc_addr,
        'ACME_EMAIL': helmsman_acme_email | default('', true),
        'DEPLOY_MODE': helmsman_deploy_mode,
        'MISTSERVER_URL': 'http://' ~ helmsman_mist_api_upstream,
        'MISTSERVER_HTTP_URL': 'http://' ~ helmsman_mist_http_upstream,
        'HELMSMAN_WEBHOOK_URL': 'http://' ~ helmsman_webhook_upstream,
        'FRAMEWORKS_TRIGGER_WAL_DIR': helmsman_effective_trigger_wal_dir,
        'HELMSMAN_STATE_DIR': helmsman_state_dir,
        'HELMSMAN_ROTATE_NODE_IDENTITY': helmsman_rotate_node_identity | bool | ternary('true', 'false'),
        'HELMSMAN_ENROLLMENT_TOKEN_FILE': (
          (helmsman_darwin_conf_dir ~ '/helmsman-enroll.env')
          if ansible_facts.os_family == 'Darwin'
          else helmsman_enroll_env_file
        ),
        'HELMSMAN_RUNTIME_ENV_FILE': (helmsman_darwin_conf_dir ~ '/helmsman.env') if ansible_facts.os_family == 'Darwin' else helmsman_env_file,
        'CADDY_ADMIN_URL': helmsman_caddy_admin_url,
        'CADDY_CONFIG_PATH': helmsman_caddy_config_path,
        'HELMSMAN_BIND_ADDR': helmsman_bind_addr,
        'MIST_API_USERNAME': helmsman_mist_api_user,
        'MIST_API_PASSWORD': helmsman_mist_api_password,
        }
        | combine({'GRPC_TLS_CA_PATH': helmsman_grpc_tls_ca_path}
                  if helmsman_grpc_tls_ca_path | length > 0 else {})
        | combine(helmsman_extra_env | default({}, true))
      }}

# EDGE_PUBLIC_URL is built from helmsman_edge_domain and is never blank, so
# the required-env check below cannot catch a missing domain.
- name: Assert edge domain is a DNS name or IPv4 address
  ansible.builtin.assert:
    that:
      - helmsman_edge_domain | default('', true) | trim is match('^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)*$')
    fail_msg: "helmsman_edge_domain {{ helmsman_edge_domain | default('', true) | to_json }} must be a DNS name or IPv4 address"
    quiet: true

# Helmsman treats a blank value as unset, so a blank required key would only
# surface as a startup failure after the env file and unit are in place.
- name: Assert Helmsman required env list is present
  ansible.builtin.assert:
    that:
      - helmsman_required_env | length > 0
    fail_msg: helmsman_required_env is empty; the Helmsman env contract cannot be checked
    quiet: true

- name: Assert Helmsman required env is set
  ansible.builtin.assert:
    that:
      - (helmsman_env_full[item] | default('', true) | string | trim | length) > 0
    fail_msg: "Helmsman requires {{ item }} to be non-empty in its environment"
    quiet: true
  loop: "{{ helmsman_required_env }}"

- name: Helmsman | configure (linux)
  ansible.builtin.import_tasks: configure-linux.yml
  when: ansible_facts.os_family != 'Darwin'

- name: Helmsman | configure (darwin)
  ansible.builtin.import_tasks: configure-darwin.yml
  when: ansible_facts.os_family == 'Darwin'
