---
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Skip verify when converge short-circuited
      ansible.builtin.meta: end_play
      when: helmsman_artifact_url | length == 0

    - name: Find Helmsman install sentinels
      ansible.builtin.find:
        paths: /opt/frameworks/helmsman
        hidden: true
        patterns: ".installed-*"
      register: helmsman_sentinels

    - name: Assert only the current pin's sentinel remains
      ansible.builtin.assert:
        that:
          - helmsman_sentinels.files | length == 1
          - (helmsman_sentinels.files | first).path is not search('0000000000')
        fail_msg: "install sentinels left: {{ helmsman_sentinels.files | map(attribute='path') | list }}"

    - name: Refresh service facts
      ansible.builtin.service_facts:

    - name: Assert frameworks-helmsman running
      ansible.builtin.assert:
        that: ansible_facts.services['frameworks-helmsman.service'].state == 'running'

    - name: Wait for Helmsman port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ helmsman_port }}"
        timeout: 30

    - name: Rerun role (idempotence)
      ansible.builtin.include_role:
        name: frameworks.infra.helmsman
      register: idem

    - name: Fail if second apply changed anything
      ansible.builtin.assert:
        that: idem is not changed
        fail_msg: "helmsman role not idempotent"
