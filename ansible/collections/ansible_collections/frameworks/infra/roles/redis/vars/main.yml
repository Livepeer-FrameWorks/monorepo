---
redis_instance_suffix: >-
  {{ redis_instance if redis_role != 'sentinel' else redis_instance ~ '-sentinel' }}
redis_service_name: >-
  {{ 'redis-server' if redis_instance == '' else 'frameworks-redis-' ~ redis_instance_suffix }}
redis_named_instance: "{{ redis_instance | length > 0 }}"
redis_data_dir: >-
  {{ '/var/lib/redis' if redis_instance == '' else '/var/lib/frameworks/redis/' ~ redis_instance_suffix }}
# Declared settings, rendered from the manifest on every run (root-owned).
redis_config_path: >-
  {{ '/etc/redis.conf' if redis_instance == '' else '/etc/frameworks/redis/' ~ redis_instance_suffix ~ '.conf' }}
# File the named process runs from. It lives in the runtime-owned data dir so
# CONFIG REWRITE (issued by Sentinel on every promotion/reconfiguration) can
# persist the live replication role and Sentinel state across restarts.
redis_runtime_config_path: >-
  {{
    redis_config_path if redis_instance == '' else
    redis_data_dir ~ '/sentinel.conf' if redis_role == 'sentinel' else
    redis_data_dir ~ '/runtime.conf'
  }}
redis_local_host: >-
  {{
    '127.0.0.1' if '127.0.0.1' in redis_bind_interface.split() else
    '::1' if '::1' in redis_bind_interface.split() else
    redis_bind_interface.split() | first
  }}
redis_log_dir: >-
  {{ '/var/log/redis' if redis_instance == '' else '/var/log/frameworks/redis' }}
redis_log_file: >-
  {{ '/var/log/redis/redis-server.log' if redis_instance == '' else redis_log_dir ~ '/' ~ redis_instance_suffix ~ '.log' }}
