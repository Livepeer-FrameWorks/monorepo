---
# geerlingguy.redis installs redis_package (redis-server unless overridden) with
# apt and no deadline. Installing it here first makes that task a no-op.
- name: Install the Redis package geerlingguy.redis installs
  ansible.builtin.apt:
    name: "{{ redis_package | default('redis-server') }}"
    state: present
  when:
    - not (redis_named_instance | bool)
    - ansible_facts.os_family == 'Debian'
  # async kills a stalled apt fetch at the deadline; until re-runs it.
  register: redis_package_attempt
  until: redis_package_attempt is succeeded
  retries: 1
  delay: 10
  async: 600
  poll: 5

- name: Install and configure default Redis via geerlingguy.redis
  ansible.builtin.include_role:
    name: geerlingguy.redis
    apply:
      tags: [install, configure, service]
  vars:
    redis_requirepass: "{{ redis_password }}"
  when: not (redis_named_instance | bool)

- name: Select Redis package for named instance
  ansible.builtin.set_fact:
    redis_package_name: redis
  when: redis_named_instance | bool

- name: Select Debian Redis package for named instance
  ansible.builtin.set_fact:
    redis_package_name: redis-server
  when:
    - redis_named_instance | bool
    - ansible_facts.os_family == 'Debian'

- name: Select Valkey package for named instance
  ansible.builtin.set_fact:
    redis_package_name: valkey
  when:
    - redis_named_instance | bool
    - redis_engine == 'valkey'

- name: Select Debian Valkey package for named instance
  ansible.builtin.set_fact:
    redis_package_name: valkey-server
  when:
    - redis_named_instance | bool
    - redis_engine == 'valkey'
    - ansible_facts.os_family == 'Debian'

- name: Install Redis package for named instance
  ansible.builtin.package:
    name: "{{ redis_package_name }}"
    state: present
  when: redis_named_instance | bool
  # async kills a stalled apt fetch at the deadline; until re-runs it.
  register: redis_package_attempt
  until: redis_package_attempt is succeeded
  retries: 1
  delay: 10
  async: 600
  poll: 5

- name: Stop default Redis services for named instance
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - redis.service
    - redis-server.service
    - valkey.service
    - valkey-server.service
  failed_when: false
  when:
    - not ansible_check_mode
    - redis_named_instance | bool

- name: Discover Redis server binary for named instance
  ansible.builtin.shell: |
    set -e
    command -v valkey-server || command -v redis-server
  args:
    executable: /bin/sh
  register: redis_server_binary
  changed_when: false
  check_mode: false
  when:
    - not ansible_check_mode
    - redis_named_instance | bool

- name: Select Redis server binary for named instance under --check
  ansible.builtin.set_fact:
    redis_server_binary:
      stdout: "{{ '/usr/bin/valkey-server' if redis_engine == 'valkey' else '/usr/bin/redis-server' }}"
  when:
    - ansible_check_mode
    - redis_named_instance | bool

- name: Discover Redis runtime user for named instance
  ansible.builtin.shell: |
    set -e
    for user in valkey redis; do
      if getent passwd "$user" >/dev/null; then
        echo "$user"
        exit 0
      fi
    done
    echo root
  args:
    executable: /bin/sh
  register: redis_runtime_user_result
  changed_when: false
  check_mode: false
  when:
    - redis_named_instance | bool

- name: Set Redis runtime identity for named instance
  ansible.builtin.set_fact:
    redis_runtime_user: "{{ redis_runtime_user_result.stdout }}"
    redis_runtime_group: "{{ redis_runtime_user_result.stdout }}"
  when: redis_named_instance | bool

- name: Ensure named Redis directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ omit if ansible_check_mode else item.owner | default(redis_runtime_user) }}"
    group: "{{ omit if ansible_check_mode else item.group | default(redis_runtime_group) }}"
    mode: "{{ item.mode }}"
  loop:
    - path: /etc/frameworks
      owner: root
      group: root
      mode: "0755"
    - path: /etc/frameworks/redis
      owner: root
      group: root
      mode: "0755"
    - path: /var/lib/frameworks
      owner: root
      group: root
      mode: "0755"
    - path: /var/lib/frameworks/redis
      owner: root
      group: root
      mode: "0755"
    - path: "{{ redis_data_dir }}"
      mode: "0750"
  when:
    - redis_named_instance | bool

- name: Render named Redis declared config
  ansible.builtin.template:
    src: "{{ 'sentinel.conf.j2' if redis_role == 'sentinel' else 'instance.conf.j2' }}"
    dest: "{{ redis_config_path }}"
    owner: "{{ omit if ansible_check_mode else 'root' }}"
    group: "{{ omit if ansible_check_mode else redis_runtime_group }}"
    mode: "0640"
  vars:
    redis_sentinel_declared_only: true
    redis_sentinel_monitor_host: "{{ redis_primary_host }}"
    redis_sentinel_monitor_port: "{{ redis_primary_port }}"
    redis_sentinel_state_lines: []
  register: redis_named_config
  when:
    - redis_named_instance | bool

- name: Inspect named Redis runtime config
  ansible.builtin.stat:
    path: "{{ redis_runtime_config_path }}"
  register: redis_runtime_config_stat
  when:
    - redis_named_instance | bool

# The runtime config is (re)written only on first install or when the declared
# settings change. Its replication role / monitored primary comes from the live
# process first, then from what Sentinel last persisted, and from the manifest
# only when neither exists, so a re-run after a failover never demotes the
# current primary or re-points Sentinel at a stale one.
- name: Resolve live Redis replication state
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      cli="$(command -v valkey-cli || command -v redis-cli || true)"
      runtime='{{ redis_runtime_config_path }}'
      {% if redis_role == 'sentinel' %}
      name='{{ redis_master_name }}'
      if [ -n "$cli" ] && systemctl is-active --quiet '{{ redis_service_name }}'; then
        addr="$("$cli" -h '{{ redis_local_host }}' -p '{{ redis_sentinel_port }}' \
          SENTINEL get-master-addr-by-name "$name" 2>/dev/null | tr -d '\r' | paste -sd' ' - || true)"
        if printf '%s\n' "$addr" | grep -Eq '^[^ ]+ [0-9]+$'; then
          echo "source=live"
          echo "monitor=$addr"
        fi
      fi
      if [ -f "$runtime" ]; then
        awk -v name="$name" '
          $1 == "sentinel" && $2 == "monitor" && $3 == name { print "persisted=" $4 " " $5 }
          $1 == "sentinel" && ($2 == "myid" || $2 == "current-epoch") { print "state=" $0 }
          $1 == "sentinel" && $3 == name && ($2 == "config-epoch" || $2 == "leader-epoch") { print "state=" $0 }
          $1 == "sentinel" && $3 == name && ($2 == "known-replica" || $2 == "known-sentinel") { print "state=" $0 }
        ' "$runtime" | tr -d '"'
      fi
      {% else %}
      if [ -n "$cli" ] && systemctl is-active --quiet '{{ redis_service_name }}'; then
        info="$("$cli" -h '{{ redis_local_host }}' -p '{{ redis_port }}' INFO replication 2>/dev/null | tr -d '\r' || true)"
        role="$(printf '%s\n' "$info" | awk -F: '$1 == "role" { print $2 }')"
        if [ "$role" = "master" ]; then
          echo "source=live"
          echo "replicaof="
          exit 0
        fi
        if [ "$role" = "slave" ]; then
          host="$(printf '%s\n' "$info" | awk -F: '$1 == "master_host" { print $2 }')"
          port="$(printf '%s\n' "$info" | awk -F: '$1 == "master_port" { print $2 }')"
          echo "source=live"
          echo "replicaof=$host $port"
          exit 0
        fi
      fi
      if [ -f "$runtime" ]; then
        echo "source=persisted"
        echo "replicaof=$(awk '$1 == "replicaof" || $1 == "slaveof" { line = $2 " " $3 } END { print line }' "$runtime" | tr -d '"')"
      fi
      {% endif %}
    executable: /bin/bash
  environment: "{{ {'REDISCLI_AUTH': redis_password} if redis_password | length > 0 else {} }}"
  register: redis_replication_state
  changed_when: false
  check_mode: false
  when:
    - redis_named_instance | bool
    - redis_named_config.changed or not redis_runtime_config_stat.stat.exists

- name: Select Redis runtime replication role
  ansible.builtin.set_fact:
    redis_runtime_replicaof: >-
      {{ (redis_observed_replicaof | first | regex_replace('^replicaof=', '') | trim)
         if redis_observed_replicaof | length > 0 else redis_declared_replicaof }}
  vars:
    redis_observed_replicaof: "{{ redis_replication_state.stdout_lines | select('match', '^replicaof=') | list }}"
    redis_declared_replicaof: >-
      {{ (redis_primary_host ~ ' ' ~ redis_primary_port)
         if redis_role == 'replica' and redis_primary_host | length > 0 else '' }}
  when:
    - redis_named_instance | bool
    - redis_role != 'sentinel'
    - redis_replication_state is not skipped

- name: Select Sentinel runtime monitor and state
  ansible.builtin.set_fact:
    redis_sentinel_runtime_monitor: >-
      {{ (redis_sentinel_observed | first | regex_replace('^(monitor|persisted)=', '') | trim)
         if redis_sentinel_observed | length > 0 else (redis_primary_host ~ ' ' ~ redis_primary_port) }}
    redis_sentinel_runtime_state_lines: >-
      {{ redis_replication_state.stdout_lines | select('match', '^state=') | map('regex_replace', '^state=', '') | list }}
  vars:
    # Live answer first, then the monitor line Sentinel last persisted.
    redis_sentinel_observed: >-
      {{ (redis_replication_state.stdout_lines | select('match', '^monitor=') | list)
         + (redis_replication_state.stdout_lines | select('match', '^persisted=') | list) }}
  when:
    - redis_named_instance | bool
    - redis_role == 'sentinel'
    - redis_replication_state is not skipped

- name: Write named Redis runtime config
  ansible.builtin.template:
    src: "{{ 'sentinel.conf.j2' if redis_role == 'sentinel' else 'runtime.conf.j2' }}"
    dest: "{{ redis_runtime_config_path }}"
    owner: "{{ omit if ansible_check_mode else redis_runtime_user }}"
    group: "{{ omit if ansible_check_mode else redis_runtime_group }}"
    mode: "0640"
  vars:
    redis_sentinel_monitor_host: "{{ (redis_sentinel_runtime_monitor | default('')).split() | first | default(redis_primary_host) }}"
    redis_sentinel_monitor_port: "{{ (redis_sentinel_runtime_monitor | default('')).split() | last | default(redis_primary_port) }}"
    redis_sentinel_state_lines: "{{ redis_sentinel_runtime_state_lines | default([]) }}"
  register: redis_runtime_config
  when:
    - redis_named_instance | bool
    - redis_replication_state is not skipped

- name: Render named Redis systemd unit
  ansible.builtin.template:
    src: instance.service.j2
    dest: "/etc/systemd/system/{{ redis_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  register: redis_named_unit
  when:
    - redis_named_instance | bool

- name: Verify named Redis bind addresses exist
  ansible.builtin.shell: |
    set -euo pipefail
    configured_addresses="$(ip -o addr show | awk '{print $4}' | cut -d/ -f1)"
    for addr in {{ redis_bind_interface }}; do
      case "$addr" in
        0.0.0.0|::|127.0.0.1|::1|localhost)
          continue
          ;;
      esac
      if ! printf '%s\n' "$configured_addresses" | grep -Fxq "$addr"; then
        echo "$addr"
        exit 1
      fi
    done
  args:
    executable: /bin/bash
  register: redis_bind_address_check
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - redis_named_instance | bool

- name: Fail when named Redis bind address is absent
  ansible.builtin.fail:
    msg: >-
      Redis instance {{ redis_instance }} ({{ redis_role }}) is configured to bind
      {{ redis_bind_address_check.stdout }}, but that address is not present on this host.
      Configured bind addresses: {{ redis_bind_interface }}.
  when:
    - not ansible_check_mode
    - redis_named_instance | bool
    - redis_bind_address_check.rc != 0

- name: Verify Redis runtime can access named paths
  ansible.builtin.shell: |
    set -euo pipefail
    test -r "{{ redis_config_path }}"
    test -r "{{ redis_runtime_config_path }}"
    test -w "{{ redis_runtime_config_path }}"
    test -d "{{ redis_data_dir }}"
    test -w "{{ redis_data_dir }}"
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ redis_runtime_user }}"
  register: redis_runtime_access_check
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - redis_named_instance | bool

- name: Fail when Redis runtime cannot access named paths
  ansible.builtin.fail:
    msg: >-
      Redis runtime user {{ redis_runtime_user }} cannot access the named instance paths.
      config={{ redis_config_path }}, runtime={{ redis_runtime_config_path }},
      data={{ redis_data_dir }}.
      Check output: {{ redis_runtime_access_check.stderr | default(redis_runtime_access_check.stdout) | default('permission check failed') }}
  when:
    - not ansible_check_mode
    - redis_named_instance | bool
    - redis_runtime_access_check.rc != 0

- name: Check named Redis port owner
  ansible.builtin.shell: |
    set -euo pipefail
    if systemctl is-active --quiet "{{ redis_service_name }}"; then
      exit 0
    fi
    if ss -ltn "sport = :{{ (redis_sentinel_port if redis_role == 'sentinel' else redis_port) }}" | grep -q LISTEN; then
      ss -ltnp "sport = :{{ (redis_sentinel_port if redis_role == 'sentinel' else redis_port) }}" || true
      exit 1
    fi
  args:
    executable: /bin/bash
  register: redis_named_port_check
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - redis_named_instance | bool

- name: Fail when named Redis port is already owned
  ansible.builtin.fail:
    msg: >-
      Redis instance {{ redis_instance }} ({{ redis_role }}) cannot bind
      {{ redis_bind_interface }}:{{ (redis_sentinel_port if redis_role == 'sentinel' else redis_port) }};
      another service is already listening. Existing listener:
      {{ redis_named_port_check.stdout | default('unknown') }}
  when:
    - not ansible_check_mode
    - redis_named_instance | bool
    - redis_named_port_check.rc != 0

- name: Reload systemd for named Redis unit
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - not ansible_check_mode
    - redis_named_instance | bool
    - redis_named_unit.changed

- name: Start named Redis service
  when:
    - not ansible_check_mode
    - redis_named_instance | bool
  block:
    - name: Ensure named Redis is enabled and running
      ansible.builtin.systemd:
        name: "{{ redis_service_name }}"
        enabled: true
        state: >-
          {{ 'restarted' if (redis_named_config.changed or redis_named_unit.changed or (redis_runtime_config.changed | default(false)))
             else 'started' }}
  rescue:
    - name: Capture named Redis systemctl status after failed start
      ansible.builtin.command: "systemctl status {{ redis_service_name }} --no-pager -l"
      register: redis_systemctl_status
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Capture named Redis journal after failed start
      ansible.builtin.command: "journalctl -u {{ redis_service_name }} --no-pager -n 120"
      register: redis_journal
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Fail with named Redis startup diagnostics
      ansible.builtin.fail:
        msg: |-
          {{ redis_service_name }} failed to start
          systemctl status:
          {{ redis_systemctl_status.stdout | default('(no systemctl output)') }}

          journalctl:
          {{ redis_journal.stdout | default('(no journal output)') }}

# Runs after the restart above, so the process no longer holds the file open
# and its space is freed.
- name: Remove unrotated named Redis log file
  ansible.builtin.file:
    path: "{{ redis_named_log_file }}"
    state: absent
  when:
    - redis_named_instance | bool

- name: Inspect the named Redis log directory
  ansible.builtin.stat:
    path: "{{ redis_named_log_dir }}"
  register: redis_named_log_dir_stat
  when:
    - redis_named_instance | bool

- name: Find files left in the named Redis log directory
  ansible.builtin.find:
    paths: "{{ redis_named_log_dir }}"
    file_type: any
    hidden: true
  register: redis_named_log_dir_files
  when:
    - redis_named_instance | bool
    - redis_named_log_dir_stat.stat.isdir | default(false)

- name: Remove empty named Redis log directory
  ansible.builtin.file:
    path: "{{ redis_named_log_dir }}"
    state: absent
  when:
    - redis_named_instance | bool
    - redis_named_log_dir_stat.stat.isdir | default(false)
    - redis_named_log_dir_files.matched == 0
