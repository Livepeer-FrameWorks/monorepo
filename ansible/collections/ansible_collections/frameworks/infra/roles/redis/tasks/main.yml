---
- name: Redis | kernel memory policy
  ansible.builtin.import_tasks: sysctl.yml
  when: redis_role != "sentinel"
  tags: [configure]

- name: Redis | install + configure + service (via geerlingguy.redis)
  ansible.builtin.import_tasks: install.yml
  tags: [install, configure, service]

- name: Redis | exporter
  ansible.builtin.import_tasks: exporter.yml
  tags: [install, configure, service]
  when: redis_exporter_enabled | bool

- name: Redis | flush handlers before validate
  ansible.builtin.meta: flush_handlers
  tags: [service, validate]

- name: Redis | validate
  ansible.builtin.import_tasks: validate.yml
  tags: [validate]

- name: Redis | restart
  ansible.builtin.import_tasks: restart.yml
  tags: [restart, never]

- name: Redis | cleanup
  ansible.builtin.import_tasks: cleanup.yml
  tags: [cleanup, never]
