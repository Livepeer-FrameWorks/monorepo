---
- name: Stop and disable redis
  ansible.builtin.systemd:
    name: "{{ redis_service_name }}"
    state: stopped
    enabled: false
  failed_when: false

- name: Stop and disable redis exporter
  ansible.builtin.systemd:
    name: "{{ redis_exporter_service_name }}"
    state: stopped
    enabled: false
  failed_when: false

- name: Remove redis exporter unit and environment
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/etc/systemd/system/{{ redis_exporter_service_name }}.service"
    - "{{ redis_exporter_env_path }}"

- name: Remove named Redis systemd unit
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ redis_service_name }}.service"
    state: absent
  when: redis_named_instance | bool

- name: Remove named Redis config
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ redis_config_path }}"
    - "{{ redis_runtime_config_path }}"
  when: redis_named_instance | bool

- name: Reload systemd after named Redis cleanup
  ansible.builtin.systemd:
    daemon_reload: true
  when: redis_named_instance | bool

- name: Redis | release memory overcommit once no server remains
  ansible.builtin.script:
    cmd: redis-release-overcommit.sh
  register: redis_overcommit_release
  changed_when: (redis_overcommit_release.stdout | default('') | trim) == 'removed'
