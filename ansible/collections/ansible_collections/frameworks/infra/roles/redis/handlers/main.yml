---
- name: Restart redis
  listen: redis restart
  ansible.builtin.systemd:
    name: "{{ redis_service_name }}"
    state: restarted
  register: redis_restarted

- name: Restart redis exporter
  listen: redis exporter restart
  ansible.builtin.systemd:
    name: "{{ redis_exporter_service_name }}"
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode

- name: Reload redis
  listen: redis reload
  ansible.builtin.systemd:
    name: "{{ redis_service_name }}"
    state: reloaded
  when: redis_restarted is not defined
