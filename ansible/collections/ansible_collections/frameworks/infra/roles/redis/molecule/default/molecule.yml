---
role_name_check: 1
prerun: false

dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: redis-instance
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    privileged: true
    command: /usr/sbin/init
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    dns_servers:
      - "1.1.1.1"
      - "8.8.8.8"
    tmpfs:
      - /run
      - /tmp

provisioner:
  name: ansible
  playbooks:
    prepare: ../../../../molecule/prepare-apt.yml
  inventory:
    group_vars:
      all:
        redis_version: "7.2"
        redis_port: 6379
        redis_bind_interface: "127.0.0.1"
        redis_password: "molecule-test"
        # Named Sentinel HA set on one host: a declared primary, a declared
        # replica and a single Sentinel. The shared vars below mirror what the
        # CLI passes for each task of a sentinel-mode manifest instance.
        redis_engine: redis
        redis_primary_host: "127.0.0.1"
        redis_primary_port: 6390
        redis_master_name: molecule-ha
        redis_sentinel_port: 26390
        redis_sentinel_quorum: 1
        redis_molecule_ha_instances:
          - { instance: ha-a, role: primary, port: 6390 }
          - { instance: ha-b, role: replica, port: 6391 }
          - { instance: ha-a, role: sentinel }

verifier:
  name: ansible
