---
- name: Verify the local listener moved to loopback
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Read nginx listening sockets
      ansible.builtin.command: ss -Hltn sport = :18090
      register: nginx_verify_sockets
      changed_when: false

    - name: Assert nginx listens on loopback only
      ansible.builtin.assert:
        that:
          - "'127.0.0.1:18090' in nginx_verify_sockets.stdout"
          - "'0.0.0.0:18090' not in nginx_verify_sockets.stdout"
          - "'*:18090' not in nginx_verify_sockets.stdout"
        fail_msg: "nginx still listens on {{ nginx_verify_sockets.stdout }}"

    - name: Request WHIP and Matroska publish paths
      ansible.builtin.uri:
        url: "http://127.0.0.1:18090{{ item }}"
        status_code: [200, 204, 301, 308, 404, 502]
      loop:
        - /whip/sk_molecule_key
        - /sk_molecule_key.mkv
        - /view/sk_molecule_key.webm
        - /sk_molecule_key%2Emkv
        - /view/sk_molecule_key%2Ewebm
        - /%77ebrtc/sk_molecule_key
        - /webrtc%2Fsk_molecule_key

    - name: Read the access log
      ansible.builtin.slurp:
        src: /var/log/nginx/access.log
      register: nginx_verify_access_log

    - name: Assert the access log redacts the stream keys
      vars:
        nginx_verify_access: "{{ nginx_verify_access_log.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'GET /whip/REDACTED ' in nginx_verify_access"
          - "'GET /REDACTED.mkv ' in nginx_verify_access"
          - "'GET /view/REDACTED.webm ' in nginx_verify_access"
          - "'GET /REDACTED%2Emkv ' in nginx_verify_access"
          - "'GET /view/REDACTED%2Ewebm ' in nginx_verify_access"
          - "'GET /%77ebrtc/REDACTED ' in nginx_verify_access"
          - "'GET /webrtc%2FREDACTED ' in nginx_verify_access"
          - "'sk_molecule_key' not in nginx_verify_access"
        fail_msg: "access log carries a stream key: {{ nginx_verify_access }}"

    # The release precheck runs the role under --check; it must see a
    # configured listener without a socket.
    - name: Stop nginx so its configured listener has no socket
      ansible.builtin.systemd:
        name: nginx
        state: stopped

- name: Check the role under --check on a host whose listener is gone
  hosts: all
  become: true
  gather_facts: true
  check_mode: true
  tasks:
    - name: Run the nginx configure tasks in check mode
      ansible.builtin.include_role:
        name: frameworks.infra.nginx
        tasks_from: configure

- name: Assert check mode reported the listener drift
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Assert the drift check reported the missing listener
      ansible.builtin.assert:
        that:
          - nginx_listen_drift is changed
          - "'missing 127.0.0.1:18090' in nginx_listen_drift.stdout"
        fail_msg: "check mode did not report the missing listener: {{ nginx_listen_drift }}"

    - name: Start nginx again
      ansible.builtin.systemd:
        name: nginx
        state: started

- name: Verify automatic tenant TLS serving as the real Nginx worker
  ansible.builtin.import_playbook: tenant_alias_tls.yml

- name: Verify service validation during reload and failure
  ansible.builtin.import_playbook: validate_reload.yml
