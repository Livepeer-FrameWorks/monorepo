---
- name: Converge
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Create the certificate courier identity for hosted ingress
      ansible.builtin.user:
        name: privateer
        system: true
        create_home: false
        shell: /usr/sbin/nologin

    # Edge imports its install tasks with these tags. They must not activate
    # the role's explicit restart, stop or cleanup operations.
    - name: Apply frameworks.infra.compose_stack with inherited deployment tags
      ansible.builtin.import_role:
        name: frameworks.infra.compose_stack
      tags: [install, configure, service, validate]
