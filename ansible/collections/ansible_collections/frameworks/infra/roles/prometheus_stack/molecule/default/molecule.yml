---
role_name_check: 1
prerun: false
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: prometheus-instance
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    privileged: true
    command: /usr/sbin/init
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    dns_servers:
      - "1.1.1.1"
      - "8.8.8.8"
    tmpfs:
      - /run
      - /tmp
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        # Single-node scenario: prometheus + node_exporter only. VM binaries
        # are artifact-pinned and exercised in the production path; the
        # node_exporter pin mirrors config/infrastructure.yaml.
        prometheus_stack_components: [prometheus, node_exporter]
        prometheus_version: "2.54.1"
        node_exporter_version: "1.12.1"
        node_exporter_artifact_url: "https://github.com/prometheus/node_exporter/releases/download/v1.12.1/node_exporter-1.12.1.linux-amd64.tar.gz"
        node_exporter_artifact_checksum: "sha256:b51d8a76aa2a9156a55d501aca6276fae09e262259a5e4e831d2c2222f084e63"
verifier:
  name: ansible
