---
# Caddy installs from the .deb attached to the upstream GitHub release, verified
# against that release's SHA-512 checksums file. The package is the same
# goreleaser build the Cloudsmith apt repo serves, so hosts that installed it
# from Cloudsmith already hold the same package version.
- name: Resolve Caddy package architecture
  ansible.builtin.set_fact:
    caddy_deb_arch: "{{ caddy_deb_arch_map[ansible_facts.architecture] | default('') }}"

- name: Assert Caddy package architecture is supported
  ansible.builtin.assert:
    that: caddy_deb_arch | length > 0
    fail_msg: "No Caddy .deb is published for architecture {{ ansible_facts.architecture }}"

- name: Ensure Caddy package cache directory
  ansible.builtin.file:
    path: "{{ caddy_deb_cache_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download pinned Caddy package
  ansible.builtin.get_url:
    url: "{{ caddy_release_base_url }}/v{{ caddy_version }}/caddy_{{ caddy_version }}_linux_{{ caddy_deb_arch }}.deb"
    dest: "{{ caddy_deb_cache_dir }}/caddy_{{ caddy_version }}_linux_{{ caddy_deb_arch }}.deb"
    checksum: "sha512:{{ caddy_release_base_url }}/v{{ caddy_version }}/caddy_{{ caddy_version }}_checksums.txt"
    mode: "0644"
    timeout: 300
  register: caddy_deb_download

# In check mode a version change shows up as the download above; the package
# file only exists to inspect once it has been fetched.
- name: Install pinned Caddy
  ansible.builtin.apt:
    deb: "{{ caddy_deb_download.dest }}"
    allow_downgrade: true
  notify: caddy restart
  when: not (ansible_check_mode and caddy_deb_download is changed)
  # async kills a stalled apt fetch at the deadline; until re-runs it.
  register: caddy_package_attempt
  until: caddy_package_attempt is succeeded
  retries: 1
  delay: 10
  async: 600
  poll: 5
