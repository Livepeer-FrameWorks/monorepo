---
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Run node_tuning verify tag
      ansible.builtin.include_role:
        name: frameworks.infra.node_tuning
        tasks_from: verify
      vars:
        node_tuning_reserved_ports: "51820"

    - name: Read the reserved ports the kernel applies
      ansible.builtin.command: sysctl -n net.ipv4.ip_local_reserved_ports
      register: reserved_ports
      changed_when: false

    - name: Assert the WireGuard port is reserved
      ansible.builtin.assert:
        that: reserved_ports.stdout | trim == "51820"
        fail_msg: "net.ipv4.ip_local_reserved_ports is {{ reserved_ports.stdout | trim }}, want 51820"

    - name: Read actual UDP and TCP listeners
      ansible.builtin.command: ss -H -lntu
      register: resolved_listeners
      changed_when: false

    - name: Assert multicast resolver listeners are closed
      ansible.builtin.assert:
        that:
          - resolved_listeners.stdout is not regex(':(5353|5355)(\s|$)')
        fail_msg: "systemd-resolved still exposes multicast name-resolution listeners"

    - name: Rerun for idempotence
      ansible.builtin.include_role:
        name: frameworks.infra.node_tuning
      vars:
        node_tuning_reserved_ports: "51820"
      register: idem

    - name: Fail if second apply changed anything
      ansible.builtin.assert:
        that: idem is not changed
        fail_msg: "node_tuning role not idempotent"
