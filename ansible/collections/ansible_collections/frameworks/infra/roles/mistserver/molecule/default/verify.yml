---
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Skip verify when converge short-circuited
      ansible.builtin.meta: end_play
      when: mistserver_artifact_url | length == 0

    - name: Refresh service facts
      ansible.builtin.service_facts:

    - name: Assert frameworks-mistserver running
      ansible.builtin.assert:
        that: ansible_facts.services['frameworks-mistserver.service'].state == 'running'

    - name: Read legacy MistServer active state
      ansible.builtin.command:
        argv: [systemctl, is-active, mistserver.service]
      register: mistserver_legacy_active
      changed_when: false
      failed_when: false

    - name: Read legacy MistServer enablement
      ansible.builtin.command:
        argv: [systemctl, is-enabled, mistserver.service]
      register: mistserver_legacy_enabled
      changed_when: false
      failed_when: false

    - name: Assert legacy MistServer retired
      ansible.builtin.assert:
        that:
          - mistserver_legacy_active.stdout == 'inactive'
          - mistserver_legacy_enabled.stdout == 'disabled'

    - name: Wait for MistServer controller port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ mistserver_controller_port | default(4242) }}"
        timeout: 30

    - name: Assert authenticated MistServer API answers
      ansible.builtin.include_role:
        name: frameworks.infra.mistserver
        tasks_from: verify-api.yml

    - name: Rerun role (idempotence)
      ansible.builtin.include_role:
        name: frameworks.infra.mistserver
      register: idem

    - name: Fail if second apply changed anything
      ansible.builtin.assert:
        that: idem is not changed
        fail_msg: "mistserver role not idempotent"
