---
- name: Reconcile MistServer controller config
  ansible.builtin.command:
    argv:
      - "{{ ansible_python_interpreter | default('/usr/bin/python3') }}"
      - -c
      - |
        import json
        import os
        import sys

        path, interface, port_raw, mode = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
        wanted = {"interface": interface, "port": int(port_raw)}
        data = {}
        if os.path.exists(path) and os.path.getsize(path) > 0:
            with open(path, encoding="utf-8") as handle:
                data = json.load(handle)
        config = data.setdefault("config", {})
        controller = config.get("controller")
        if (
            isinstance(controller, dict)
            and controller.get("interface") == wanted["interface"]
            and controller.get("port") == wanted["port"]
        ):
            print("unchanged")
            sys.exit(0)
        if mode == "check":
            print("changed")
            sys.exit(0)
        if not isinstance(controller, dict):
            controller = {}
        controller.update(wanted)
        config["controller"] = controller
        tmp_path = path + ".tmp"
        with open(tmp_path, "w", encoding="utf-8") as handle:
            json.dump(data, handle, separators=(",", ":"))
            handle.write("\n")
        os.replace(tmp_path, path)
        print("changed")
      - "{{ mistserver_config_file }}"
      - "{{ mistserver_controller_interface }}"
      - "{{ mistserver_controller_port | string }}"
      - "{{ 'check' if ansible_check_mode else 'apply' }}"
  register: mistserver_controller_config
  changed_when: mistserver_controller_config.stdout == "changed"
  notify: mistserver restart

- name: Ensure MistServer config permissions
  ansible.builtin.file:
    path: "{{ mistserver_config_file }}"
    owner: "{{ mistserver_user }}"
    group: "{{ mistserver_group }}"
    mode: "0600"

- name: Read current MistServer env file
  ansible.builtin.slurp:
    src: "{{ mistserver_env_file }}"
  register: mistserver_current_env
  failed_when: false
  no_log: true

- name: Compose MistServer env file
  ansible.builtin.set_fact:
    mistserver_env_file_content: |
      # MistServer environment (managed by frameworks.infra.mistserver)
      {% for k, v in (mistserver_env | dictsort) %}
      {{ k }}={{ v }}
      {% endfor %}
      MIST_API_USERNAME={{ mistserver_api_user }}
      MIST_API_PASSWORD={{ mistserver_api_password }}
  no_log: true

- name: Render env file
  ansible.builtin.copy:
    dest: "{{ mistserver_env_file }}"
    content: "{{ mistserver_env_file_content }}"
    owner: "{{ mistserver_user }}"
    group: "{{ mistserver_group }}"
    mode: "0600"
  no_log: true
  notify: mistserver restart pending

# Every variable in this file is environment the controller only reads at
# start: the USR1 rolling reload execs the new MistController with the old
# process's environ, and the API account it holds must match the one
# Helmsman authenticates with. A changed assignment therefore restarts
# MistServer; a change to the header comment alone waits for the next start.
- name: Report MistServer environment change
  ansible.builtin.debug:
    msg: The MistServer environment changes; MistServer restarts to start with it
  changed_when: >-
    mistserver_current_env.content is defined
    and (mistserver_current_env.content | b64decode | regex_findall(mistserver_env_assignment_pattern))
        != (mistserver_env_file_content | regex_findall(mistserver_env_assignment_pattern))
  no_log: true
  notify: mistserver restart

- name: Read current MistServer systemd unit
  ansible.builtin.slurp:
    src: "{{ mistserver_unit_path }}"
  register: mistserver_current_unit
  failed_when: false

- name: Render systemd unit
  ansible.builtin.template:
    src: mistserver.service.j2
    dest: "{{ mistserver_unit_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: mistserver restart pending

# The reloaded MistController inherits the old process's environment, not the
# unit's, so a changed Environment=/EnvironmentFile= line (such as the
# LD_LIBRARY_PATH that resolves the bundled ONNX libraries) can break a later
# binary swap if it waits; it restarts MistServer instead. Other directives
# (ExecStart and friends) only matter at the next start.
- name: Report MistServer unit environment change
  ansible.builtin.debug:
    msg: The MistServer unit environment changes; MistServer restarts to start with it
  changed_when: >-
    mistserver_current_unit.content is defined
    and (mistserver_current_unit.content | b64decode | regex_findall(mistserver_unit_environment_pattern))
        != (lookup('ansible.builtin.template', 'mistserver.service.j2') | regex_findall(mistserver_unit_environment_pattern))
  notify: mistserver restart
