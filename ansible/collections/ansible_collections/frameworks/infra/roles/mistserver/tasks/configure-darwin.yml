---
# launchd has no native EnvironmentFile equivalent. Pattern: a shell wrapper
# sources the env file, then execs MistController. The plist loads the wrapper.

- name: Render env file
  ansible.builtin.copy:
    dest: "{{ mistserver_darwin_conf_dir }}/mistserver.env"
    content: |
      # MistServer environment (managed by frameworks.infra.mistserver)
      {% for k, v in (mistserver_env | dictsort) %}
      {{ k }}={{ v }}
      {% endfor %}
      MIST_API_USERNAME={{ mistserver_api_user }}
      MIST_API_PASSWORD={{ mistserver_api_password }}
    mode: "0600"
  no_log: true
  notify: mistserver restart

- name: Ensure MistServer account seed directory (darwin)
  ansible.builtin.file:
    path: "{{ mistserver_darwin_base_dir }}/libexec"
    state: directory
    mode: "0755"

- name: Install MistServer account seed helper (darwin)
  ansible.builtin.copy:
    src: mistserver-account-seed.py
    dest: "{{ mistserver_darwin_base_dir }}/libexec/mistserver-account-seed.py"
    mode: "0755"
  notify: mistserver restart

# MistController reads config.json from its working directory (the plist's
# WorkingDirectory). The API account is seeded into it from the env file, so
# the password never appears on MistController's command line.
- name: Render launchd wrapper script
  ansible.builtin.copy:
    dest: "{{ mistserver_darwin_base_dir }}/mistserver/run.sh"
    content: |
      #!/bin/bash
      set -e
      while IFS= read -r line || [ -n "$line" ]; do
        line="${line%%#*}"
        line="${line#"${line%%[! ]*}"}"
        [ -z "$line" ] && continue
        case "$line" in
          *=*) export "$line" ;;
        esac
      done < "{{ mistserver_darwin_conf_dir }}/mistserver.env"
      "{{ mistserver_account_seed_python }}" "{{ mistserver_darwin_base_dir }}/libexec/mistserver-account-seed.py" \
        "{{ mistserver_darwin_base_dir }}/mistserver/bin/config.json"
      unset MIST_API_PASSWORD
      exec "{{ mistserver_darwin_base_dir }}/mistserver/bin/MistController"
    mode: "0755"
  notify: mistserver restart

- name: Render launchd plist
  ansible.builtin.template:
    src: mistserver.plist.j2
    dest: "{{ mistserver_darwin_plist_dir }}/{{ mistserver_darwin_label }}.plist"
    mode: "0644"
  notify: mistserver restart
