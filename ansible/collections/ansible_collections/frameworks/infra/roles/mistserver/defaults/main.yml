---
# MistServer edge media server. Pinned artifact URL+checksum flow in from the
# CLI (resolved out of the release manifest). The upstream tarball keeps the
# Mist* executables together under bin/; MistController is the service entry
# point. It takes the API account from MIST_API_USERNAME/MIST_API_PASSWORD in
# its environment (the env file), never from `MistController -a
# user:password`, which the process list would expose.

mistserver_artifact_url: ""
mistserver_artifact_checksum: ""
mistserver_version: ""
mistserver_onnx_profile: cpu
mistserver_debug_artifact_url: ""
mistserver_debug_artifact_checksum: ""
mistserver_install_debug_symbols: false
mistserver_debug_symbols_dir: "{{ mistserver_install_dir }}/debug"
mistserver_manifest_file: "{{ mistserver_install_dir }}/manifest.json"

# Optional: helmsman component-updater version file (component-versions.env).
# When set, the install tasks record MIST_VERSION there so helmsman reports
# the installed version. Empty means no stamp (non-edge deployments).
mistserver_component_versions_file: ""

mistserver_api_user: frameworks
# Required. Go-side callers generate a random hex string per host. Stored in
# the env file with mode 0600 so only the mistserver user can read it.
mistserver_api_password: ""

# Extra env keys mixed into the env file. `MIST_DEBUG=3` is the historical
# default; overridable per host.
mistserver_env:
  MIST_DEBUG: "3"

# Linux layout. Overridable if a host conflicts with another /opt user.
mistserver_user: frameworks
mistserver_group: frameworks
mistserver_install_dir: /opt/frameworks/mistserver
mistserver_env_file: /etc/frameworks/mistserver.env
mistserver_config_file: /etc/mistserver.conf
mistserver_systemd_name: frameworks-mistserver
mistserver_unit_path: "/etc/systemd/system/{{ mistserver_systemd_name }}.service"
# The upstream unit must not run beside the managed service: both bind the same media ports.
mistserver_legacy_systemd_name: mistserver
mistserver_controller_port: 4242
mistserver_controller_interface: 127.0.0.1
# Lines that set the controller's start-time environment. A USR1 reload
# re-execs MistController with the running process's environ, so a change to
# these restarts MistServer instead of waiting (tasks/configure-*.yml); the
# CLI's contract test applies the same patterns.
mistserver_env_assignment_pattern: "(?m)^[A-Za-z_][A-Za-z0-9_]*=.*$"
mistserver_unit_environment_pattern: '(?m)^[ \t]*(?:Environment|EnvironmentFile)=.*$'
mistserver_plist_environment_pattern: '(?s)<key>EnvironmentVariables</key>\s*<dict>.*?</dict>'
# Written when a unit/env change waits for the controller's next start;
# `edge provision` reads it back for its summary (cli/pkg/provisioner).
mistserver_restart_pending_marker: >-
  {{ (mistserver_darwin_base_dir ~ '/mistserver')
     if ansible_facts.os_family == 'Darwin' else mistserver_install_dir }}/.restart-pending
# The controller's main PID: the angel process, which keeps its PID across
# the USR1 re-exec, so a changed PID means the controller was started again.
mistserver_main_pid_argv: >-
  {{ ['pgrep', '-o', '-x', 'MistController']
     if ansible_facts.os_family == 'Darwin'
     else ['systemctl', 'show', '-p', 'MainPID', '--value', mistserver_systemd_name] }}
# Bound on the post-reload authenticated api2 check: attempts x (timeout +
# delay) seconds before validate falls back to a full restart.
mistserver_api_verify_retries: 6
mistserver_api_verify_delay: 5
mistserver_api_verify_timeout: 10
mistserver_runtime_packages:
  - ffmpeg
mistserver_runtime_package_manager: ""
mistserver_portable_runtime_packages:
  - ffmpeg

# Darwin layout. Selected when ansible_facts.os_family == 'Darwin'. Two
# domains supported: system (/Library/LaunchDaemons, root) and user
# (~/Library/LaunchAgents, no sudo). The CLI picks by passing
# mistserver_darwin_domain=system|user.
mistserver_darwin_domain: system
mistserver_darwin_label: com.livepeer.frameworks.mistserver

mistserver_darwin_system_base_dir: /usr/local/opt/frameworks
mistserver_darwin_system_conf_dir: /usr/local/etc/frameworks
mistserver_darwin_system_log_dir: /usr/local/var/log/frameworks
mistserver_darwin_system_plist_dir: /Library/LaunchDaemons

mistserver_darwin_user_base_dir: "{{ ansible_facts.env.HOME }}/.local/opt/frameworks"
mistserver_darwin_user_conf_dir: "{{ ansible_facts.env.HOME }}/.config/frameworks"
mistserver_darwin_user_log_dir: "{{ ansible_facts.env.HOME }}/.local/var/log/frameworks"
mistserver_darwin_user_plist_dir: "{{ ansible_facts.env.HOME }}/Library/LaunchAgents"
