---
# Version pinning — the CLI passes this from config/infrastructure.yaml.
postgres_version: "16"
postgres_instance_name: postgres

# Listener — loopback for direct role use. Cluster provisioning binds loopback
# and the host's WireGuard address, where same-host containers and mesh peers
# connect; the LAN and public interfaces stay closed.
postgres_listen_addresses: "127.0.0.1"
postgres_port: 5432

# Pinned postgres-exporter release-manifest artifact; the CLI passes it.
postgres_exporter_artifact_url: ""
postgres_exporter_artifact_checksum: ""

# Paths mirror the Debian/Ubuntu package defaults that geerlingguy.postgresql
# uses — explicit here so templates that reference them stay portable when
# we extend to RHEL/Arch.
postgres_data_dir: "/var/lib/postgresql/{{ postgres_version }}/main"
postgres_config_dir: "/etc/postgresql/{{ postgres_version }}/main"
postgres_arch_pgroot: "/var/lib/postgres/{{ postgres_instance_name }}"

# Secrets — the CLI injects postgres_admin_password via extra-vars from the
# SOPS-decrypted shared env. Never commit a real value here.
postgres_admin_password: ""
postgres_runtime_password: ""

# Databases to create at init-tag time. Each entry: {name, owner}. Owner
# defaults to the database name; role resolution handles that downstream.
postgres_databases: []

postgres_extension_packages_by_family:
  Debian:
    - "postgresql-{{ postgres_version }}-pgvector"

postgres_pgvector_enabled: false
postgres_pgvector_aur_package: pgvector
postgres_pgvector_aur_repo: https://aur.archlinux.org/pgvector.git
postgres_pgvector_aur_build_user: frameworks-aur
postgres_pgvector_aur_build_dir: "/var/cache/frameworks/aur/{{ postgres_pgvector_aur_package }}"
postgres_pgvector_arch_build_packages:
  - base-devel
  - git
  - clang
  - llvm
  - compiler-rt

# pg_hba entries rendered into Postgres's client auth file. Defaults allow
# local peer auth for the postgres superuser plus scram-sha-256 password auth
# from loopback and Docker bridge networks used by colocated compose apps.
postgres_hba_entries:
  - type: local
    database: all
    user: postgres
    auth_method: peer
  - type: local
    database: all
    user: all
    auth_method: peer
  - type: host
    database: all
    user: all
    address: "127.0.0.1/32"
    auth_method: scram-sha-256
  - type: host
    database: all
    user: all
    address: "::1/128"
    auth_method: scram-sha-256
  - type: host
    database: all
    user: all
    address: "172.16.0.0/12"
    auth_method: scram-sha-256
# Mesh CIDR whose clients (services on this and other mesh hosts, which dial
# <host>.internal) may authenticate with a password. Empty adds no entry.
postgres_hba_mesh_cidr: ""

# Performance defaults — overridable from the manifest's `tuning:` block.
postgres_max_connections: 200
postgres_shared_buffers: "512MB"
