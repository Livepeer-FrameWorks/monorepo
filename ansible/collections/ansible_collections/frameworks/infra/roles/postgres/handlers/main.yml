---
- name: Restart postgresql
  listen: postgres restart
  ansible.builtin.systemd:
    name: "{{ postgres_service_name }}"
    state: restarted
  register: postgres_restarted

- name: Restart postgres exporter
  listen: postgres exporter restart
  ansible.builtin.systemd:
    name: "{{ postgres_exporter_service_name }}"
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode

- name: Reload postgresql
  listen: postgres reload
  ansible.builtin.systemd:
    name: "{{ postgres_service_name }}"
    state: reloaded
  when: postgres_restarted is not defined
