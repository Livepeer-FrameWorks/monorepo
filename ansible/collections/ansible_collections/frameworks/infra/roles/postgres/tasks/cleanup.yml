---
- name: Stop and disable postgres exporter
  ansible.builtin.systemd:
    name: "{{ postgres_exporter_service_name }}"
    state: stopped
    enabled: false
  failed_when: false

- name: Remove postgres exporter unit and config
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/etc/systemd/system/{{ postgres_exporter_service_name }}.service"
    - "{{ postgres_exporter_config_path }}"

- name: Stop and disable postgresql
  ansible.builtin.systemd:
    name: "{{ postgres_service_name }}"
    state: stopped
    enabled: false
  failed_when: false
