---
# Migration items delivered by the CLI: list of {db, owner, schema, version, phase,
# sequence, filename, checksum, transactional, sql}. The role validates already-applied
# checksums, filters to pending, and records successful applies in _migrations.

- name: Validate migration owner identifiers
  ansible.builtin.assert:
    that:
      - item.owner is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - item.schema is match('^[A-Za-z_][A-Za-z0-9_]*$')
    fail_msg: "Migration owner identifiers must be simple SQL identifiers"
  loop: "{{ postgres_migrate_items | default([]) }}"
  loop_control:
    label: "{{ item.db }}:{{ item.owner }}"
  when: postgres_migrate_items | default([]) | length > 0

- name: Read applied migrations per database
  become: true
  become_user: postgres
  community.postgresql.postgresql_query:
    login_unix_socket: /var/run/postgresql
    db: "{{ db_entry }}"
    query: "SELECT version || ':' || phase || ':' || seq AS key, checksum FROM _migrations"
  register: postgres_applied_queries
  changed_when: false
  failed_when: false
  check_mode: false
  loop: "{{ postgres_migrate_items | default([]) | map(attribute='db') | unique | list }}"
  loop_control:
    loop_var: db_entry

- name: Fail on migration ledger read errors
  ansible.builtin.fail:
    msg: >-
      Read _migrations failed for {{ item.db_entry }}:
      {{ item.msg | default(item.stderr | default('unknown error')) }}
  loop: "{{ postgres_applied_queries.results | default([]) }}"
  loop_control:
    label: "{{ item.db_entry }}"
  vars:
    ledger_read_error: "{{ (item.msg | default('')) ~ (item.stderr | default('')) }}"
  when:
    - item.failed | default(false)
    - "'_migrations' not in ledger_read_error or 'does not exist' not in ledger_read_error"

- name: Index applied migrations by database
  ansible.builtin.set_fact:
    postgres_applied_by_db: >-
      {{ postgres_applied_by_db | default({})
         | combine({ item.db_entry:
                     dict((item.query_result | default([]) | map(attribute='key') | list)
                          | zip(item.query_result | default([]) | map(attribute='checksum') | list)) }) }}
  loop: "{{ postgres_applied_queries.results | default([]) }}"
  loop_control:
    label: "{{ item.db_entry }}"

- name: Fail on edited applied migrations
  ansible.builtin.fail:
    msg: >-
      Migration checksum mismatch for {{ item.db }}/{{ item.version }}/{{ item.phase }}/{{ item.filename }}:
      database has {{ postgres_applied_by_db[item.db][item.version ~ ':' ~ item.phase ~ ':' ~ (item.sequence | string)] }},
      embedded file has {{ item.checksum }}.
  loop: "{{ postgres_migrate_items | default([]) }}"
  loop_control:
    label: "{{ item.db }}/{{ item.version }}/{{ item.phase }}/{{ item.filename }}"
  vars:
    migration_key: "{{ item.version ~ ':' ~ item.phase ~ ':' ~ (item.sequence | string) }}"
  when:
    - postgres_migrate_items | default([]) | length > 0
    - migration_key in (postgres_applied_by_db[item.db] | default({}))
    - postgres_applied_by_db[item.db][migration_key] != item.checksum

- name: Select pending migrations
  ansible.builtin.set_fact:
    postgres_pending_migrate_items: "{{ postgres_pending_migrate_items | default([]) + [item] }}"
  loop: "{{ postgres_migrate_items | default([]) }}"
  loop_control:
    label: "{{ item.db }}/{{ item.version }}/{{ item.phase }}/{{ item.filename }}"
  vars:
    migration_key: "{{ item.version ~ ':' ~ item.phase ~ ':' ~ (item.sequence | string) }}"
  when:
    - postgres_migrate_items | default([]) | length > 0
    - migration_key not in (postgres_applied_by_db[item.db] | default({}))

- name: Report pending migrations
  ansible.builtin.debug:
    msg: >-
      Would apply {{ item.db }}/{{ item.version }}/{{ item.phase }}/{{ item.filename }}
      as {{ item.owner }}.
  loop: "{{ postgres_pending_migrate_items | default([]) }}"
  loop_control:
    label: "{{ item.db }}/{{ item.version }}/{{ item.phase }}/{{ item.filename }}"
  when: ansible_check_mode

- name: Reconcile application schema ownership before migrations
  become: true
  become_user: postgres
  community.postgresql.postgresql_query:
    login_unix_socket: /var/run/postgresql
    db: "{{ db_entry }}"
    query: |
      DO $frameworks_migration_ownership$
      DECLARE
        target_schema text := '{{ migration_target.schema }}';
        target_owner text := '{{ migration_target.owner }}';
        target_owner_oid oid;
        obj record;
      BEGIN
        SELECT oid INTO target_owner_oid FROM pg_roles WHERE rolname = target_owner;
        IF target_owner_oid IS NULL THEN
          RAISE EXCEPTION 'role % does not exist', target_owner;
        END IF;
        IF NOT EXISTS (SELECT 1 FROM pg_namespace WHERE nspname = target_schema) THEN
          RAISE EXCEPTION 'application schema % does not exist', target_schema;
        END IF;

        IF EXISTS (
          SELECT 1 FROM pg_namespace
          WHERE nspname = target_schema AND nspowner <> target_owner_oid
        ) THEN
          EXECUTE format('ALTER SCHEMA %I OWNER TO %I', target_schema, target_owner);
        END IF;

        FOR obj IN
          SELECT n.nspname, c.relname, c.relkind
          FROM pg_class c
          JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE n.nspname = target_schema
            AND c.relkind IN ('r', 'p', 'v', 'm', 'S', 'f')
            AND c.relowner <> target_owner_oid
        LOOP
          IF obj.relkind = 'S' THEN
            EXECUTE format('ALTER SEQUENCE %I.%I OWNER TO %I', obj.nspname, obj.relname, target_owner);
          ELSIF obj.relkind = 'v' THEN
            EXECUTE format('ALTER VIEW %I.%I OWNER TO %I', obj.nspname, obj.relname, target_owner);
          ELSIF obj.relkind = 'm' THEN
            EXECUTE format('ALTER MATERIALIZED VIEW %I.%I OWNER TO %I', obj.nspname, obj.relname, target_owner);
          ELSIF obj.relkind = 'f' THEN
            EXECUTE format('ALTER FOREIGN TABLE %I.%I OWNER TO %I', obj.nspname, obj.relname, target_owner);
          ELSE
            EXECUTE format('ALTER TABLE %I.%I OWNER TO %I', obj.nspname, obj.relname, target_owner);
          END IF;
        END LOOP;

        FOR obj IN
          SELECT n.nspname, p.proname, pg_get_function_identity_arguments(p.oid) AS args
          FROM pg_proc p
          JOIN pg_namespace n ON n.oid = p.pronamespace
          WHERE n.nspname = target_schema
            AND p.proowner <> target_owner_oid
            AND p.prokind = 'f'
        LOOP
          EXECUTE format('ALTER FUNCTION %I.%I(%s) OWNER TO %I', obj.nspname, obj.proname, obj.args, target_owner);
        END LOOP;

        FOR obj IN
          SELECT n.nspname, p.proname, pg_get_function_identity_arguments(p.oid) AS args
          FROM pg_proc p
          JOIN pg_namespace n ON n.oid = p.pronamespace
          WHERE n.nspname = target_schema
            AND p.proowner <> target_owner_oid
            AND p.prokind = 'p'
        LOOP
          EXECUTE format('ALTER PROCEDURE %I.%I(%s) OWNER TO %I', obj.nspname, obj.proname, obj.args, target_owner);
        END LOOP;
      END
      $frameworks_migration_ownership$;
  loop: "{{ postgres_pending_migrate_items | default([]) | map(attribute='db') | unique | list }}"
  loop_control:
    loop_var: db_entry
  vars:
    migration_target: "{{ postgres_pending_migrate_items | selectattr('db', 'equalto', db_entry) | first }}"
  when:
    - not ansible_check_mode
    - postgres_pending_migrate_items | default([]) | length > 0

- name: Ensure _migrations tracking table per database
  become: true
  become_user: postgres
  community.postgresql.postgresql_query:
    login_unix_socket: /var/run/postgresql
    db: "{{ db_entry }}"
    query: |
      CREATE TABLE IF NOT EXISTS _migrations (
        version    TEXT NOT NULL,
        phase      TEXT NOT NULL DEFAULT 'expand',
        seq        INT NOT NULL,
        filename   TEXT NOT NULL,
        checksum   TEXT NOT NULL,
        transactional BOOLEAN NOT NULL DEFAULT true,
        applied_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        PRIMARY KEY (version, phase, seq)
      );
      ALTER TABLE _migrations
        ADD COLUMN IF NOT EXISTS phase TEXT NOT NULL DEFAULT 'expand';
      ALTER TABLE _migrations
        ADD COLUMN IF NOT EXISTS transactional BOOLEAN NOT NULL DEFAULT true;
      DO $$
      BEGIN
        IF EXISTS (
          SELECT 1
          FROM pg_constraint
          WHERE conrelid = '_migrations'::regclass
            AND conname = '_migrations_pkey'
            AND array_length(conkey, 1) = 2
        ) THEN
          ALTER TABLE _migrations DROP CONSTRAINT _migrations_pkey;
        END IF;
        IF NOT EXISTS (
          SELECT 1
          FROM pg_constraint
          WHERE conrelid = '_migrations'::regclass
            AND conname = '_migrations_pkey'
        ) THEN
          ALTER TABLE _migrations
            ADD CONSTRAINT _migrations_pkey PRIMARY KEY (version, phase, seq);
        END IF;
      END $$;
  loop: "{{ postgres_pending_migrate_items | default([]) | map(attribute='db') | unique | list }}"
  loop_control:
    loop_var: db_entry
  when: not ansible_check_mode

# Migrations run while services are live. A transactional item sets lock_timeout, so a statement that cannot get its
# lock fails fast instead of queueing live traffic behind it, and statement_timeout, and is replayed only when it
# failed on the lock timeout: its own statements roll back with it (on YugabyteDB, DDL is not transactional by
# default, so replay relies on migrations being written to re-run cleanly). A .notx.sql item runs without timeouts,
# because a concurrent index build waits for older transactions and a large build can run long; it is never
# replayed. An interrupted CREATE INDEX CONCURRENTLY leaves an invalid index that IF NOT EXISTS would skip, so the
# ledger row would be written over a broken index; the item repairs it itself, inside the advisory lock. Only then is
# a guarded index known to be abandoned: every migrator builds under that lock, and a build in progress is invalid
# too. The repair also rechecks the ledger, so an item another migrator applied meanwhile keeps its valid index. A
# plain DROP INDEX takes the table's ACCESS EXCLUSIVE lock, so the repair runs between its own lock and statement
# timeouts and resets them before the concurrent build that follows (DROP INDEX CONCURRENTLY cannot run inside the
# conditional block). The timeouts are set before the repair statement, because a statement's timeout is armed when
# it starts. The item timeouts are set after the advisory lock so a concurrent migrator still waits for it.
- name: Apply pending migrations
  become: true
  become_user: postgres
  community.postgresql.postgresql_query:
    login_unix_socket: /var/run/postgresql
    db: "{{ item.db }}"
    query: >-
      {{
        [
          "SELECT pg_advisory_lock(hashtext('frameworks_migrations'), hashtext('" ~ item.db ~ "'))"
        ]
        + ((item.invalid_index_guards | default([]) | length > 0) | ternary([
            "SET statement_timeout = '60s'",
            "SET lock_timeout = '5s'",
            invalid_index_repair_sql,
            "RESET lock_timeout",
            "RESET statement_timeout"
          ], []))
        + ((item.transactional | default(true)) | ternary(["SET lock_timeout = '5s'", "SET statement_timeout = '15min'"], []))
        + [
          'SET ROLE "' ~ item.owner ~ '"'
        ]
        + item.statements
        + [
          "RESET ROLE",
          migration_ledger_sql,
          "SELECT pg_advisory_unlock(hashtext('frameworks_migrations'), hashtext('" ~ item.db ~ "'))"
        ]
      }}
    autocommit: "{{ not (item.transactional | default(true)) }}"
  register: postgres_migration_apply
  until: >-
    postgres_migration_apply is succeeded
    or not (item.transactional | default(true))
    or 'canceling statement due to lock timeout' not in (postgres_migration_apply.msg | default(''))
  retries: 6
  delay: 10
  loop: "{{ postgres_pending_migrate_items | default([]) }}"
  loop_control:
    label: "{{ item.db }}/{{ item.version }}/{{ item.phase }}/{{ item.filename }}"
  when:
    - not ansible_check_mode
    - postgres_pending_migrate_items | default([]) | length > 0
  vars:
    invalid_index_repair_sql: >-
      DO $repair$
      DECLARE target text;
      BEGIN
        IF NOT EXISTS (SELECT 1 FROM _migrations
                        WHERE version = '{{ item.version }}' AND phase = '{{ item.phase }}' AND seq = {{ item.sequence }}) THEN
          FOR target IN
            SELECT format('%I.%I', n.nspname, c.relname)
              FROM pg_index i
              JOIN pg_class c ON c.oid = i.indexrelid
              JOIN pg_namespace n ON n.oid = c.relnamespace
             WHERE NOT i.indisvalid
               AND n.nspname || '.' || c.relname = ANY(
                 ARRAY['{{ item.invalid_index_guards | default([]) | map('replace', "'", "''") | join("', '") }}']::text[])
          LOOP
            EXECUTE 'DROP INDEX IF EXISTS ' || target;
          END LOOP;
        END IF;
      END $repair$
    migration_ledger_sql: >-
      INSERT INTO _migrations (version, phase, seq, filename, checksum, transactional)
      VALUES ('{{ item.version }}', '{{ item.phase }}', {{ item.sequence }},
              '{{ item.filename }}', '{{ item.checksum }}',
              {{ item.transactional | default(true) | ternary('true', 'false') }})
