---
# Create per-owner roles and databases. Owner defaults to the database name.
- name: Assert owner and runtime passwords are present and independent
  ansible.builtin.assert:
    that:
      - (item.password | default(postgres_admin_password)) | length > 0
      - (item.runtime_password | default(postgres_runtime_password)) | length > 0
      - (item.runtime_password | default(postgres_runtime_password)) != (item.password | default(postgres_admin_password))
      - (item.runtime_role | default((item.owner | default(item.name, true)) ~ '_runtime', true)) != (item.owner | default(item.name, true))
    fail_msg: "PostgreSQL database {{ item.name }} requires distinct owner/runtime roles and passwords"
  loop: "{{ postgres_databases }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  when: postgres_databases | length > 0

- name: Create application owner roles
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    login_unix_socket: /var/run/postgresql
    name: "{{ item.owner | default(item.name, true) }}"
    password: "{{ item.password | default(postgres_admin_password) }}"
    role_attr_flags: LOGIN
    state: present
  loop: "{{ postgres_databases }}"
  loop_control:
    label: "{{ item.owner | default(item.name, true) }}"
  no_log: true
  when:
    - not ansible_check_mode
    - postgres_databases | length > 0

- name: Create databases
  become: true
  become_user: postgres
  community.postgresql.postgresql_db:
    login_unix_socket: /var/run/postgresql
    name: "{{ item.name }}"
    owner: "{{ item.owner | default(item.name, true) }}"
    encoding: UTF-8
    lc_collate: en_US.UTF-8
    lc_ctype: en_US.UTF-8
    template: template0
    state: present
  # Loops over the fields it uses only: task results echo each loop item, and
  # the database entries carry their passwords.
  loop: >-
    {{ postgres_databases | map('dict2items')
       | map('selectattr', 'key', 'in', ['name', 'owner']) | map('items2dict') | list }}
  loop_control:
    label: "{{ item.name }}"
  when:
    - not ansible_check_mode
    - postgres_databases | length > 0

- name: Create least-privilege application runtime roles
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    login_unix_socket: /var/run/postgresql
    name: "{{ item.runtime_role | default((item.owner | default(item.name, true)) ~ '_runtime', true) }}"
    password: "{{ item.runtime_password | default(postgres_runtime_password) }}"
    role_attr_flags: LOGIN,NOSUPERUSER,NOCREATEDB,NOCREATEROLE,NOREPLICATION
    state: present
  loop: "{{ postgres_databases }}"
  loop_control:
    label: "{{ item.runtime_role | default((item.owner | default(item.name, true)) ~ '_runtime', true) }}"
  no_log: true
  when:
    - not ansible_check_mode
    - postgres_databases | length > 0

# Services log in as the runtime roles, and nothing else does: migrations, backups and restores connect as postgres.
# A transaction a service leaves open keeps its locks until its session ends, so a runtime session idle inside a
# transaction is ended after a minute and a runtime statement is cancelled after a minute. A role's settings apply at
# login, so a service's pool takes them up as it opens connections. A role is altered only when its settings differ.
- name: Find runtime roles without session limits
  become: true
  become_user: postgres
  community.postgresql.postgresql_query:
    login_unix_socket: /var/run/postgresql
    query: >-
      SELECT r.rolname FROM pg_roles r
      WHERE r.rolname = ANY(string_to_array(%(roles)s, ','))
        AND NOT EXISTS (
          SELECT 1 FROM pg_db_role_setting s
          WHERE s.setrole = r.oid AND s.setdatabase = 0 AND s.setconfig @> string_to_array(%(limits)s, ','))
      ORDER BY r.rolname
    # Lists are passed joined: the module renders a list argument with its elements' Python quotes inside the array.
    named_args:
      roles: "{{ postgres_runtime_role_names | join(',') }}"
      limits: >-
        statement_timeout={{ postgres_runtime_statement_timeout }},idle_in_transaction_session_timeout={{
        postgres_runtime_idle_in_transaction_session_timeout }}
  register: postgres_runtime_roles_unbounded
  changed_when: false
  vars:
    postgres_runtime_role_names: >-
      {%- set names = [] -%}
      {%- for database in postgres_databases -%}
      {%- set _ = names.append(database.runtime_role | default((database.owner | default(database.name, true)) ~ '_runtime', true)) -%}
      {%- endfor -%}
      {{ names | unique | list }}
  when:
    - not ansible_check_mode
    - postgres_databases | length > 0

- name: Bound runtime role sessions
  become: true
  become_user: postgres
  community.postgresql.postgresql_query:
    login_unix_socket: /var/run/postgresql
    autocommit: true
    query:
      - ALTER ROLE "{{ item.rolname }}" SET statement_timeout = '{{ postgres_runtime_statement_timeout }}'
      - >-
        ALTER ROLE "{{ item.rolname }}"
        SET idle_in_transaction_session_timeout = '{{ postgres_runtime_idle_in_transaction_session_timeout }}'
  # The module reports no rows as an empty mapping.
  loop: "{{ postgres_runtime_roles_unbounded.query_result | default([]) | list }}"
  loop_control:
    label: "{{ item.rolname }}"
  when: not ansible_check_mode

- name: Create database extensions
  become: true
  become_user: postgres
  community.postgresql.postgresql_ext:
    login_unix_socket: /var/run/postgresql
    login_db: "{{ item.0.name }}"
    name: "{{ item.1 }}"
    state: present
  loop: >-
    {{ postgres_databases | map('dict2items')
       | map('selectattr', 'key', 'in', ['name', 'extensions']) | map('items2dict') | list
       | subelements('extensions', skip_missing=true) }}
  loop_control:
    label: "{{ item.0.name }}:{{ item.1 }}"
  when:
    - not ansible_check_mode
    - postgres_databases | length > 0
