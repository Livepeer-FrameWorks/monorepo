---
kafka_mm_java_package_by_family:
  Debian: openjdk-21-jre-headless
  RedHat: java-21-openjdk-headless
  Archlinux: jre21-openjdk-headless

kafka_mm_bin_dir: "{{ kafka_mm_install_dir }}/bin"
kafka_mm_properties_path: "{{ kafka_mm_install_dir }}/mm2.properties"
# connect.log rolls daily or at kafka_mm_log_file_size; rolled files are kept
# at most 7 days and 1 GB in total.
kafka_mm_log4j_path: "{{ kafka_mm_install_dir }}/mm2-log4j2.yaml"
kafka_mm_log_file_size: 100 MB
kafka_mm_log_retention_age: 7d
kafka_mm_log_retention_size: 1 GB
kafka_mm_install_sentinel: "{{ kafka_mm_install_dir }}/.installed-{{ (kafka_mm_artifact_checksum ~ kafka_mm_artifact_url) | hash('sha256') }}"
# Outside kafka_mm_install_dir so a Kafka tarball reinstall never removes it.
kafka_mm_jmx_exporter_jar: "{{ kafka_mm_jmx_exporter_dir }}/jmx_prometheus_javaagent.jar"
kafka_mm_jmx_exporter_config_path: "{{ kafka_mm_jmx_exporter_dir }}/mirrormaker.yml"
