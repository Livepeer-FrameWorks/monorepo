---
kafka_mm_artifact_url: ""
kafka_mm_artifact_checksum: ""
kafka_mm_version: ""

kafka_mm_user: kafka
kafka_mm_group: kafka
kafka_mm_install_dir: /opt/kafka
kafka_mm_state_dir: /var/lib/kafka-mirrormaker
kafka_mm_log_dir: /var/log/kafka-mirrormaker
kafka_mm_tarball_path: /tmp/kafka-mirrormaker.tar.gz

kafka_mm_heap_opts: "-Xmx1G -Xms1G"
kafka_mm_rest_port: 8083
kafka_mm_validate_rest: false
kafka_mm_task_count: 2
kafka_mm_local_cluster_alias: ""

# Prometheus JMX exporter javaagent. The worker serves MirrorMaker2 connector
# metrics on 127.0.0.1:kafka_mm_jmx_port for the host-local vmagent; 9404
# does not collide with Kafka (9092/9093), the MM2 REST port (8083), or the
# VictoriaMetrics components (8427-8429, 8880).
kafka_mm_jmx_exporter_artifact_url: ""
kafka_mm_jmx_exporter_artifact_checksum: ""
kafka_mm_jmx_exporter_dir: /opt/kafka-jmx-exporter
kafka_mm_jmx_port: 9404

kafka_mm_target: {}
kafka_mm_sources: []
