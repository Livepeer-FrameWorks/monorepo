---
- name: Service_bootstrap | argument validation
  ansible.builtin.assert:
    that:
      - service_bootstrap_service | length > 0
      - service_bootstrap_mode in ["apply", "validate", "dry_run"]
      - service_bootstrap_mode == "validate" or (service_bootstrap_yaml | length > 0)
      - service_bootstrap_mode != "dry_run" or (service_bootstrap_target_version | length > 0)
    fail_msg: >-
      service_bootstrap_service is required, mode must be "apply",
      "validate" or "dry_run", apply and dry_run require
      service_bootstrap_yaml, and dry_run requires
      service_bootstrap_target_version.

# The plan comes from the binary that will apply it: an older installed
# binary would report the previous release's reconcile. The installed version
# is read from go_service's install record, never by running the binary.
- name: Service_bootstrap | dry run | read installed version
  ansible.builtin.command: cat "{{ service_bootstrap_install_dir }}/.artifact-version"
  register: service_bootstrap_installed_version
  changed_when: false
  failed_when: false
  check_mode: false
  when: service_bootstrap_mode == "dry_run"

- name: Service_bootstrap | dry run | report a service not yet at the target
  ansible.builtin.debug:
    msg: >-
      {{ service_bootstrap_service }} is installed at
      {{ service_bootstrap_installed_version.stdout | default('') | trim | default('an unrecorded version', true) }},
      not {{ service_bootstrap_target_version }}; its bootstrap plan is
      reported once it runs {{ service_bootstrap_target_version }}.
  when:
    - service_bootstrap_mode == "dry_run"
    - (service_bootstrap_installed_version.stdout | default('') | trim) != service_bootstrap_target_version

- name: Service_bootstrap | dry run
  when:
    - service_bootstrap_mode == "dry_run"
    - (service_bootstrap_installed_version.stdout | default('') | trim) == service_bootstrap_target_version
  vars:
    ansible_remote_tmp: "{{ service_bootstrap_state_dir }}/.ansible/tmp"
    service_bootstrap_plan_file: "{{ service_bootstrap_state_dir }}/bootstrap-dry-run.yaml"
  block:
    - name: Service_bootstrap | dry run | ensure Ansible temp dir exists
      ansible.builtin.file:
        path: "{{ service_bootstrap_state_dir }}/.ansible/tmp"
        state: directory
        owner: "{{ service_bootstrap_user }}"
        group: "{{ service_bootstrap_group }}"
        mode: "0700"

    - name: Service_bootstrap | dry run | write rendered desired-state file
      ansible.builtin.copy:
        content: "{{ service_bootstrap_yaml }}"
        dest: "{{ service_bootstrap_plan_file }}"
        owner: "{{ service_bootstrap_user }}"
        group: "{{ service_bootstrap_group }}"
        mode: "0600"
      no_log: true

    # --dry-run runs the full reconcile in a transaction the service rolls
    # back, and prints what it would change.
    - name: Service_bootstrap | dry run | run subcommand
      ansible.builtin.command:
        argv: >-
          {{
            ['/bin/bash', '-c',
             'set -a; . "$1"; set +a; shift; exec "$@"',
             '--',
             service_bootstrap_env_file,
             service_bootstrap_install_dir + '/' + service_bootstrap_service,
             'bootstrap',
             '--file', service_bootstrap_plan_file,
             '--dry-run']
            + (service_bootstrap_extra_args | default([]))
          }}
      become_user: "{{ service_bootstrap_user }}"
      become: true
      register: service_bootstrap_plan
      changed_when: false
      failed_when: false

    - name: Service_bootstrap | dry run | print the plan
      ansible.builtin.debug:
        msg: "{{ service_bootstrap_plan.stdout_lines + service_bootstrap_plan.stderr_lines }}"

    - name: Service_bootstrap | dry run | fail when the plan would not apply
      ansible.builtin.fail:
        msg: >-
          {{ service_bootstrap_service }} bootstrap --dry-run exited
          {{ service_bootstrap_plan.rc }}; the apply would fail the same way.
      when: service_bootstrap_plan.rc != 0
  always:
    - name: Service_bootstrap | dry run | remove desired-state file
      ansible.builtin.file:
        path: "{{ service_bootstrap_plan_file }}"
        state: absent

- name: Service_bootstrap | apply
  when: service_bootstrap_mode == "apply"
  block:
    - name: Service_bootstrap | apply | ensure state root is traversable
      ansible.builtin.file:
        path: "{{ service_bootstrap_state_dir | dirname }}"
        state: directory
        owner: root
        group: "{{ service_bootstrap_group }}"
        mode: "0755"

    - name: Service_bootstrap | apply | ensure state dir exists
      ansible.builtin.file:
        path: "{{ service_bootstrap_state_dir }}"
        state: directory
        owner: "{{ service_bootstrap_user }}"
        group: "{{ service_bootstrap_group }}"
        mode: "0750"

    - name: Service_bootstrap | apply | ensure Ansible temp dir exists
      ansible.builtin.file:
        path: "{{ service_bootstrap_state_dir }}/.ansible/tmp"
        state: directory
        owner: "{{ service_bootstrap_user }}"
        group: "{{ service_bootstrap_group }}"
        mode: "0700"

    - name: Service_bootstrap | apply | write rendered desired-state file
      ansible.builtin.copy:
        content: "{{ service_bootstrap_yaml }}"
        dest: "{{ service_bootstrap_state_dir }}/bootstrap.yaml"
        owner: "{{ service_bootstrap_user }}"
        group: "{{ service_bootstrap_group }}"
        mode: "0600"
      no_log: true

    - name: Service_bootstrap | apply | --check
      # --check is parse + intra-file reference validation only; it returns
      # before the binary calls config.LoadEnv / RequireEnv, so it does not
      # need DATABASE_URL or SERVICE_TOKEN sourced.
      vars:
        ansible_remote_tmp: "{{ service_bootstrap_state_dir }}/.ansible/tmp"
      ansible.builtin.command:
        argv:
          - "{{ service_bootstrap_install_dir }}/{{ service_bootstrap_service }}"
          - bootstrap
          - --file
          - "{{ service_bootstrap_state_dir }}/bootstrap.yaml"
          - --check
      become_user: "{{ service_bootstrap_user }}"
      become: true
      changed_when: false

    - name: Service_bootstrap | apply | run subcommand
      # Apply needs DATABASE_URL / SERVICE_TOKEN / QUARTERMASTER_GRPC_ADDR.
      # The env file is rendered as shell-safe KEY=value assignments, so the
      # bootstrap process can source it before execing the service binary.
      #
      # We use `argv` (no shell parsing of the args list) and a tiny bash -c
      # wrapper that takes the env file as $1 and the binary argv as $@, so
      # service_bootstrap_extra_args entries can contain spaces / quotes
      # without being re-tokenized by the shell. Each entry is one argv slot.
      vars:
        ansible_remote_tmp: "{{ service_bootstrap_state_dir }}/.ansible/tmp"
      ansible.builtin.command:
        argv: >-
          {{
            ['/bin/bash', '-c',
             'set -a; . "$1"; set +a; shift; exec "$@"',
             '--',
             service_bootstrap_env_file,
             service_bootstrap_install_dir + '/' + service_bootstrap_service,
             'bootstrap',
             '--file', service_bootstrap_state_dir + '/bootstrap.yaml']
            + (service_bootstrap_extra_args | default([]))
          }}
      become_user: "{{ service_bootstrap_user }}"
      become: true
      register: service_bootstrap_apply
      changed_when: service_bootstrap_apply.rc == 0

    - name: Service_bootstrap | apply | remove desired-state file on success
      ansible.builtin.file:
        path: "{{ service_bootstrap_state_dir }}/bootstrap.yaml"
        state: absent
      when: service_bootstrap_apply is succeeded

  rescue:
    - name: Service_bootstrap | apply | preserve failed desired-state file
      ansible.builtin.copy:
        remote_src: true
        src: "{{ service_bootstrap_state_dir }}/bootstrap.yaml"
        dest: "{{ service_bootstrap_state_dir }}/bootstrap-failed-{{ ansible_facts.date_time.epoch }}.yaml"
        owner: "{{ service_bootstrap_user }}"
        group: "{{ service_bootstrap_group }}"
        mode: "0600"
      no_log: true
      failed_when: false

    - name: Service_bootstrap | apply | remove failed active desired-state file
      ansible.builtin.file:
        path: "{{ service_bootstrap_state_dir }}/bootstrap.yaml"
        state: absent
      failed_when: false

    - name: Service_bootstrap | apply | fail with bootstrap diagnostics
      ansible.builtin.fail:
        msg: |-
          {{ service_bootstrap_service }} bootstrap failed
          failed task: {{ ansible_failed_task.name | default('unknown') }}
          rc: {{ ansible_failed_result.rc | default('unknown') }}

          stdout:
          {{ ansible_failed_result.stdout | default('(no stdout)') }}

          stderr:
          {{ ansible_failed_result.stderr | default('(no stderr)') }}

          failed desired-state file:
          {{ service_bootstrap_state_dir }}/bootstrap-failed-{{ ansible_facts.date_time.epoch }}.yaml

- name: Service_bootstrap | validate
  when: service_bootstrap_mode == "validate"
  # Validate is a post-state cross-service invariant check (no rendered file
  # input). It needs the service's runtime env (DB + sibling-service gRPC),
  # so the bootstrap process sources the rendered service env file.
  vars:
    ansible_remote_tmp: "{{ service_bootstrap_state_dir }}/.ansible/tmp"
  ansible.builtin.command:
    argv:
      - /bin/bash
      - -c
      - 'set -a; . "$1"; set +a; shift; exec "$@"'
      - --
      - "{{ service_bootstrap_env_file }}"
      - "{{ service_bootstrap_install_dir }}/{{ service_bootstrap_service }}"
      - bootstrap
      - validate
  become_user: "{{ service_bootstrap_user }}"
  become: true
  changed_when: false
