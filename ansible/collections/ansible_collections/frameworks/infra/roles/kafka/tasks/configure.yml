---
- name: Render server.properties
  ansible.builtin.template:
    src: server.properties.j2
    dest: "{{ kafka_properties_path }}"
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    mode: "0644"
  notify: kafka restart

- name: Render systemd unit
  ansible.builtin.template:
    src: kafka.service.j2
    dest: "{{ kafka_unit_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: kafka restart

- name: Inspect KRaft storage format sentinel
  ansible.builtin.stat:
    path: "{{ kafka_format_sentinel }}"
  register: kafka_format_sentinel_stat
  check_mode: false
  changed_when: false

- name: Report pending KRaft storage format under --check
  ansible.builtin.debug:
    msg: "{{ kafka_service_name }} storage would be formatted for cluster {{ kafka_cluster_id }}"
  when:
    - ansible_check_mode
    - not (kafka_format_sentinel_stat.stat.exists | default(false))
  changed_when: true

- name: Format KRaft storage (once per cluster, sentinel on meta.properties)
  ansible.builtin.command: >-
    {{ kafka_bin_dir }}/kafka-storage.sh format
    -t {{ kafka_cluster_id }}
    -c {{ kafka_properties_path }}
    --ignore-formatted
  environment:
    KAFKA_HEAP_OPTS: "-Xms64m -Xmx256m"
    KAFKA_JMX_OPTS: "-Djava.awt.headless=true"
    JMX_PORT: ""
  args:
    creates: "{{ kafka_format_sentinel }}"
  become: true
  become_user: "{{ kafka_user }}"
  when: not ansible_check_mode
