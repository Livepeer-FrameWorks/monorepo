---
- name: Assert Java package mapping exists for this distro family
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family in kafka_java_package_by_family
    fail_msg: "frameworks.infra.kafka does not define a Java runtime package for os_family={{ ansible_facts.os_family }}"

- name: Probe for a compatible Java runtime
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      if ! command -v java >/dev/null 2>&1; then
        exit 1
      fi
      ver="$(java -XshowSettings:properties -version 2>&1 | awk -F'= ' '/^[[:space:]]*java.specification.version = / { print $2; exit }')"
      major="${ver%%.*}"
      if [ "$major" = "1" ]; then
        rest="${ver#1.}"
        major="${rest%%.*}"
      fi
      test -n "$major" && [ "$major" -ge 17 ]
    executable: /bin/bash
  register: kafka_java_runtime_probe
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install Java runtime
  ansible.builtin.package:
    name: "{{ kafka_java_package_by_family[ansible_facts.os_family] }}"
    state: present
  when: kafka_java_runtime_probe.rc != 0
  # async kills a stalled apt fetch at the deadline; until re-runs it.
  register: kafka_package_attempt
  until: kafka_package_attempt is succeeded
  retries: 1
  delay: 10
  async: 600
  poll: 5

- name: Ensure kafka group
  ansible.builtin.group:
    name: "{{ kafka_group }}"
    system: true

- name: Ensure kafka user
  ansible.builtin.user:
    name: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Ensure kafka dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    mode: "0755"
  loop:
    - "{{ kafka_install_dir }}"
    - "{{ kafka_role_data_dir }}"
    - "{{ kafka_role_log_dir }}"

- name: Stat Kafka binary
  ansible.builtin.stat:
    path: "{{ kafka_bin_dir }}/kafka-storage.sh"
  register: kafka_bin_stat
  check_mode: false
  changed_when: false

- name: Stat Kafka install sentinel
  ansible.builtin.stat:
    path: "{{ kafka_install_sentinel }}"
  register: kafka_install_sentinel_stat
  check_mode: false
  changed_when: false

- name: Decide whether Kafka reinstall is required
  ansible.builtin.set_fact:
    kafka_reinstall_required: >-
      {{
        not (kafka_bin_stat.stat.exists | default(false)) or
        not (kafka_install_sentinel_stat.stat.exists | default(false))
      }}

- name: Report pending Kafka reinstall under --check
  ansible.builtin.debug:
    msg: >-
      {{ kafka_service_name }} would reinstall:
      binary_exists={{ kafka_bin_stat.stat.exists | default(false) }},
      sentinel={{ kafka_install_sentinel }}
  changed_when: kafka_reinstall_required | bool
  when: ansible_check_mode

- name: Remove stale Kafka install sentinel before reinstall
  ansible.builtin.file:
    path: "{{ kafka_install_sentinel }}"
    state: absent
  when:
    - not ansible_check_mode
    - kafka_reinstall_required | default(false)

# The always section runs on every pass, so a tarball an earlier run left
# behind is removed (and reported under --check) even when nothing reinstalls.
- name: Install Kafka tarball
  block:
    - name: Download and extract Kafka tarball
      when:
        - not ansible_check_mode
        - kafka_reinstall_required | bool
      block:
        - name: Download Kafka tarball
          ansible.builtin.get_url:
            url: "{{ kafka_artifact_url }}"
            dest: "{{ kafka_tarball_path }}"
            checksum: "{{ kafka_artifact_checksum }}"
            mode: "0644"
            timeout: 300

        - name: Extract Kafka
          ansible.builtin.unarchive:
            src: "{{ kafka_tarball_path }}"
            dest: "{{ kafka_install_dir }}"
            remote_src: true
            owner: "{{ kafka_user }}"
            group: "{{ kafka_group }}"
            extra_opts:
              - --strip-components=1
            creates: "{{ kafka_install_sentinel }}"
          notify: kafka restart
  always:
    - name: Remove downloaded Kafka tarball
      ansible.builtin.file:
        path: "{{ kafka_tarball_path }}"
        state: absent

- name: Record install sentinel
  ansible.builtin.file:
    path: "{{ kafka_install_sentinel }}"
    state: touch
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    mode: "0644"
  changed_when: false
  when:
    - not ansible_check_mode
    - kafka_reinstall_required | default(true)

- name: Assert JMX exporter javaagent artifact is pinned
  ansible.builtin.assert:
    that:
      - kafka_jmx_exporter_artifact_url | length > 0
      - kafka_jmx_exporter_artifact_checksum is match('^(sha1|sha224|sha256|sha384|sha512):[0-9a-fA-F]+$')
    fail_msg: "frameworks.infra.kafka requires the pinned JMX exporter javaagent URL and checksum"

- name: Stat JMX exporter javaagent
  ansible.builtin.stat:
    path: "{{ kafka_jmx_exporter_jar }}"
    checksum_algorithm: "{{ kafka_jmx_exporter_artifact_checksum.split(':', 1)[0] }}"
  register: kafka_jmx_exporter_stat
  check_mode: false
  changed_when: false

- name: Report pending JMX exporter refresh under --check
  ansible.builtin.debug:
    msg: "kafka would refresh the pinned JMX exporter javaagent"
  changed_when: >-
    not (kafka_jmx_exporter_stat.stat.exists | default(false)) or
    (kafka_jmx_exporter_stat.stat.checksum | default('')) != kafka_jmx_exporter_artifact_checksum.split(':', 1)[1]
  when: ansible_check_mode

- name: Ensure JMX exporter directory
  ansible.builtin.file:
    path: "{{ kafka_jmx_exporter_dir }}"
    state: directory
    owner: root
    group: "{{ kafka_group }}"
    mode: "0755"

# get_url re-downloads whenever the on-disk jar no longer matches the pinned
# checksum, so a version bump replaces the jar in place.
- name: Download JMX exporter javaagent
  ansible.builtin.get_url:
    url: "{{ kafka_jmx_exporter_artifact_url }}"
    dest: "{{ kafka_jmx_exporter_jar }}"
    checksum: "{{ kafka_jmx_exporter_artifact_checksum }}"
    owner: root
    group: "{{ kafka_group }}"
    mode: "0644"
    timeout: 120
  notify: kafka restart
  when: not ansible_check_mode
