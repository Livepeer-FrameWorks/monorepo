---
- name: Create topics (idempotent via --if-not-exists)
  ansible.builtin.command: >-
    {{ kafka_bin_dir }}/kafka-topics.sh
    --bootstrap-server 127.0.0.1:{{ kafka_broker_port }}
    --create --if-not-exists
    --topic {{ item.name }}
    --partitions {{ item.partitions | default(1) }}
    --replication-factor {{ item.replication_factor | default(1) }}
    {% for k, v in (item.config | default({})).items() %} --config {{ k }}={{ v }}{% endfor %}
  environment:
    KAFKA_HEAP_OPTS: "-Xms64m -Xmx256m"
    KAFKA_JMX_OPTS: "-Djava.awt.headless=true"
    JMX_PORT: ""
  loop: "{{ kafka_topics }}"
  loop_control:
    label: "{{ item.name }}"
  register: topic_create
  changed_when: "'Created topic' in topic_create.stdout"
  when: kafka_role in ['broker', 'combined']

# --create --if-not-exists leaves an existing topic's config untouched, so the
# declared config (retention above all) is applied separately: describe the
# topic's dynamic config, and alter only the keys whose value differs.
- name: Describe topic config
  ansible.builtin.command: >-
    {{ kafka_bin_dir }}/kafka-configs.sh
    --bootstrap-server 127.0.0.1:{{ kafka_broker_port }}
    --entity-type topics --entity-name {{ item.name }}
    --describe
  environment:
    KAFKA_HEAP_OPTS: "-Xms64m -Xmx256m"
    KAFKA_JMX_OPTS: "-Djava.awt.headless=true"
    JMX_PORT: ""
  loop: "{{ kafka_topics | selectattr('config', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"
  register: kafka_topic_config_describe
  changed_when: false
  when: kafka_role in ['broker', 'combined']

- name: Apply declared config to existing topics
  ansible.builtin.command: >-
    {{ kafka_bin_dir }}/kafka-configs.sh
    --bootstrap-server 127.0.0.1:{{ kafka_broker_port }}
    --entity-type topics --entity-name {{ item.item.name }}
    --alter --add-config {{ kafka_topic_config_drift }}
  environment:
    KAFKA_HEAP_OPTS: "-Xms64m -Xmx256m"
    KAFKA_JMX_OPTS: "-Djava.awt.headless=true"
    JMX_PORT: ""
  vars:
    # Lines of the describe output look like
    #   "  retention.ms=604800000 sensitive=false synonyms={...}".
    kafka_topic_current_config: "{{ dict(item.stdout | regex_findall('(?m)^\\s+([A-Za-z0-9._-]+)=(\\S*)')) }}"
    kafka_topic_config_drift: >-
      {%- set drift = [] -%}
      {%- for key, value in item.item.config.items() -%}
      {%- if kafka_topic_current_config.get(key) != (value | string) -%}
      {%- set _ = drift.append(key ~ '=' ~ value) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ drift | join(',') }}
  loop: "{{ kafka_topic_config_describe.results | default([]) | selectattr('stdout', 'defined') | list }}"
  loop_control:
    label: "{{ item.item.name }}: {{ kafka_topic_config_drift }}"
  register: kafka_topic_config_alter
  changed_when: true
  when:
    - kafka_role in ['broker', 'combined']
    - kafka_topic_config_drift | length > 0
