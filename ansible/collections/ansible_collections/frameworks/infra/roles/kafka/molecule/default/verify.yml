---
- name: Verify (combined mode)
  hosts: kafka-instance
  become: true
  gather_facts: true
  tasks:
    - name: Refresh service facts
      ansible.builtin.service_facts:

    - name: Assert frameworks-kafka running
      ansible.builtin.assert:
        that:
          - ansible_facts.services['frameworks-kafka.service'].state == 'running'

    - name: Wait for broker port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 9092
        timeout: 60

    - name: Read the unit, broker config, and log4j2 config
      ansible.builtin.slurp:
        src: "{{ item }}"
      register: kafka_rendered
      loop:
        - /etc/systemd/system/frameworks-kafka.service
        - /opt/kafka/config/frameworks-kafka.properties
        - /opt/kafka/config/frameworks-kafka-log4j2.yaml

    - name: Assert bounded service logs and a per-partition size cap
      ansible.builtin.assert:
        that:
          - "'KAFKA_LOG4J_OPTS=-Dlog4j2.configurationFile=/opt/kafka/config/frameworks-kafka-log4j2.yaml' in (kafka_rendered.results[0].content | b64decode)"
          - "'log.retention.bytes=2147483648' in (kafka_rendered.results[1].content | b64decode)"
          - "'IfAccumulatedFileSize' in (kafka_rendered.results[2].content | b64decode)"

    - name: Assert the broker logs through the rendered config
      ansible.builtin.stat:
        path: /var/log/kafka/frameworks-kafka/server.log
      register: kafka_server_log
      failed_when: not kafka_server_log.stat.exists

    # A registered include_role never reports the included tasks' changes, so idempotence is read
    # from the host: a rerun that rewrote a rendered file changes its mtime, and the restart it
    # notifies (flushed below) changes the broker's MainPID.
    - name: Read the broker's main PID before the rerun
      ansible.builtin.command: systemctl show -p MainPID --value frameworks-kafka
      register: kafka_combined_pid_before
      changed_when: false

    - name: Stat the rendered files before the rerun
      ansible.builtin.stat:
        path: "{{ item }}"
      register: kafka_combined_files_before
      loop: "{{ kafka_combined_rendered }}"
      vars:
        kafka_combined_rendered: &kafka_combined_rendered
          - /etc/systemd/system/frameworks-kafka.service
          - /opt/kafka/config/frameworks-kafka.properties
          - /opt/kafka/config/frameworks-kafka-log4j2.yaml

    - name: Rerun role (idempotence)
      ansible.builtin.include_role:
        name: frameworks.infra.kafka

    - name: Run the restarts the rerun notified
      ansible.builtin.meta: flush_handlers

    - name: Read the broker's main PID after the rerun
      ansible.builtin.command: systemctl show -p MainPID --value frameworks-kafka
      register: kafka_combined_pid_after
      changed_when: false

    - name: Stat the rendered files after the rerun
      ansible.builtin.stat:
        path: "{{ item }}"
      register: kafka_combined_files_after
      loop: *kafka_combined_rendered

    - name: Fail if the rerun rewrote a file or restarted the broker
      ansible.builtin.assert:
        that:
          - kafka_combined_pid_before.stdout | int > 0
          - kafka_combined_pid_after.stdout == kafka_combined_pid_before.stdout
          - >-
            kafka_combined_files_before.results | map(attribute='stat.mtime') | list
            == kafka_combined_files_after.results | map(attribute='stat.mtime') | list
        fail_msg: >-
          kafka role not idempotent: MainPID {{ kafka_combined_pid_before.stdout }} ->
          {{ kafka_combined_pid_after.stdout }}; mtimes
          {{ kafka_combined_files_before.results | map(attribute='stat.mtime') | list }} ->
          {{ kafka_combined_files_after.results | map(attribute='stat.mtime') | list }}

# Restarting the controller must leave the colocated broker's JVM running: each
# unit stops with SIGTERM to its own process, while kafka-server-stop.sh would
# signal every Kafka JVM on the host.
- name: Verify (split mode)
  hosts: kafka-split-instance
  become: true
  gather_facts: true
  tasks:
    - name: Refresh service facts
      ansible.builtin.service_facts:

    - name: Assert the controller and broker units run
      ansible.builtin.assert:
        that:
          - ansible_facts.services['frameworks-kafka-controller.service'].state == 'running'
          - ansible_facts.services['frameworks-kafka.service'].state == 'running'

    - name: Wait for the broker and controller ports
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item }}"
        timeout: 60
      loop: [9092, 9093]

    - name: Read the broker's main PID before the controller restart
      ansible.builtin.command: systemctl show -p MainPID --value frameworks-kafka
      register: kafka_broker_pid_before
      changed_when: false

    - name: Restart the controller through the role
      ansible.builtin.include_role:
        name: frameworks.infra.kafka
        tasks_from: restart
      vars:
        kafka_role: controller
        kafka_node_id: 1
        kafka_jmx_port: 9406

    - name: Read the broker's main PID and state after the controller restart
      ansible.builtin.command: systemctl show -p MainPID -p ActiveState frameworks-kafka
      register: kafka_broker_after
      changed_when: false

    - name: Assert the broker JVM survived the controller restart
      ansible.builtin.assert:
        that:
          - kafka_broker_pid_before.stdout | int > 0
          - "('MainPID=' ~ kafka_broker_pid_before.stdout) in kafka_broker_after.stdout_lines"
          - "'ActiveState=active' in kafka_broker_after.stdout_lines"
        fail_msg: >-
          broker before: {{ kafka_broker_pid_before.stdout }};
          after: {{ kafka_broker_after.stdout_lines | join(', ') }}

    - name: Read the KRaft quorum through the broker after the restart
      ansible.builtin.command: >-
        /opt/kafka/bin/kafka-metadata-quorum.sh --bootstrap-server 127.0.0.1:9092 describe --status
      environment:
        KAFKA_HEAP_OPTS: "-Xms64m -Xmx256m"
        KAFKA_JMX_OPTS: "-Djava.awt.headless=true"
      register: kafka_quorum_status
      changed_when: false
      retries: 12
      delay: 5
      until: kafka_quorum_status.rc == 0 and kafka_quorum_status.stdout is search('LeaderId:\s+1')

    - name: Read the controller's main PID after its restart
      ansible.builtin.command: systemctl show -p MainPID --value frameworks-kafka-controller
      register: kafka_controller_pid_before
      changed_when: false

    - name: Rerun the split roles (idempotence)
      ansible.builtin.include_role:
        name: frameworks.infra.kafka
      vars:
        kafka_role: "{{ kafka_split_item.role }}"
        kafka_node_id: "{{ kafka_split_item.id }}"
        kafka_jmx_port: "{{ kafka_split_item.jmx }}"
      loop:
        - { role: controller, id: 1, jmx: 9406 }
        - { role: broker, id: 2, jmx: 9405 }
      loop_control:
        loop_var: kafka_split_item

    - name: Run the restarts the rerun notified
      ansible.builtin.meta: flush_handlers

    - name: Read the broker's and controller's main PIDs after the rerun
      ansible.builtin.command: systemctl show -p MainPID --value {{ item }}
      register: kafka_split_pids_rerun
      changed_when: false
      loop: [frameworks-kafka, frameworks-kafka-controller]

    - name: Assert the rerun restarted neither unit
      ansible.builtin.assert:
        that:
          - kafka_controller_pid_before.stdout | int > 0
          - kafka_split_pids_rerun.results[0].stdout == kafka_broker_pid_before.stdout
          - kafka_split_pids_rerun.results[1].stdout == kafka_controller_pid_before.stdout
        fail_msg: >-
          kafka split roles not idempotent: broker {{ kafka_broker_pid_before.stdout }} ->
          {{ kafka_split_pids_rerun.results[0].stdout }}, controller {{ kafka_controller_pid_before.stdout }} ->
          {{ kafka_split_pids_rerun.results[1].stdout }}
