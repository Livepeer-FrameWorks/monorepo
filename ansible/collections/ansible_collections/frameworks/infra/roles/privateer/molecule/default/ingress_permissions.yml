---
- name: Privateer public ingress custody
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Converge public ingress permissions without requiring a service artifact
      ansible.builtin.include_role:
        name: frameworks.infra.privateer
        tasks_from: ingress_permissions

    - name: Converge the nginx reload directory without tenant alias playback
      ansible.builtin.include_role:
        name: frameworks.infra.nginx
        tasks_from: reload_unit
      vars:
        nginx_tenant_alias_playback:
          enabled: false

    - name: Assert nginx did not change Privateer directory custody
      ansible.builtin.assert:
        that:
          - not nginx_ingress_parent_custody.changed

    - name: Reapply Privateer custody after nginx
      ansible.builtin.include_role:
        name: frameworks.infra.privateer
        tasks_from: ingress_permissions

    - name: Assert Privateer custody reapply is unchanged
      ansible.builtin.assert:
        that:
          - not privateer_ingress_custody.changed

    - name: Read Privateer process start before full role reapply
      ansible.builtin.command: systemctl show frameworks-privateer --property=ExecMainStartTimestampMonotonic --value
      register: privateer_start_before
      changed_when: false
      when: privateer_artifact_url | default('') | length > 0

    - name: Reapply the complete Privateer role with its pinned artifact
      ansible.builtin.include_role:
        name: frameworks.infra.privateer
      when: privateer_artifact_url | default('') | length > 0

    - name: Run pending handlers before checking process continuity
      ansible.builtin.meta: flush_handlers

    - name: Read Privateer process start after full role reapply
      ansible.builtin.command: systemctl show frameworks-privateer --property=ExecMainStartTimestampMonotonic --value
      register: privateer_start_after
      changed_when: false
      when: privateer_artifact_url | default('') | length > 0

    - name: Assert unchanged custody did not restart Privateer
      ansible.builtin.assert:
        that:
          - privateer_start_before.stdout | int > 0
          - privateer_start_before.stdout == privateer_start_after.stdout
      when: privateer_artifact_url | default('') | length > 0

    - name: Inspect the shared ingress parent
      ansible.builtin.stat:
        path: /etc/frameworks/ingress
      register: privateer_ingress_parent

    - name: Assert both roles agree without tenant alias playback
      ansible.builtin.assert:
        that:
          - privateer_ingress_parent.stat.gr_name == 'frameworks-ingress'
          - privateer_ingress_parent.stat.mode == '2750'

    - name: Inspect the ingress root
      ansible.builtin.stat:
        path: /etc/frameworks/ingress/tls
      register: privateer_ingress_root

    - name: Verify Privateer can create certificate inventory
      ansible.builtin.command:
        argv: [runuser, -u, privateer, --, test, -w, /etc/frameworks/ingress/tls]
      changed_when: false

    - name: Assert public ingress has separate certificate-reader custody
      ansible.builtin.assert:
        that:
          - privateer_ingress_root.stat.pw_name == 'privateer'
          - privateer_ingress_root.stat.gr_name == 'frameworks-ingress'
          - privateer_ingress_root.stat.mode == '2750'

- name: Preview Privateer permissions with an absent reader group
  hosts: all
  become: false
  gather_facts: false
  tasks:
    - name: Exercise the release preview through the actual check-mode CLI
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python | dirname }}/ansible-playbook"
          - --check
          - --inventory
          - "{{ ansible_inventory_sources | first }}"
          - "{{ playbook_dir }}/preview_ingress.yml"
      delegate_to: localhost
      run_once: true
      changed_when: false

- name: Verify Privateer preview made no changes
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Confirm the preview did not create the reader group
      ansible.builtin.command: getent group frameworks-ingress-preview
      register: privateer_preview_group
      failed_when: privateer_preview_group.rc != 2
      changed_when: false
