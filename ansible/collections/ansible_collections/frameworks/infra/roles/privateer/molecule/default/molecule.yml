---
role_name_check: 1
prerun: false
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: privateer-instance
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    privileged: true
    command: /usr/sbin/init
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    dns_servers:
      - "1.1.1.1"
      - "8.8.8.8"
    tmpfs:
      - /run
      - /tmp
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        # A label other than the version the artifact's binary reports, as for
        # an artifact a release carries from an earlier one: idempotence then
        # proves an unchanged artifact is neither reinstalled nor restarted.
        privateer_version: v0.0.0-carried
        # Molecule supplies artifact URL + checksum via env so CI can swap
        # them per matrix entry without editing YAML.
        privateer_artifact_url: >-
          {{ lookup('env', 'PRIVATEER_ARTIFACT_URL') | default('', true) }}
        privateer_artifact_checksum: >-
          {{ lookup('env', 'PRIVATEER_ARTIFACT_CHECKSUM') | default('', true) }}
        privateer_port: 18012
        # Mesh identity the CLI renders for a cluster host (privateer_role.go).
        # The key is a throwaway generated for this scenario; no Quartermaster
        # runs, so Privateer brings wg0 up from the empty static peer list.
        privateer_wireguard_ip: 10.88.0.1
        privateer_wireguard_port: 51820
        privateer_wireguard_private_key: AW5PYbYxjTalcb2/vshOXUehUZkMvFiomXI8cVt8MLQ=
        # The role's validation resolves quartermaster.internal through the
        # system resolver, so the seed DNS names it.
        privateer_static_dns:
          quartermaster: [10.88.0.1]
        privateer_env:
          SERVICE_TOKEN: molecule-test-token
          CLUSTER_ID: molecule
          QUARTERMASTER_GRPC_ADDR: 127.0.0.1:19002
          GRPC_ALLOW_INSECURE: "true"
          MESH_NODE_NAME: privateer-instance
          MESH_NODE_TYPE: core
          MESH_WIREGUARD_IP: 10.88.0.1
          MESH_LISTEN_PORT: "51820"
          MESH_PRIVATE_KEY_FILE: /etc/privateer/wg.key
          PRIVATEER_STATIC_PEERS_FILE: /etc/privateer/static-peers.json
verifier:
  name: ansible
