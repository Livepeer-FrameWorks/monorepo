---
# The PKI tasks stop Privateer only when they have something to repair. A
# stand-in frameworks-privateer unit runs while they converge, and its main PID
# shows whether the role stopped and restarted it. Needs no Privateer artifact.
- name: Privateer PKI repair gate
  hosts: all
  become: true
  gather_facts: true
  vars:
    pki_service_dir: /etc/frameworks/pki/services/commodore
  tasks:
    - name: Create the Privateer groups
      ansible.builtin.group:
        name: "{{ item }}"
        system: true
      loop: [privateer, frameworks]

    - name: Create the Privateer user
      ansible.builtin.user:
        name: privateer
        group: privateer
        groups: frameworks
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Create the Privateer data directory
      ansible.builtin.file:
        path: /var/lib/privateer
        state: directory
        owner: privateer
        group: privateer
        mode: "0755"

    - name: Seed converged service certificate directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: /etc/frameworks, owner: root, group: root, mode: "0755" }
        - { path: /etc/frameworks/pki, owner: privateer, group: privateer, mode: "0755" }
        - { path: /etc/frameworks/pki/services, owner: privateer, group: frameworks, mode: "2750" }
        - { path: "{{ pki_service_dir }}", owner: privateer, group: frameworks, mode: "2750" }

    - name: Seed converged service certificate files
      ansible.builtin.copy:
        dest: "{{ pki_service_dir }}/{{ item.name }}"
        content: "placeholder\n"
        owner: privateer
        group: frameworks
        mode: "{{ item.mode }}"
      loop:
        - { name: tls.crt, mode: "0644" }
        - { name: tls.key, mode: "0640" }

    - name: Install a stand-in Privateer unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/frameworks-privateer.service
        content: |
          [Service]
          ExecStart=/bin/sleep infinity
        owner: root
        group: root
        mode: "0644"

    - name: Start the stand-in Privateer
      ansible.builtin.systemd:
        name: frameworks-privateer
        state: started
        daemon_reload: true

    - name: Read the Privateer PID before a run with nothing to repair
      ansible.builtin.command:
        argv: [systemctl, show, --property=MainPID, --value, frameworks-privateer]
      register: pki_pid_before
      changed_when: false

    - name: Converge the PKI tasks with nothing to repair
      ansible.builtin.include_role:
        name: frameworks.infra.privateer
        tasks_from: pki.yml

    - name: Run the restart handler if it was notified
      ansible.builtin.meta: flush_handlers

    - name: Read the Privateer PID after a run with nothing to repair
      ansible.builtin.command:
        argv: [systemctl, show, --property=MainPID, --value, frameworks-privateer]
      register: pki_pid_clean
      changed_when: false

    - name: Assert Privateer kept running
      ansible.builtin.assert:
        that:
          - pki_pid_clean.stdout == pki_pid_before.stdout
          - pki_pid_clean.stdout != "0"
        fail_msg: >-
          Privateer was stopped although the PKI tree needed no repair
          (PID {{ pki_pid_before.stdout }} -> {{ pki_pid_clean.stdout }})

    - name: Assert the PKI tasks found nothing to repair
      ansible.builtin.assert:
        that: not (privateer_pki_repair_needed | bool)

    - name: Leave a stale write lock
      ansible.builtin.copy:
        dest: "{{ pki_service_dir }}/.tls.write.lock"
        content: ""
        owner: privateer
        group: frameworks
        mode: "0644"

    - name: Drift the key mode
      ansible.builtin.file:
        path: "{{ pki_service_dir }}/tls.key"
        mode: "0644"

    - name: Converge the PKI tasks with a repair pending
      ansible.builtin.include_role:
        name: frameworks.infra.privateer
        tasks_from: pki.yml

    - name: Run the restart handler
      ansible.builtin.meta: flush_handlers

    - name: Read the Privateer PID after the repair
      ansible.builtin.command:
        argv: [systemctl, show, --property=MainPID, --value, frameworks-privateer]
      register: pki_pid_repaired
      changed_when: false

    - name: Read the repaired key
      ansible.builtin.stat:
        path: "{{ pki_service_dir }}/tls.key"
      register: pki_key_repaired

    - name: Read the stale write lock
      ansible.builtin.stat:
        path: "{{ pki_service_dir }}/.tls.write.lock"
      register: pki_lock_repaired

    - name: Assert the repair stopped and restarted Privateer
      ansible.builtin.assert:
        that:
          - pki_pid_repaired.stdout != pki_pid_clean.stdout
          - pki_pid_repaired.stdout != "0"
          - pki_key_repaired.stat.mode == "0640"
          - not pki_lock_repaired.stat.exists
        fail_msg: >-
          The PKI repair did not stop and restart Privateer or left the tree
          unrepaired (PID {{ pki_pid_clean.stdout }} -> {{ pki_pid_repaired.stdout }})

    - name: Assert the PKI tasks found the repair
      ansible.builtin.assert:
        that: privateer_pki_repair_needed | bool

    - name: Remove the stand-in Privateer unit
      ansible.builtin.systemd:
        name: frameworks-privateer
        state: stopped

    - name: Delete the stand-in Privateer unit file
      ansible.builtin.file:
        path: /etc/systemd/system/frameworks-privateer.service
        state: absent

    - name: Reload systemd after removing the stand-in unit
      ansible.builtin.systemd:
        daemon_reload: true
