---
# The socket goes first: while it listens, a DNS query would start the
# service again through socket activation.
- name: Stop and disable privateer DNS socket
  ansible.builtin.systemd:
    name: frameworks-privateer.socket
    state: stopped
    enabled: false
  failed_when: false

- name: Stop and disable privateer
  ansible.builtin.systemd:
    name: frameworks-privateer
    state: stopped
    enabled: false
  failed_when: false

- name: Remove privateer systemd units
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/frameworks-privateer.service
    - /etc/systemd/system/frameworks-privateer.socket

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  changed_when: false
