---
- name: Privateer | require systemd-resolved # noqa: command-instead-of-module
  ansible.builtin.command: systemctl is-active systemd-resolved
  register: privateer_resolved_status
  changed_when: false
  failed_when: privateer_resolved_status.rc != 0

- name: Privateer | require resolvectl
  ansible.builtin.command: which resolvectl
  register: privateer_resolvectl_path
  changed_when: false
  check_mode: false

- name: Privateer | ensure systemd-resolved drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Privateer | configure systemd-resolved split DNS
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/frameworks-privateer.conf
    content: |
      [Resolve]
      DNSStubListener=yes
    owner: root
    group: root
    mode: "0644"
  register: privateer_resolved_dropin

- name: Privateer | restart systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted
  when:
    - privateer_resolved_status.rc == 0
    - privateer_resolved_dropin.changed
    - not ansible_check_mode

# The .internal route is per-link on wg0 rather than global resolved config:
# a global DNS=127.0.0.1 would also make Privateer a default route for every
# other name, and Privateer answers those with SERVFAIL unless UPSTREAM_DNS is
# set. Link settings made with resolvectl live only as long as the link, so the
# unit re-applies them whenever wg0 appears (bound to the wg0 device) and
# whenever Privateer restarts (PartOf), instead of once at boot.
- name: Privateer | install systemd-resolved route unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/frameworks-privateer-resolved.service
    content: |
      [Unit]
      Description=FrameWorks Privateer .internal DNS route
      Wants=systemd-resolved.service
      BindsTo=sys-subsystem-net-devices-wg0.device
      After=sys-subsystem-net-devices-wg0.device systemd-resolved.service frameworks-privateer.service
      PartOf=frameworks-privateer.service

      [Service]
      Type=oneshot
      ExecStart={{ privateer_resolvectl_path.stdout }} dns wg0 127.0.0.1
      ExecStart={{ privateer_resolvectl_path.stdout }} domain wg0 ~internal
      ExecStart={{ privateer_resolvectl_path.stdout }} default-route wg0 no
      RemainAfterExit=yes

      [Install]
      WantedBy=sys-subsystem-net-devices-wg0.device
    owner: root
    group: root
    mode: "0644"
  register: privateer_resolved_route_unit

# reenable rewrites the [Install] symlinks, which `enabled: true` leaves alone
# for a unit that is already enabled under an older WantedBy.
- name: Privateer | re-enable changed systemd-resolved route unit
  ansible.builtin.command:
    argv:
      - systemctl
      - reenable
      - frameworks-privateer-resolved.service
  changed_when: true
  when:
    - privateer_resolved_route_unit.changed
    - not ansible_check_mode

- name: Privateer | enable systemd-resolved route unit
  ansible.builtin.systemd:
    name: frameworks-privateer-resolved
    enabled: true
    daemon_reload: "{{ privateer_resolved_route_unit.changed }}"
  when: not ansible_check_mode

- name: Render Privateer environment file
  ansible.builtin.copy:
    dest: "{{ privateer_conf_dir }}/privateer.env"
    content: |
      {% for k, v in privateer_env.items() %}
      {{ k }}={{ v }}
      {% endfor %}
    owner: "{{ omit if ansible_check_mode else privateer_user }}"
    group: "{{ omit if ansible_check_mode else privateer_group }}"
    mode: "0600"
  no_log: true
  notify: privateer restart

- name: Render systemd unit
  ansible.builtin.template:
    src: privateer.service.j2
    dest: /etc/systemd/system/frameworks-privateer.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - privateer restart

- name: Render DNS socket unit
  ansible.builtin.template:
    src: privateer.socket.j2
    dest: /etc/systemd/system/frameworks-privateer.socket
    owner: root
    group: root
    mode: "0644"
  register: privateer_dns_socket_unit
