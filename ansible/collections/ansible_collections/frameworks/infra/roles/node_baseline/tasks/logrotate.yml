---
# Debian enables logrotate.timer on install; Arch and EL ship it disabled.
# Non-systemd hosts run logrotate from the package's cron job.
- name: Node_baseline | enable the logrotate timer
  ansible.builtin.systemd:
    name: logrotate.timer
    enabled: true
    state: started
  when:
    - ansible_facts.service_mgr == "systemd"
    - "'logrotate' in (ansible_facts.packages | default({}))"
