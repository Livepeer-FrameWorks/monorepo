name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: # manual trigger from Actions UI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      frontend: ${{ steps.filter.outputs.frontend }}
      registry: ${{ steps.filter.outputs.registry }}
      release: ${{ steps.filter.outputs.release }}
      database: ${{ steps.filter.outputs.database }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - '**/*.proto'
              - '**/*.sql'
              - '**/go.mod'
              - '**/go.sum'
              - 'Makefile'
              - 'scripts/run-go-contract-test.sh'
              - 'pkg/proto/**'
              - '.golangci.yml'
              - '.golangci-baseline'
            frontend:
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.svelte'
              - '**/*.js'
              - '**/*.json'
              - 'pnpm-lock.yaml'
            registry:
              - 'docs/platform-features.yaml'
              - 'scripts/registry/**'
              - 'pkg/graphql/schema.graphql'
              - 'api_gateway/internal/mcp/tools/**'
              - 'website_application/src/routes/**'
              - 'website_application/src/lib/features/registry.json'
              - 'website_docs/src/content/docs/**'
              - 'Makefile'
            release:
              - 'cli/internal/releases/catalog.yaml'
              - 'cli/pkg/provisioner/**'
              - 'pkg/database/sql/schema/**'
              - 'pkg/database/sql/clickhouse/periscope.sql'
              - 'pkg/database/sql/migrations/**'
              - 'pkg/database/sql/clickhouse/migrations/**'
              - 'scripts/check-migration-version.sh'
              - 'scripts/check-migration-version.test.sh'
              - 'scripts/reset-demo-databases.sh'
              - 'scripts/run-go-contract-test.sh'
              - 'Makefile'
            database:
              - 'api_analytics_ingest/**/*.go'
              - 'api_analytics_query/**'
              - 'api_balancing/**/*.go'
              - 'api_billing/**'
              - 'api_consultant/**'
              - 'api_control/**'
              - 'api_dns/**'
              - 'api_tenants/**'
              - 'cli/internal/releases/catalog.yaml'
              - 'cli/pkg/provisioner/**'
              - 'config/infrastructure.yaml'
              - 'docker-compose.yml'
              - 'pkg/database/**'
              - 'pkg/topology/**'
              - 'scripts/check-migration-version.sh'
              - 'scripts/check-migration-version.test.sh'
              - 'scripts/reset-demo-databases.sh'
              - 'scripts/run-go-contract-test.sh'
              - 'Makefile'

  go-build:
    name: Go build
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache-dependency-path: "**/go.sum"
        env:
          GOTOOLCHAIN: local
      - name: Install gqlgen
        run: go install github.com/99designs/gqlgen@v0.17.86
      - name: Check proto codegen is up to date
        run: make proto-check
      - name: Check sqlc codegen is up to date
        run: make sqlc-check
      - run: make build
        env:
          CGO_ENABLED: "1"

  go-test:
    name: Go test + coverage
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache-dependency-path: "**/go.sum"
        env:
          GOTOOLCHAIN: local
      - name: Install gqlgen
        run: go install github.com/99designs/gqlgen@v0.17.86
      - name: Run tests with JUnit output
        run: make test-junit
        env:
          CGO_ENABLED: "1"
      - name: Generate coverage
        run: make coverage
        env:
          CGO_ENABLED: "1"
      - name: Upload Go test results to Codecov
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        continue-on-error: true
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./test-results/go-junit.xml
          flags: go
          report_type: test_results
      - name: Print coverage summary
        run: |
          echo "=== Go Coverage Summary ==="
          if [ -f coverage/coverage.out ]; then
            go tool cover -func=coverage/coverage.out | tail -1
          else
            echo "No coverage data found"
          fi
      - name: Upload Go coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: coverage/
          if-no-files-found: warn
      - name: Upload to Codecov
        timeout-minutes: 5
        continue-on-error: true
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage.out
          flags: go
          name: go-coverage
          fail_ci_if_error: false

  go-lint:
    name: Go lint
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache-dependency-path: "**/go.sum"
        env:
          GOTOOLCHAIN: local
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.9.0
      - name: Read baseline commit
        id: baseline
        run: |
          if [ -f .golangci-baseline ]; then
            echo "rev=$(cat .golangci-baseline)" >> $GITHUB_OUTPUT
          else
            echo "rev=" >> $GITHUB_OUTPUT
          fi
      - name: Run golangci-lint
        run: |
          BASELINE="${{ steps.baseline.outputs.rev }}"
          BASELINE_ARG=""
          if [ -n "$BASELINE" ]; then
            BASELINE_ARG="--new-from-rev=$BASELINE"
          fi
          failed=0
          for dir in $(find . -name "go.mod" -exec dirname {} \;); do
            echo "==> Linting $dir"
            (cd "$dir" && golangci-lint run --timeout=5m $BASELINE_ARG ./...) || failed=1
          done
          if [ $failed -eq 1 ]; then
            exit 1
          fi
      - name: Generate lint report
        if: always()
        run: |
          mkdir -p reports
          ./scripts/lint-report.sh || true
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-lint-report
          path: reports/
          if-no-files-found: ignore

  frontend-lint:
    name: Frontend lint
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm lint
      - run: pnpm format:check

  frontend-test:
    name: Frontend test + coverage
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node-pnpm
      - name: Generate SvelteKit types
        run: pnpm --filter frameworks-frontend exec svelte-kit sync
      - run: pnpm test:coverage
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: |
            **/coverage/**
            **/lcov.info
          if-no-files-found: warn
      - name: Upload to Codecov
        timeout-minutes: 5
        continue-on-error: true
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./**/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false
      - name: Upload frontend test results to Codecov
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        continue-on-error: true
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./npm_player/packages/core/test-results/junit.xml,./npm_player/packages/react/test-results/junit.xml,./npm_player/packages/svelte/test-results/junit.xml,./npm_studio/packages/core/test-results/junit.xml,./npm_studio/packages/react/test-results/junit.xml,./npm_studio/packages/svelte/test-results/junit.xml,./website_application/test-results/junit.xml
          flags: frontend
          report_type: test_results

  frontend-build:
    name: Frontend build
    needs: [changes, frontend-lint, frontend-test]
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node-pnpm
      - name: Build with bundle analysis
        run: pnpm build
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  feature-registry:
    name: Feature registry
    needs: changes
    if: needs.changes.outputs.registry == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache-dependency-path: "**/go.sum"
        env:
          GOTOOLCHAIN: local
      - run: make verify-feature-registry

  migration-release-state:
    name: Migration release state
    needs: changes
    if: needs.changes.outputs.release == 'true' || needs.changes.outputs.database == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache-dependency-path: "**/go.sum"
        env:
          GOTOOLCHAIN: local
      - name: Validate tag, catalog, and migration versions
        run: make validate-migrations
        env:
          RELEASE_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      - name: Test release-state lifecycle guard
        run: make test-release-state
      - name: Check generated PostgreSQL queries
        run: make sqlc-check
      - name: Prove schema migration convergence
        run: make verify-schema-migrations-core
        env:
          CONTRACT_COVERAGE_DIR: ${{ github.workspace }}/coverage/contracts
      - name: Upload database contract coverage artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: postgres-clickhouse-contract-coverage
          path: coverage/contracts/
          if-no-files-found: warn
      - name: Upload PostgreSQL contract coverage to Codecov
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        continue-on-error: true
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/contracts/postgres/cli.out,coverage/contracts/postgres/purser-handlers.out,coverage/contracts/postgres/purser-grpc.out,coverage/contracts/postgres/purser-query-catalog.out,coverage/contracts/postgres/navigator-query-catalog.out,coverage/contracts/postgres/navigator-store.out,coverage/contracts/postgres/skipper-query-catalog.out,coverage/contracts/postgres/skipper-conversations.out,coverage/contracts/postgres/skipper-metering.out,coverage/contracts/postgres/skipper-reports.out,coverage/contracts/postgres/skipper-social.out,coverage/contracts/postgres/skipper-baselines.out,coverage/contracts/postgres/skipper-pagecache.out,coverage/contracts/postgres/skipper-knowledge.out,coverage/contracts/postgres/periscope-metering.out,coverage/contracts/postgres/commodore-bootstrap.out,coverage/contracts/postgres/commodore-query-catalog.out,coverage/contracts/postgres/commodore-outboxes.out,coverage/contracts/postgres/commodore-stream-cleanup.out,coverage/contracts/postgres/commodore-signing-keys.out,coverage/contracts/postgres/commodore-playback-policy.out,coverage/contracts/postgres/commodore-artifact-intents.out,coverage/contracts/postgres/commodore-artifact-catalog.out,coverage/contracts/postgres/commodore-media-retention.out,coverage/contracts/postgres/commodore-pull-source-events.out,coverage/contracts/postgres/commodore-api-tokens.out,coverage/contracts/postgres/commodore-native-auth.out,coverage/contracts/postgres/quartermaster-bootstrap.out,coverage/contracts/postgres/quartermaster-query-catalog.out,coverage/contracts/postgres/purser-stripe.out,coverage/contracts/postgres/purser-billing.out,coverage/contracts/postgres/purser-tieraccess.out,coverage/contracts/postgres/purser-bootstrap.out
          flags: postgres-contract
          name: postgres-contract-coverage
          fail_ci_if_error: false
      - name: Upload ClickHouse contract coverage to Codecov
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        continue-on-error: true
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/contracts/clickhouse/cli.out,coverage/contracts/clickhouse/periscope-ingest-writers.out,coverage/contracts/clickhouse/periscope-query.out,coverage/contracts/clickhouse/periscope-query-rpc.out
          flags: clickhouse-contract
          name: clickhouse-contract-coverage
          fail_ci_if_error: false

  database-yugabyte:
    name: Yugabyte database contract
    needs: changes
    if: needs.changes.outputs.database == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache-dependency-path: "**/go.sum"
        env:
          GOTOOLCHAIN: local
      - run: make verify-schema-yugabyte
        env:
          CONTRACT_COVERAGE_DIR: ${{ github.workspace }}/coverage/contracts
      - run: make verify-yugabyte-ha
        env:
          CONTRACT_COVERAGE_DIR: ${{ github.workspace }}/coverage/contracts
      - name: Upload Yugabyte contract coverage artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: yugabyte-contract-coverage
          path: coverage/contracts/yugabyte/
          if-no-files-found: warn
      - name: Upload Yugabyte contract coverage to Codecov
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        continue-on-error: true
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/contracts/yugabyte/schema.out,coverage/contracts/yugabyte/quartermaster-query-catalog.out,coverage/contracts/yugabyte/ha.out
          flags: yugabyte-contract
          name: yugabyte-contract-coverage
          fail_ci_if_error: false

  codecov-notify:
    name: Codecov notify
    needs: [go-test, frontend-test, frontend-build, migration-release-state, database-yugabyte]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Codecov notifications
        timeout-minutes: 5
        continue-on-error: true
        uses: codecov/codecov-action@v6
        with:
          run_command: send-notifications
          token: ${{ secrets.CODECOV_TOKEN }}

  ci-passed:
    name: CI passed
    needs:
      [
        changes,
        go-build,
        go-test,
        go-lint,
        frontend-lint,
        frontend-test,
        frontend-build,
        feature-registry,
        migration-release-state,
        database-yugabyte,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize results
        run: |
          echo '${{ toJSON(needs) }}' | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
      - name: Fail if any required job failed/cancelled
        run: |
          results='${{ toJSON(needs) }}'
          if echo "$results" | jq -e 'to_entries | any(.value.result == "failure" or .value.result == "cancelled")' >/dev/null; then
            echo "One or more jobs failed/cancelled"
            exit 1
          fi
          echo "All required jobs succeeded or were skipped"
