server {
    listen 8082;

    location /internal/artifact/ {
        proxy_pass http://127.0.0.1:18007;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # Streams request bodies like the edge's Caddy, so a chunked HTTP
    # publisher (an EBML/TS push) reaches Mist while it is still sending.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 0;
    }
}
