# Typed functions for the public operations in pkg/graphql/public, hand-written
# and generated/, generated by make graphql-sdk-go against the public schema.
# Generated operations mark each variable with a schema default
# @genqlient(omitempty: true), so an unset one keeps the default.
schema: ../pkg/graphql/public/schema.public.graphql
operations:
  - ../pkg/graphql/public/fragments/**/*.graphql
  - ../pkg/graphql/public/queries/**/*.graphql
  - ../pkg/graphql/public/mutations/**/*.graphql
  - ../pkg/graphql/public/subscriptions/**/*.graphql
  - ../pkg/graphql/public/generated/*.graphql
generated: generated.go
package: frameworks
optional: pointer
bindings:
  Time:
    type: time.Time
  JSON:
    type: encoding/json.RawMessage
  Currency:
    type: string
  Money:
    type: string
