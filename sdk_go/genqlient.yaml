# Typed functions for the curated public operations in pkg/graphql/public,
# generated by make graphql-sdk-go.
schema: ../pkg/graphql/schema.graphql
operations:
  - ../pkg/graphql/public/**/*.graphql
generated: generated.go
package: frameworks
optional: pointer
bindings:
  Time:
    type: time.Time
  JSON:
    type: encoding/json.RawMessage
  Currency:
    type: string
  Money:
    type: string
