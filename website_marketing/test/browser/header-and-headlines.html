<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Header menu and headline layout regression</title>
  <style>
    body {
      margin: 16px;
      color: #c0caf5;
      background: #1a1b26;
      font: 14px system-ui;
    }
    iframe {
      display: block;
      border: 1px solid #3b4261;
      background: #16161e;
    }
    output {
      display: block;
      margin-block: 16px;
      white-space: pre-wrap;
    }
    [data-status="fail"] {
      color: #f7768e;
    }
    [data-status="pass"] {
      color: #9ece6a;
    }
  </style>
  <h1>Header menu and headline layout regression</h1>
  <p>
    Use ?width=390 for the headline checks, ?width=1280 for the narrowest one-row desktop header and
    ?width=1440 for the desktop Resources menu. Optional ?path= picks the page (default /).
  </p>
  <output aria-live="polite">Waiting for the page…</output>
  <iframe title="Marketing page under test" height="844"></iframe>
  <script type="module">
    const query = new URLSearchParams(location.search);
    const width = [390, 768, 1280, 1440].includes(Number(query.get("width")))
      ? Number(query.get("width"))
      : 390;
    const frame = document.querySelector("iframe");
    frame.width = String(width);
    frame.src = query.get("path")?.startsWith("/") ? query.get("path") : "/";
    const nextFrame = () =>
      new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));

    frame.addEventListener("load", async () => {
      const win = frame.contentWindow;
      const doc = frame.contentDocument;
      const report = document.querySelector("output");
      const checks = [];
      const check = (label, pass, detail) => checks.push({ label, pass, detail });
      // The page arrives as prerendered HTML and React hydrates it after the
      // iframe's load event; the header only handles events once React has
      // attached to it.
      const hydrated = () => {
        const header = doc.querySelector('nav[aria-label="Primary"]');
        return header && Object.keys(header).some((key) => key.startsWith("__reactFiber"));
      };
      const deadline = Date.now() + 15000;
      while (!hydrated() && Date.now() < deadline) {
        await new Promise((resolve) => setTimeout(resolve, 50));
      }
      await doc.fonts.ready;
      await nextFrame();
      check("Header hydrated", Boolean(hydrated()), "primary navigation");

      // From xl every header item sits on one row with no label wrapping.
      const desktopNav = doc.querySelector('nav[aria-label="Primary"] .xl\\:flex');
      if (width >= 1280 && desktopNav) {
        const items = [...desktopNav.children];
        const centers = items.map((item) => {
          const rect = item.getBoundingClientRect();
          return rect.top + rect.height / 2;
        });
        // A label wraps when its text boxes sit on more than one line.
        const lineCount = (element) => {
          const walker = doc.createTreeWalker(element, win.NodeFilter.SHOW_TEXT);
          const tops = new Set();
          for (let node = walker.nextNode(); node; node = walker.nextNode()) {
            if (!node.textContent.trim()) continue;
            const range = doc.createRange();
            range.selectNodeContents(node);
            for (const box of range.getClientRects()) tops.add(Math.round(box.top));
          }
          return tops.size;
        };
        const wrapped = items.filter((item) => lineCount(item) > 1);
        check(
          "Desktop header items share one row",
          Math.max(...centers) - Math.min(...centers) <= 2 && wrapped.length === 0,
          wrapped.length
            ? `wrapped: ${wrapped.map((item) => item.textContent.trim()).join(", ")}`
            : `${items.length} items`
        );
        check(
          "Desktop header fits the page",
          desktopNav.getBoundingClientRect().right <= win.innerWidth,
          `${Math.round(desktopNav.getBoundingClientRect().right)}px / ${win.innerWidth}px`
        );
      }

      check(
        "No page overflow",
        doc.documentElement.scrollWidth <= win.innerWidth,
        `${doc.documentElement.scrollWidth}px / ${win.innerWidth}px`
      );

      // A long inline action label must not widen the headline column past its
      // frame on narrow screens, which would clip the title beside it.
      for (const frameEl of doc.querySelectorAll(".headline-stack__frame")) {
        const title = frameEl.querySelector(".headline-stack__title");
        if (!title) continue;
        check(
          `Headline fits: ${title.textContent.trim().slice(0, 40)}`,
          title.getBoundingClientRect().right <= frameEl.getBoundingClientRect().right + 1,
          `${Math.round(title.getBoundingClientRect().width)}px in ${frameEl.clientWidth}px`
        );
      }

      const trigger = doc.querySelector(".nav-menu > button");
      if (width >= 1280 && trigger) {
        const pointer = (type, target, init = {}) =>
          target.dispatchEvent(
            new win.PointerEvent(type, {
              bubbles: true,
              pointerType: "mouse",
              isPrimary: true,
              ...init,
            })
          );
        pointer("pointerout", doc.body, { relatedTarget: trigger });
        pointer("pointerover", trigger, { relatedTarget: doc.body });
        await nextFrame();
        check(
          "Mouse hover opens Resources",
          trigger.getAttribute("aria-expanded") === "true",
          `aria-expanded=${trigger.getAttribute("aria-expanded")}`
        );
        pointer("pointerdown", trigger);
        trigger.dispatchEvent(new win.MouseEvent("click", { bubbles: true }));
        await nextFrame();
        check(
          "Mouse click after hover keeps Resources open",
          trigger.getAttribute("aria-expanded") === "true",
          `aria-expanded=${trigger.getAttribute("aria-expanded")}`
        );
        doc.dispatchEvent(new win.KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
        await nextFrame();
        check(
          "Escape closes Resources",
          trigger.getAttribute("aria-expanded") === "false",
          `aria-expanded=${trigger.getAttribute("aria-expanded")}`
        );
        trigger.dispatchEvent(new win.MouseEvent("click", { bubbles: true }));
        await nextFrame();
        check(
          "Keyboard click toggles Resources open",
          trigger.getAttribute("aria-expanded") === "true",
          `aria-expanded=${trigger.getAttribute("aria-expanded")}`
        );
      }

      report.dataset.status = checks.every((c) => c.pass) ? "pass" : "fail";
      report.textContent = checks
        .map((c) => `${c.pass ? "PASS" : "FAIL"} ${c.label}: ${c.detail}`)
        .join("\n");
    });
  </script>
</html>
