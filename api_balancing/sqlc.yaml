version: "2"
sql:
  - engine: postgresql
    schema: ../pkg/database/sql/schema/foghorn.sql
    queries: internal/database/queries
    gen:
      go:
        package: foghorndb
        out: internal/database/foghorndb
        sql_package: database/sql
        emit_db_tags: true
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        omit_unused_structs: true
        overrides:
          - db_type: uuid
            go_type: string
          - db_type: uuid
            nullable: true
            go_type:
              import: database/sql
              type: NullString
          - db_type: jsonb
            go_type:
              import: encoding/json
              type: RawMessage
          - db_type: jsonb
            nullable: true
            go_type:
              import: database/sql
              type: NullString
          - db_type: text[]
            go_type:
              import: github.com/lib/pq
              type: StringArray
          - db_type: uuid[]
            go_type:
              import: github.com/lib/pq
              type: StringArray
